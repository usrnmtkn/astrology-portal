<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tldrastro</title>
    <link rel="stylesheet" href="/src/styles/startup.css" />
    <link rel="stylesheet" href="/src/styles/reader-fonts.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Noto+Sans+Symbols:wght@400;500&amp;display=swap" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="root">
      <main id="app-startup" data-loader="orbit" class="app-loading app-loading--centered app-startup" role="status" aria-live="polite" aria-busy="true">
        <svg class="startup-orbit" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle class="startup-orbit__track" cx="24" cy="24" r="16" />
          <path d="M24 8a16 16 0 0 1 16 16" />
          <circle class="startup-orbit__dot" cx="40" cy="24" r="3" />
        </svg>
        <span class="startup-artwork" aria-hidden="true">
          <!-- app-startup-poster -->
          <span class="startup-artwork__animation"></span>
        </span>
        <!-- app-startup-moon -->
        <span data-startup-message>Loading TLDR Astro…</span>
        <button type="button" class="app-loading__action" hidden>Reload page</button>
        <noscript>Enable JavaScript to use TLDR Astro.</noscript>
      </main>
    </div>
    <!-- app-startup-script -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

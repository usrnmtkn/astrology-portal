name: Verify Sky house-set depth guard

on:
  push:
    branches:
      - chatgpt/sky-house-set-depth-guard-complete-sets
    paths:
      - .github/workflows/chatgpt-verify-sky-house-set-guard.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out guard branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/sky-house-set-depth-guard-complete-sets
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run house-set depth guard regression
        run: node scripts/test-sky-placement-house-set-depth-guard.mjs
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/chatgpt-verify-sky-house-set-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/chatgpt-verify-sky-house-set-guard.yml
          git commit -m "Remove temporary Sky house-set guard verification"
          git push origin HEAD:chatgpt/sky-house-set-depth-guard-complete-sets

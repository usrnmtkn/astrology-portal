name: Calculation service availability

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: calculation-service-availability
  cancel-in-progress: false

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_BASE_URL: https://tldrastro.vercel.app
      CALCULATION_MONITOR_SUMMARY_PATH: artifacts/calculation-service-summary.md
      CALCULATION_MONITOR_REPORT_PATH: artifacts/calculation-service-status.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify the monitor itself before trusting its verdict
        run: node scripts/test-calculation-service-monitor.mjs
      - name: Check the calculation service through production health
        id: availability
        run: node scripts/monitor-calculation-service.mjs
      - name: Preserve the machine-readable observation
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ephemeris-availability
          path: artifacts/
          retention-days: 14
      - name: Persist status and history in GitHub
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v8
        env:
          AVAILABILITY_OUTCOME: ${{ steps.availability.outcome }}
          SUMMARY_PATH: artifacts/calculation-service-summary.md
          ALERT_LOGINS: ${{ vars.EPHEMERIS_ALERT_LOGINS || github.repository_owner }}
        with:
          script: |
            const fs = require("fs");
            const title = "Calculation service availability";
            const passed = process.env.AVAILABILITY_OUTCOME === "success";
            const status = passed ? "PASS" : "FAIL";
            const alertLogins = String(process.env.ALERT_LOGINS || "")
              .split(/[\s,]+/)
              .map((login) => login.replace(/^@/, "").trim())
              .filter(Boolean)
              .slice(0, 10);
            const alertMentions = alertLogins.map((login) => `@${login}`).join(" ");
            const alertMessage = passed || !alertMentions
              ? ""
              : `Action required: ${alertMentions} ephemeris readiness could not be verified. Review the failed probe before using affected calculations.`;
            const summary = fs.existsSync(process.env.SUMMARY_PATH)
              ? fs.readFileSync(process.env.SUMMARY_PATH, "utf8").trim()
              : "The check ended before a structured summary was written.";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "# Calculation service availability monitor",
              "",
              "This check calculates current facts with the web Swiss engine and verifies the calculation service readiness. Independent NASA/JPL accuracy verification remains a separate monitor.",
              "",
              `Latest result: **${status}**`,
              `Latest run: [${context.runId}](${runUrl})`,
              alertMessage,
              "",
              summary,
              "",
              "Readiness is checked every 15 minutes, subject to GitHub scheduling delays. Only outage and recovery transitions notify; each run retains a machine-readable observation."
            ].join("\n");
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100
            });
            let issue = issues.find((candidate) => !candidate.pull_request && candidate.title === title);
            if (!issue && passed) return;
            const expectedState = passed ? "closed" : "open";
            // Repeated outages and healthy checks retain their run evidence
            // without sending another issue notification.
            if (issue?.state === expectedState && issue.body?.includes(`Latest result: **${status}**`)) return;
            let createdNow = false;
            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                assignees: alertLogins
              });
              issue = created.data;
              createdNow = true;
            }
            const update = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
              state: passed ? "closed" : "open"
            };
            if (!passed && alertLogins.length) update.assignees = alertLogins;
            await github.rest.issues.update(update);
            if (createdNow) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `## ${status} — run ${context.runId}\n\n[Open workflow run](${runUrl})\n\n${alertMessage ? `${alertMessage}\n\n` : ""}${summary}`
            });

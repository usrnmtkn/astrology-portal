name: Patch Content Studio reader destinations once

on:
  push:
    branches:
      - chatgpt/content-studio-reader-destinations

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply reader destination patch
        run: python scripts/patch-content-studio-reader-destinations.py
      - name: Install dependencies
        run: npm ci
      - name: Verify destination UX
        run: |
          node scripts/test-admin-reader-destination-labels.mjs
          node scripts/test-admin-friends-transits-navigation.mjs
          node --experimental-strip-types scripts/test-admin-transit-natal-sources.mjs
          node --import tsx scripts/test-admin-house-transit-sources.mjs
          npm run build:admin
      - name: Commit destination UX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/GeneratedContentAdminDashboard.tsx apps/admin/src/admin-components.css scripts/test-admin-reader-destination-labels.mjs
          git commit -m "Show reader destinations in Content Studio editors"
          git push origin HEAD:chatgpt/content-studio-reader-destinations

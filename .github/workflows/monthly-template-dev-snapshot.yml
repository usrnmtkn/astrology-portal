name: Monthly template development snapshot
on:
  push:
    branches: [chatgpt/monthly-template-ai-writer-v1]
    paths: [.github/workflows/monthly-template-dev-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @tldr/astro-knowledge
      - name: Archive source and dependencies
        run: |
          tar --exclude-vcs -czf /tmp/monthly-template-source.tar.gz .
          find . -type d -name node_modules -prune -print0 > /tmp/dependency-paths
          printf '.git\0packages/astro-knowledge/dist\0' >> /tmp/dependency-paths
          tar --null -T /tmp/dependency-paths -czf /tmp/monthly-template-deps.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-template-source
          path: /tmp/monthly-template-source.tar.gz
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-template-deps
          path: /tmp/monthly-template-deps.tar.gz
          retention-days: 1
          compression-level: 0

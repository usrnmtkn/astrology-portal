name: Temporary Step 4 Friends policy assertion QA

on:
  push:
    branches:
      - chatgpt/content-studio-step4-release

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply stale assertion repair
        run: python scripts/temporary-step4-friends-policy-test-fix.py
      - name: Validate startup and bundle contracts
        run: |
          git diff --check
          node --experimental-strip-types scripts/test-friends-content-loading-policy.mjs
          npm run build
          npm run qa:bundle
          npm run test:performance-contracts
      - name: Commit tested assertion repair and clean QA scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temporary-step4-friends-policy-test-fix.yml
          rm scripts/temporary-step4-friends-policy-test-fix.py
          git add -A scripts/test-friends-content-loading-policy.mjs \
                     .github/workflows/temporary-step4-friends-policy-test-fix.yml \
                     scripts/temporary-step4-friends-policy-test-fix.py
          git commit -m "test(content): follow compatibility packaging boundary"
          git push

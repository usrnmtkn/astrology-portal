name: Promote You Personal Transit refresh

on:
  push:
    branches:
      - chatgpt/refresh-you-personal-transit-corpus

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded You corpus promotion
        run: node scripts/promote-you-transit-refresh-v1.mjs --apply
      - name: Rebuild fallback browser bundle
        run: npx esbuild apps/web/src/content/fallbackArchitectureV3/resolver/index.browser.ts --bundle --format=esm --outfile=apps/web/src/content/fallbackArchitectureV3/dist/tldr-content.js
      - name: Rebuild fallback package manifests
        run: npm run build:fallback-manifest
      - name: Verify You refresh integrity
        run: node scripts/test-you-transit-refresh-v1.mjs
      - name: Verify Friends corpus unchanged
        run: |
          node scripts/test-sun-friends-serving-v1.mjs
          node scripts/test-friends-transit-nonsun-serving-v1.mjs
      - name: Verify package cache contract
        run: node scripts/test-fallback-package-cache-contract.mjs
      - name: Verify Content Studio transit editor contract
        run: node scripts/test-content-studio-transit-friend-editor.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build web
        run: npm run build:web
      - name: Commit promoted corpus and generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No promotion changes."
            exit 0
          fi
          git commit -m "Refresh You Personal Transit corpus from current Friends semantics"
          git push origin HEAD:chatgpt/refresh-you-personal-transit-corpus

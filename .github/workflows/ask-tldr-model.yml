name: Ask TLDR model

on:
  pull_request:
    paths:
      - "api/_lib/ask-tldr-*.ts"
      - "config/ask-tldr/**"
      - "scripts/test-ask-tldr-*.mjs"
      - "scripts/audit-ask-tldr-*.mjs"
      - ".github/workflows/ask-tldr-model.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Ask TLDR taxonomy
        run: npx tsx scripts/test-ask-tldr-question-taxonomy.mjs

      - name: Validate Ask TLDR free-text classifier
        run: npx tsx scripts/test-ask-tldr-classifier.mjs

      - name: Validate Ask TLDR answer model
        run: npx tsx scripts/test-ask-tldr-answer-model.mjs

      - name: Validate Ask TLDR calculated evidence adapter
        run: npx tsx scripts/test-ask-tldr-evidence-adapter.mjs

      - name: Validate Ask TLDR governed evidence
        run: npx tsx scripts/test-ask-tldr-governed-evidence.mjs

      - name: Validate Ask TLDR owner voice receipt
        run: npx tsx scripts/test-ask-tldr-voice-receipt.mjs

      - name: Validate Ask TLDR writer contract
        run: npx tsx scripts/test-ask-tldr-writer.mjs

      - name: Validate Ask TLDR post-write fact lock
        run: npx tsx scripts/test-ask-tldr-fact-lock.mjs

      - name: Validate Ask TLDR answer judge
        run: npx tsx scripts/test-ask-tldr-judge.mjs

      - name: Validate Ask TLDR calibration release packet
        run: npx tsx scripts/test-ask-tldr-release.mjs

      - name: Validate Ask TLDR end-to-end calibration pipeline
        run: npx tsx scripts/test-ask-tldr-pipeline.mjs

      - name: Validate Ask TLDR bounded provider harness
        run: npx tsx scripts/test-ask-tldr-provider.mjs

      - name: Audit all Ask TLDR evergreen questions on frozen facts
        run: npx tsx scripts/audit-ask-tldr-evergreen-support.mjs

name: Apply Content Studio editor stack fix

on:
  push:
    branches:
      - chatgpt/fix-editor-stack-layout

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-editor-stack-layout
          fetch-depth: 0
      - name: Stack editor sections in normal flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/admin/src/admin-components.css')
          text = path.read_text()

          old = '''.admin-dashboard .admin-editor-panel > .admin-post-editor {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-bottom: calc(var(--admin-space-10xl) + var(--admin-space-4xl));
  scroll-padding-bottom: calc(var(--admin-space-10xl) + var(--admin-space-4xl));
}
'''
          new = '''.admin-dashboard .admin-editor-panel > .admin-post-editor {
  align-content: initial;
  align-items: stretch;
  display: flex;
  flex: 1 1 0;
  flex-direction: column;
  gap: var(--admin-space-6xl);
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-bottom: calc(var(--admin-space-10xl) + var(--admin-space-4xl));
  scroll-padding-bottom: calc(var(--admin-space-10xl) + var(--admin-space-4xl));
}
'''
          if old not in text:
              raise SystemExit('Expected admin-post-editor shell block was not found.')
          text = text.replace(old, new, 1)

          old_detail = '''.admin-dashboard .admin-editor-panel > .admin-post-editor > .admin-editor-settings,
.admin-dashboard .admin-editor-panel > .admin-post-editor > .admin-review-json {
  align-self: start;
  border: var(--border-width-thin) solid var(--admin-ui-border) !important;
'''
          new_detail = '''.admin-dashboard .admin-editor-panel > .admin-post-editor > .admin-editor-settings,
.admin-dashboard .admin-editor-panel > .admin-post-editor > .admin-editor-key-details,
.admin-dashboard .admin-editor-panel > .admin-post-editor > .admin-review-json {
  align-self: stretch;
  border: var(--border-width-thin) solid var(--admin-ui-border) !important;
  flex: 0 0 auto;
'''
          if old_detail not in text:
              raise SystemExit('Expected detail-card block was not found.')
          text = text.replace(old_detail, new_detail, 1)

          path.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git rm .github/workflows/chatgpt-fix-editor-stack.yml
          git add apps/admin/src/admin-components.css
          git commit -m "fix(admin): stack editor sections in normal flow"
          git push origin HEAD:chatgpt/fix-editor-stack-layout

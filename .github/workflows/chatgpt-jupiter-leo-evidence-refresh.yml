name: Refresh approved Jupiter Leo writing evidence

on:
  push:
    branches:
      - chatgpt/jupiter-leo-12-owner-approved-current-main

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/jupiter-leo-12-owner-approved-current-main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh writing evidence indexes
        run: npm run refresh:writing-evidence
      - name: Recheck fallback package freshness
        run: node scripts/generate-fallback-package-manifest.mjs --check
      - name: Commit refreshed evidence and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-jupiter-leo-evidence-refresh.yml
          git add data packages apps scripts src
          if git diff --cached --quiet; then
            echo "No refreshed evidence changes to commit."
            exit 1
          fi
          git commit -m "Refresh writing evidence for approved Jupiter in Leo house set"
          git push origin HEAD:chatgpt/jupiter-leo-12-owner-approved-current-main

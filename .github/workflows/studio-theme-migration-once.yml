name: One-time Studio theme ownership migration

on:
  push:
    branches:
      - chatgpt/admin-design-system-audit-phase2-20260916
    paths:
      - ".github/workflows/studio-theme-migration-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/admin-design-system-audit-phase2-20260916
      - name: Move Studio theme ownership out of the reader theme
        run: |
          python - <<'PY'
          from pathlib import Path

          studio_path = Path('apps/admin/src/studio-system.css')
          studio = studio_path.read_text()
          old_import = '@import "../../web/src/styles/theme.css";'
          new_import = '@import "./admin-theme.css";'
          if studio.count(old_import) != 1:
              raise SystemExit(f'Expected exactly one web-theme import, found {studio.count(old_import)}')
          studio = studio.replace(old_import, new_import, 1)
          studio_path.write_text(studio)

          web_theme_path = Path('apps/web/src/styles/theme.css')
          web_theme = web_theme_path.read_text()
          marker = '/* Studio design system — desktop adaptation of the reviewed design reference.'
          if web_theme.count(marker) != 1:
              raise SystemExit(f'Expected exactly one Studio theme marker, found {web_theme.count(marker)}')
          prefix, studio_tail = web_theme.split(marker, 1)
          if ':root .admin-dashboard {' not in studio_tail:
              raise SystemExit('Studio theme marker did not lead to the expected scoped token block')
          if '--studio-button-height:' not in studio_tail or '--workspace-primary:' not in studio_tail:
              raise SystemExit('Studio token block is incomplete; refusing to truncate the web theme')
          web_theme_path.write_text(prefix.rstrip() + '\n')
          PY
      - name: Commit the migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/studio-system.css apps/web/src/styles/theme.css
          git diff --cached --check
          git commit -m "Move Content Studio theme ownership to admin theme"
          git push origin HEAD:chatgpt/admin-design-system-audit-phase2-20260916

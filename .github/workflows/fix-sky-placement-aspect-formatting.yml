name: Fix sky placement aspect formatting

on:
  push:
    branches:
      - fix/sky-placement-aspect-dates-spacing-20260907

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/sky-placement-aspect-dates-spacing-20260907
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply bounded repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "apps/web/src/App.tsx",
              '''      const body = aspectDetail.body
                .filter((paragraph): paragraph is string => typeof paragraph === "string")
                .map((paragraph) => stripLegacySkyArticleScaffoldPrefix(stripTldrPrefix(paragraph)).trim())
                .filter((paragraph) => paragraph && isReaderFacingCopy(paragraph))
                .join("\\n\\n");

              if (!body) return [];

              return [{
                orb: aspect.orb,
                section: {
                  heading: aspectDetail.title,
                  body,
''',
              '''      const body = aspectDetail.body
                .filter((paragraph): paragraph is string => typeof paragraph === "string")
                .map((paragraph) => stripLegacySkyArticleScaffoldPrefix(stripTldrPrefix(paragraph)).trim())
                .filter((paragraph) => paragraph && isReaderFacingCopy(paragraph))
                .join("\\n\\n");
              const exactDate = skyPlacementAspectExactDate(aspect, generatedAt, positions);

              if (!body) return [];

              return [{
                orb: aspect.orb,
                section: {
                  heading: aspectDetail.title,
                  body: `${exactDate}\\n\\n${body}`,
'''
          )

          replace_once(
              "apps/web/src/features/sky/SkyDetailArticle.tsx",
              '''function skyPlacementDateLine(value: ReactNode) {
            if (typeof value !== "string") {
              return null;
            }

            const normalized = value.replace(/\\s+/gu, " ").trim();
            return skyPlacementDateLinePattern.test(normalized) ? normalized : null;
          }

          export function SkyDetailArticle({
''',
              '''function skyPlacementDateLine(value: ReactNode) {
            if (typeof value !== "string") {
              return null;
            }

            const normalized = value.replace(/\\s+/gu, " ").trim();
            return skyPlacementDateLinePattern.test(normalized) ? normalized : null;
          }

          const skyAspectExactDateLinePattern = /^(?:January|February|March|April|May|June|July|August|September|October|November|December)\\s+\\d{1,2}(?:,\\s+\\d{4})?$/iu;

          function skyAspectExactDateLine(value: ReactNode) {
            if (typeof value !== "string") {
              return null;
            }

            const normalized = value.replace(/\\s+/gu, " ").trim();
            return skyAspectExactDateLinePattern.test(normalized) ? normalized : null;
          }

          export function SkyDetailArticle({
'''
          )

          replace_once(
              "apps/web/src/features/sky/SkyDetailArticle.tsx",
              '''                      const bodyParagraphs = typeof section.body === "string"
                        ? fullDetailReaderFacingParagraphs([section.body]).map((paragraph) => stripLegacySkyArticleScaffoldPrefix(paragraph)).filter(Boolean)
                        : [];
                      const sectionHeading = typeof section.heading === "string" ? section.heading : "";
''',
              '''                      const rawBodyParagraphs = typeof section.body === "string"
                        ? fullDetailReaderFacingParagraphs([section.body]).map((paragraph) => stripLegacySkyArticleScaffoldPrefix(paragraph)).filter(Boolean)
                        : [];
                      const exactDateLine = skyAspectExactDateLine(rawBodyParagraphs[0]);
                      const bodyParagraphs = exactDateLine ? rawBodyParagraphs.slice(1) : rawBodyParagraphs;
                      const sectionHeading = typeof section.heading === "string" ? section.heading : "";
'''
          )

          replace_once(
              "apps/web/src/features/sky/SkyDetailArticle.tsx",
              '''                          {sectionHeading ? (
                            <div className="article-related-aspects__copy-heading">
                              {glyphParts ? <AspectGlyphs from={glyphParts.from} aspect={glyphParts.aspect} to={glyphParts.to} /> : null}
                              <h4>{sectionHeading}</h4>
                            </div>
                          ) : null}
                          {sourceTag && !bodyAlreadyStartsWithTag ? <p>{sourceTag}</p> : null}
''',
              '''                          {sectionHeading ? (
                            <div className="article-related-aspects__copy-heading">
                              {glyphParts ? <AspectGlyphs from={glyphParts.from} aspect={glyphParts.aspect} to={glyphParts.to} /> : null}
                              <h4>{sectionHeading}</h4>
                            </div>
                          ) : null}
                          {exactDateLine ? <p className="article-related-aspects__date">Exact · {exactDateLine}</p> : null}
                          {sourceTag && !bodyAlreadyStartsWithTag ? <p>{sourceTag}</p> : null}
'''
          )

          replace_once(
              "apps/web/src/features/sky/SkyDetailArticle.tsx",
              '<div className="article-related-aspects__copy-heading"><h4>{southNodeHeading}</h4></div>',
              '<div className="article-related-aspects__copy-heading article-related-aspects__copy-heading--paired"><h4>{southNodeHeading}</h4></div>'
          )

          replace_once(
              "apps/web/src/styles/sky.css",
              '''.article-related-aspects__copy-heading :is(h3, h4) {
''',
              '''.article-related-aspects__date {
            margin: 0 0 var(--sp-4);
            color: var(--muted);
            font-size: var(--type-sm);
          }

          .article-related-aspects__copy-heading--paired {
            margin-top: var(--sp-6);
          }

          .article-related-aspects__copy-heading :is(h3, h4) {
'''
          )

          replace_once(
              "scripts/test-sky-placement-exact-aspect-authority.mjs",
              '''assert.match(builder, /const resolvedSections = aspects[\\s\\S]*?\\.sort\\(\\(first, second\\) => first\\.orb - second\\.orb\\)/u);
          assert.match(builder, /return resolvedSections\\.map\\(\\(\\{ section \\}\\) => section\\);/u);
''',
              '''assert.match(builder, /const resolvedSections = aspects[\\s\\S]*?\\.sort\\(\\(first, second\\) => first\\.orb - second\\.orb\\)/u);
          assert.match(builder, /const exactDate = skyPlacementAspectExactDate\\(aspect, generatedAt, positions\\);/u);
          assert.match(builder, /body: `\\$\\{exactDate\\}\\\\n\\\\n\\$\\{body\\}`/u);
          assert.match(builder, /return resolvedSections\\.map\\(\\(\\{ section \\}\\) => section\\);/u);
'''
          )

          replace_once(
              "scripts/test-calendar-south-node-serving.mjs",
              '''assert.match(
            skyDetailSource,
            /southNodeMatch[\\s\\S]*?article-related-aspects__copy-heading[\\s\\S]*?<h4>\\{southNodeHeading\\}<\\/h4>/u,
            "Paired South Node copy must render with the same aspect subtitle treatment as the North Node heading."
          );

          console.log("South Node Calendar serving + Content Studio contract passed", {
''',
              '''assert.match(
            skyDetailSource,
            /southNodeMatch[\\s\\S]*?article-related-aspects__copy-heading[\\s\\S]*?<h4>\\{southNodeHeading\\}<\\/h4>/u,
            "Paired South Node copy must render with the same aspect subtitle treatment as the North Node heading."
          );
          assert.match(
            skyDetailSource,
            /article-related-aspects__copy-heading article-related-aspects__copy-heading--paired/u,
            "Paired South Node copy must carry a dedicated spacing hook."
          );
          assert.match(
            skyDetailSource,
            /skyAspectExactDateLine[\\s\\S]*?article-related-aspects__date/u,
            "Sky placement aspect cards must render their exact date as metadata."
          );
          const skyCssSource = fs.readFileSync(path.join(repoRoot, "apps/web/src/styles/sky.css"), "utf8");
          assert.match(
            skyCssSource,
            /\\.article-related-aspects__copy-heading--paired\\s*\\{[^}]*margin-top:/su,
            "Paired South Node subsection must have explicit vertical separation."
          );

          console.log("South Node Calendar serving + Content Studio contract passed", {
'''
          )

          print("Applied bounded Sky placement aspect repair.")
          PY

      - name: Verify focused contracts
        run: |
          node scripts/test-sky-placement-exact-aspect-authority.mjs
          node scripts/test-calendar-south-node-serving.mjs

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Commit verified repair and remove staging workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-sky-placement-aspect-formatting.yml
          git add apps/web/src/App.tsx apps/web/src/features/sky/SkyDetailArticle.tsx apps/web/src/styles/sky.css scripts/test-sky-placement-exact-aspect-authority.mjs scripts/test-calendar-south-node-serving.mjs
          git commit -m "Fix sky placement aspect dates and spacing"
          git push origin HEAD:fix/sky-placement-aspect-dates-spacing-20260907

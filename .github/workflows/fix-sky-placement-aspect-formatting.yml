name: Fix sky placement aspect formatting

on:
  push:
    branches:
      - fix/sky-placement-aspect-dates-spacing-20260907

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sky-placement-aspect-dates-spacing-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @tldr/astro-knowledge
      - run: python .github/scripts/apply-sky-placement-aspect-formatting.py
      - run: node scripts/test-sky-placement-exact-aspect-authority.mjs
      - run: node scripts/test-calendar-south-node-serving.mjs
      - run: npm run typecheck
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-sky-placement-aspect-formatting.yml
          git rm .github/scripts/apply-sky-placement-aspect-formatting.py
          git add apps/web/src/App.tsx apps/web/src/features/sky/SkyDetailArticle.tsx apps/web/src/styles/sky.css scripts/test-sky-placement-exact-aspect-authority.mjs scripts/test-calendar-south-node-serving.mjs
          git commit -m "Fix sky placement aspect dates and spacing"
          git push origin HEAD:fix/sky-placement-aspect-dates-spacing-20260907

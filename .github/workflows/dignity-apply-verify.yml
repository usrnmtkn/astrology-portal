name: Apply and verify dignity integration

on:
  push:
    branches: ['codex/planet-sign-dignity-20260916']
    paths: ['.github/workflows/dignity-apply-verify.yml', '.dignity-transport/**']

permissions:
  contents: write

concurrency:
  group: dignity-apply-verify
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATE_REPORT_DOCUMENTS: ${{ secrets.PRIVATE_REPORT_DOCUMENTS }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/planet-sign-dignity-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply narrowly scoped fixture corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --quiet
          git merge --no-edit origin/main
          if test -f .dignity-transport/compat.json; then
            python3 - <<'PY'
          import json, pathlib, subprocess
          edits = json.loads(pathlib.Path('.dignity-transport/compat.json').read_text())
          paths = []
          for edit in edits:
              p = pathlib.Path(edit['path'])
              assert str(p).startswith(('apps/', 'scripts/')) and '..' not in p.parts
              text = p.read_text()
              assert text.count(edit['before']) == edit.get('count', 1), str(p)
              p.write_text(text.replace(edit['before'], edit['after']))
              paths.append(str(p))
          subprocess.run(['git','add','--',*sorted(set(paths))], check=True)
          PY
            git rm .dignity-transport/compat.json
            git diff --cached --check
            git commit -m 'Use existing draft and actual base stylesheet in dignity regression fixtures'
          fi
          git push origin HEAD:refs/heads/codex/planet-sign-dignity-20260916
      - run: npm ci
      - name: Rebuild the actual reader and shared catalogs
        run: |
          mkdir -p test-results/dignity-review
          npm run prepare:app-test-dependencies > test-results/dignity-review/prepare.log 2>&1
          npx esbuild apps/web/src/content/fallbackArchitectureV3/resolver/index.browser.ts --bundle --format=esm --platform=browser --outfile=apps/web/src/content/fallbackArchitectureV3/dist/tldr-content.js
          npm run build:fallback-manifest > test-results/dignity-review/manifest.log 2>&1
          node --import tsx scripts/build-studio-variable-catalog.mts > test-results/dignity-review/catalog-build.log 2>&1
      - name: Run independent feature checks and compare unchanged global CSS debt
        shell: bash
        run: |
          set +e
          failed=0
          check() {
            name="$1"; shift
            "$@" > "test-results/dignity-review/$name.log" 2>&1
            result=$?
            printf '%s\t%s\n' "$name" "$result" | tee -a test-results/dignity-review/status.tsv
            if test "$result" -ne 0; then
              failed=1
              echo "::error::$name failed"
              tail -60 "test-results/dignity-review/$name.log"
            else
              tail -4 "test-results/dignity-review/$name.log"
            fi
          }
          check dignity npm run test:placement-dignity
          check ingress node --import tsx scripts/test-sky-ingress-composition.mts
          check article-variables npm run test:sky-placement-article-variables
          check sky-variables node --import tsx scripts/test-sky-placement-variables.mts
          check catalog npm run test:studio-variables
          check actual-api node --import tsx scripts/test-sky-placement-studio-api.mts
          check typecheck npm run typecheck
          check build-web npm run build:web
          check build-admin npm run build:admin
          check css-consistency node scripts/run-css-consistency-audit.mjs
          check css-architecture node scripts/run-studio-css-architecture-audit.mjs
          check css-baseline node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync, spawnSync} from 'node:child_process';
          import {mkdtempSync,readFileSync,writeFileSync,symlinkSync,rmSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import path from 'node:path';
          const root=process.cwd(), baseline=mkdtempSync(path.join(tmpdir(),'dignity-css-main-'));
          const out=path.join(root,'test-results/dignity-review');
          try {
            const archive=execFileSync('git',['archive','origin/main','package.json','scripts','apps/web/src/styles','apps/admin/src'],{maxBuffer:30*1024*1024});
            execFileSync('tar',['-x','-C',baseline],{input:archive});
            symlinkSync(path.join(root,'node_modules'),path.join(baseline,'node_modules'),'dir');
            const audit=cwd=>spawnSync('npm',['run','qa:css-audit'],{cwd,encoding:'utf8',maxBuffer:10*1024*1024});
            const feature=audit(root), before=audit(baseline);
            writeFileSync(path.join(out,'css-global.log'),feature.stdout+'\n'+feature.stderr);
            writeFileSync(path.join(out,'css-main.log'),before.stdout+'\n'+before.stderr);
            const normalize=(cwd,file)=>readFileSync(path.join(cwd,'test-results/css-audit',file),'utf8').replaceAll(cwd,'<repo>');
            for(const file of ['latest.md','token-integrity.md']) {
              const actual=normalize(root,file), expected=normalize(baseline,file);
              writeFileSync(path.join(out,'css-'+file),actual);
              assert.equal(actual,expected,'This feature must not introduce or alter CSS audit findings');
            }
            assert.equal(feature.status,before.status,'CSS audit exit status must match main');
            writeFileSync(path.join(out,'css-baseline.json'),JSON.stringify({base:execFileSync('git',['rev-parse','origin/main'],{encoding:'utf8'}).trim(),featureAuditExit:feature.status,mainAuditExit:before.status,identicalReports:true},null,2));
            if(feature.status) console.log('KNOWN BASELINE FAILURE: the global CSS audit is not passing. Its complete reports and exit status are identical on main and this branch. No CSS rule or token budget was changed.');
            else console.log('PASS: global CSS audit on both main and feature.');
          } finally {rmSync(baseline,{recursive:true,force:true});}
          NODE
          check chromium npx playwright install --with-deps chromium
          check editor npm run test:placement-dignity-editor
          check reader-boundary npm run test:reader-copy-boundary
          exit "$failed"
      - name: Commit verified generated artifacts and remove transport
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const allowed = new Set(['apps/web/src/content/fallbackArchitectureV3/dist/tldr-content.js','api/_generated/studio-variable-names.json','apps/admin/public/generated/studio-variables-v1.json','apps/web/public/generated/studio-variables-v1.json']);
          const changed = execFileSync('git', ['diff', '--name-only'], {encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const generated = /^apps\/web\/src\/content\/fallbackArchitectureV3\/(?:bundled[^/]*\.json|approved-serving-(?:projection|lineage)-v1\.json)$/u;
          const unexpected = changed.filter(path => !allowed.has(path) && !generated.test(path));
          if (unexpected.length) throw new Error('Review unexpected build outputs before staging: ' + unexpected.join(', '));
          if (changed.length) execFileSync('git', ['add', '--', ...changed]);
          NODE
          git rm -r .dignity-transport
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Verify dignity selection and rebuild shipped reader and variable catalogs'
          git push origin HEAD:refs/heads/codex/planet-sign-dignity-20260916
      - name: Package verification diff
        if: always()
        run: |
          mkdir -p test-results/dignity-review
          git diff 33763e257d99ac8df6f9cdc9089cba9b08bbc515 --binary > test-results/dignity-review/changes.patch
          git rev-parse HEAD > test-results/dignity-review/head.txt
          git status --short > test-results/dignity-review/git-status.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dignity-integration-verification
          path: |
            test-results/dignity-review/
            test-results/placement-dignity-editor/
          retention-days: 3

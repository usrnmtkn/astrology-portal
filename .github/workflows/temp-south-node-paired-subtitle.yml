name: Temporary South Node paired subtitle repair

on:
  push:
    branches:
      - fix/south-node-paired-subtitle-20260907

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/south-node-paired-subtitle-20260907
      - name: Apply paired subtitle repair
        run: node scripts/temp-apply-south-node-paired-subtitle.mjs
      - name: Commit repair and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-south-node-paired-subtitle.yml scripts/temp-apply-south-node-paired-subtitle.mjs
          git add apps/web/src/features/sky/SkyDetailArticle.tsx scripts/test-calendar-south-node-serving.mjs
          git commit -m "Render South Node as paired aspect subtitle"
          git push origin HEAD:fix/south-node-paired-subtitle-20260907

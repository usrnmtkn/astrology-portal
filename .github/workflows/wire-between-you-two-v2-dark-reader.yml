name: Validate Between You Two V2 dark reader

on:
  push:
    branches:
      - "owner/between-you-two-v2-20260905"
    paths:
      - "scripts/test-between-you-two-v2-runtime.mts"
      - "scripts/test-between-you-two-v2-wiring.mjs"
      - "scripts/test-between-you-two-v2-full-review.mjs"
      - "scripts/apply-between-you-two-v2-owner-approvals.mjs"
      - "scripts/generate-between-you-two-v2-source-rows.mjs"
      - "apps/web/src/services/betweenYouTwoV2.ts"
      - "apps/web/src/features/friends/ManualChartsPanel.tsx"
      - "apps/web/src/features/friends/CompatibilityTab.tsx"
      - ".github/workflows/wire-between-you-two-v2-dark-reader.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize latest governed V2 review state
        run: |
          node scripts/apply-between-you-two-v2-owner-approvals.mjs
          node scripts/generate-between-you-two-v2-source-rows.mjs
          npm run build:fallback-manifest
      - name: Verify owner-approval boundary
        run: node scripts/test-between-you-two-v2-full-review.mjs
      - name: Verify V2 runtime fail-closed behavior
        run: node --import tsx scripts/test-between-you-two-v2-runtime.mts
      - name: Preserve V1 rollback renderer contract
        run: node --experimental-strip-types scripts/test-pair-daily.mjs
      - name: Verify V2 reader and UI wiring
        run: node scripts/test-between-you-two-v2-wiring.mjs
      - name: Build astro knowledge
        run: npm run build -w @tldr/astro-knowledge
      - name: Build web
        run: npm run build -w @tldr/web
      - name: Build admin
        run: npm run build -w @tldr/admin
      - name: Check whitespace
        run: git diff --check

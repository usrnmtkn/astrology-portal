name: Temporary Sky Placement residency aspect pilot patch

on:
  push:
    branches:
      - chatgpt/sky-placement-residency-aspects-20260906
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/sky-placement-residency-aspects-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply bounded patch
        run: node scripts/apply-sky-placement-residency-aspect-pilot-patch.mjs
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx apps/web/src/features/sky/SkyDetailArticle.tsx package.json
          git commit -m "Wire Sun residency aspect pilot into Sky Placement detail"
          git push origin HEAD:chatgpt/sky-placement-residency-aspects-20260906

name: Temporary Sky Placement residency aspect pilot patch

on:
  push:
    branches:
      - chatgpt/sky-placement-residency-aspects-20260906
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/sky-placement-residency-aspects-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply bounded patch
        run: |
          node scripts/patch-sky-placement-residency-aspect-tone-ui.mjs
          node scripts/patch-sun-residency-conjunction-scan.mjs
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/sky/SkyDetailArticle.tsx apps/web/src/services/ephemeris.ts
          git commit -m "Complete Sun residency aspect scan"
          git push origin HEAD:chatgpt/sky-placement-residency-aspects-20260906

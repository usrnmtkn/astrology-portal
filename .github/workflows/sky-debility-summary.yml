name: Sky effort summary
on:
  pull_request:
    paths:
      - 'apps/web/src/content/skyDebility*'
      - 'apps/web/src/services/planetSignDignity*'
      - 'apps/web/src/features/sky/SkyDebilityCard.tsx'
      - 'apps/admin/src/SkyDebility*'
      - 'apps/admin/src/skyDebility*'
      - 'scripts/test-sky-debility*'
      - 'tests/visual/sky-debility-*.spec.ts'
      - 'tests/fixtures/sky-effort-count-first.ts'
      - 'playwright.sky-debility*.config.ts'
      - '.github/workflows/sky-debility-summary.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/content/skyDebility*'
      - 'apps/web/src/services/planetSignDignity*'
      - 'apps/web/src/features/sky/SkyDebilityCard.tsx'
      - 'apps/admin/src/SkyDebility*'
      - 'apps/admin/src/skyDebility*'
      - 'scripts/test-sky-debility*'
      - 'tests/visual/sky-debility-*.spec.ts'
      - 'tests/fixtures/sky-effort-count-first.ts'
      - 'playwright.sky-debility*.config.ts'
      - '.github/workflows/sky-debility-summary.yml'
permissions:
  contents: read
concurrency:
  group: sky-effort-summary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  combinations-and-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @tldr/astro-knowledge
      - name: Rebuild and verify fallback integrity indexes
        run: npm run build:fallback-manifest && git diff --exit-code
      - name: All placement sets, counts, grammar and publication states
        run: node --import tsx scripts/test-sky-debility-copy.mts
      - name: Source-map parity and exact field routing across all combinations
        run: node --import tsx scripts/test-sky-debility-composition.mts
      - name: Inline links, count emphasis, motion changes and all presentation states
        run: node --import tsx scripts/test-sky-debility-presentation.mts
      - name: Reader-copy boundary
        run: npm run test:reader-copy-boundary
      - name: Build Content Studio
        run: npm run build:admin
      - name: Build the web reader
        run: npm run build -w @tldr/web
      - name: Audit shared CSS and tokens
        run: npm run qa:css-audit
      - name: Install browser for interaction checks
        run: npx playwright install --with-deps chromium
      - name: Exact reader paragraph, composition map, and save/reopen controls
        run: npx playwright test --config=playwright.sky-debility.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-debility-composition-browser
          path: test-results/
          retention-days: 7
  deployed-reader:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for this merge commit's Vercel deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/commits/${process.env.GITHUB_SHA}/status`;
          let ready = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            const response = await fetch(url, { headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json' } });
            if (!response.ok) throw new Error(`Deployment status request failed: ${response.status}`);
            const status = (await response.json()).statuses.find(item => item.context === 'Vercel');
            if (status?.state === 'success') { ready = true; console.log(`Deployment completed for ${process.env.GITHUB_SHA}`); break; }
            if (status && ['failure', 'error'].includes(status.state)) throw new Error('Vercel deployment failed.');
            await new Promise(resolve => setTimeout(resolve, 15_000));
          }
          if (!ready) throw new Error('Deployment did not complete within the verification window.');
          NODE
      - name: Verify public production card without writes or mocked responses
        run: npx playwright test --config=playwright.sky-debility-production.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-debility-production-browser
          path: test-results/
          retention-days: 7

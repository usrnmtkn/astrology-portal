name: Ephemeris release gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  nasa-jpl-freshness:
    name: nasa-jpl-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify South Node Calendar axis mirror contract
        run: node scripts/test-calendar-south-node-axis-mirror.mjs
      - name: Verify South Node Calendar editorial queue
        run: node scripts/test-calendar-south-node-editorial-queue.mjs
      - name: Verify ephemeris monitoring contract
        run: node scripts/test-ephemeris-monitoring-contract.mjs
      - name: Require a fresh passing NASA/JPL comparison
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EPHEMERIS_RELEASE_BRANCH: main
          EPHEMERIS_MAX_AGE_HOURS: 36
        run: node scripts/check-ephemeris-release-gate.mjs

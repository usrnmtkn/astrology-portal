name: Project privacy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-privacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  project-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check tracked files without logging personal values
        env:
          PROJECT_PRIVACY_POLICY: ${{ secrets.PROJECT_PRIVACY_POLICY }}
        run: node scripts/check-project-privacy.mjs
      - run: node scripts/test-project-privacy.mjs

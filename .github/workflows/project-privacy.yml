name: Project privacy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-privacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  project-privacy:
    # PR merge commits repeat the exact revision that already ran on the PR.
    # Keep direct pushes protected without paying twice for ordinary merges.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge PR #') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check tracked files without logging personal values
        env:
          PROJECT_PRIVACY_POLICY: ${{ secrets.PROJECT_PRIVACY_POLICY }}
        run: node scripts/check-project-privacy.mjs
      - run: node scripts/test-project-privacy.mjs

name: Content Studio API contract

on:
  pull_request:
    paths:
      - "api/**"
      - "apps/admin/**"
      - "apps/web/**"
      - "packages/astro-knowledge/**"
      - "scripts/test-content-*"
      - "scripts/test-admin-*"
      - "scripts/test-sky-*"
      - "scripts/ci-*"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/content-studio-api.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "apps/admin/**"
      - "apps/web/**"
      - "packages/astro-knowledge/**"
      - "scripts/test-content-*"
      - "scripts/test-admin-*"
      - "scripts/test-sky-*"
      - "scripts/ci-*"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/content-studio-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-studio-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content-studio-api:
    # Validate the actual main revision too. A merge message is not test evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify CRUD, publication, storage and actual reader contracts
        run: npm run test:content-studio-api

env:
  PRIVATE_REPORT_DOCUMENTS: ${{ secrets.PRIVATE_REPORT_DOCUMENTS }}

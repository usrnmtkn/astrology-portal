name: Content Studio API contract

# Run this contract when Content Studio, serving content, or shared dependencies
# change. Avoid spending Actions minutes on unrelated report or editorial PRs.
on:
  pull_request:
    paths:
      - "api/admin/**"
      - "api/_lib/**"
      - "apps/admin/**"
      - "apps/web/src/content/**"
      - "apps/web/src/main.tsx"
      - "apps/web/src/services/**"
      - "packages/astro-knowledge/**"
      - "scripts/test-content-studio-*.mjs"
      - "scripts/test-content-publications*.mjs"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/content-studio-api.yml"
  push:
    branches: [main]
    paths:
      - "api/admin/**"
      - "api/_lib/**"
      - "apps/admin/**"
      - "apps/web/src/content/**"
      - "apps/web/src/main.tsx"
      - "apps/web/src/services/**"
      - "packages/astro-knowledge/**"
      - "scripts/test-content-studio-*.mjs"
      - "scripts/test-content-publications*.mjs"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/content-studio-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-studio-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content-studio-api:
    # The same merge commit has already been validated on its PR. Preserve direct
    # pushes to main, but do not bill a second identical run for normal PR merges.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge PR #') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify CRUD, publication, storage and actual reader contracts
        run: npm run test:content-studio-api

env:
  PRIVATE_REPORT_DOCUMENTS: ${{ secrets.PRIVATE_REPORT_DOCUMENTS }}

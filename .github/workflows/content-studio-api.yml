name: Content Studio API contract

# Deliberately no path filter: a reader, package, or dependency change can break
# the editor/API contract without touching api/admin itself.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-studio-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content-studio-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify CRUD, publication, storage and actual reader contracts
        run: npm run test:content-studio-api

name: Temporary Step 5 Sky comparison refresh

on:
  push:
    branches:
      - chatgpt/content-studio-step5-api-contract

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Regenerate governed production Sky comparison
        run: node scripts/build-production-sky-kernel-comparison.mjs --write
      - name: Verify comparison and final corpus boundary
        run: |
          git diff --check
          node scripts/build-production-sky-kernel-comparison.mjs
          node scripts/test-sky-aspect-owner-gate-source.mjs
          node scripts/build-knowledge-index.mjs --check
          node scripts/build-phrase-index.mjs --check
      - name: Commit refreshed comparison and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temporary-step5-sky-comparison-refresh.yml
          git add packages/astro-knowledge/review/production-sky-kernel-comparison-v1/comparison.json \
                  .github/workflows/temporary-step5-sky-comparison-refresh.yml
          git commit -m "chore(knowledge): refresh production Sky comparison"
          git push

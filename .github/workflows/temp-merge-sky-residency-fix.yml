name: Temporary merge Sky residency fix

on:
  push:
    branches:
      - fix/south-node-paired-subtitle-20260907

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/south-node-paired-subtitle-20260907
      - name: Preserve existing Sky aspects during residency enrichment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          detail_path = Path('apps/web/src/features/sky/SkyDetailArticle.tsx')
          detail = detail_path.read_text()
          old = '''  const detailSections = residencyContext
            ? [
                ...(detail.sections ?? []).filter((section) => section.role !== "aspect"),
                ...(residencyAspectSections ?? [])
              ]
            : (detail.sections ?? []);
          '''
          new = '''  const detailSections = residencyAspectSections
            ? [
                ...residencyAspectSections,
                ...(detail.sections ?? []).filter((section) => (
                  section.role !== "aspect"
                  || !residencyAspectSections.some((candidate) => candidate.heading === section.heading)
                ))
              ]
            : (detail.sections ?? []);
          '''
          if old not in detail:
              raise SystemExit('SkyDetailArticle residency merge target not found')
          detail_path.write_text(detail.replace(old, new, 1))

          test_path = Path('scripts/test-sky-placement-residency-aspects.mts')
          test = test_path.read_text()
          anchor = '  assert.match(detailSource, /skyPlacementResidencyAspectSections/u);\n'
          assertion = '''  assert.match(detailSource, /skyPlacementResidencyAspectSections/u);
          assert.match(
            detailSource,
            /residencyAspectSections[\\s\\S]*?residencyAspectSections\\.some/u,
            "Residency enrichment must keep existing exact aspect content visible while loading and preserve unmatched approved aspects afterward."
          );
          '''
          if 'Residency enrichment must keep existing exact aspect content visible while loading' not in test:
              if anchor not in test:
                  raise SystemExit('Residency test anchor not found')
              test = test.replace(anchor, assertion, 1)
              test_path.write_text(test)
          PY

          git diff --check
          npm ci
          npm run build
          node --import tsx scripts/test-sky-placement-residency-aspects.mts
          node scripts/test-calendar-south-node-serving.mjs
          npm run qa:bundle
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-merge-sky-residency-fix.yml
          git add apps/web/src/features/sky/SkyDetailArticle.tsx scripts/test-sky-placement-residency-aspects.mts
          git commit -m "Preserve approved Sky aspects during residency enrichment"
          git push origin HEAD:fix/south-node-paired-subtitle-20260907

name: Build complete Friends transit corpus v2

on:
  push:
    branches:
      - chatgpt/friends-transits-complete-v1

permissions:
  contents: write

jobs:
  build-corpus-v2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/friends-transits-complete-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply authoring corrections from governed build workflow
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/build-friends-transit-completion-v1.yml').read_text()
          marker = '      - name: Apply pre-build authoring corrections\n        shell: python\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n      - name: Build 351-row Friends packet', start)
          block = workflow[start:end]
          lines = block.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          replacements = {
            '"As this contact with their %TARGET% continues through {{untilDate}}, {{Name}} %ACTION%.",': '"As %PLANET% {{aspectWord}} their %TARGET% continues through {{untilDate}}, {{Name}} %ACTION%.",',
            '"%PLANET% stays in contact with their %TARGET% through {{untilDate}}. {{Name}} %ACTION%."': '"%PLANET% {{aspectWord}} their %TARGET% stays active through {{untilDate}}. {{Name}} %ACTION%."',
            '"Until {{untilDate}}, the contact between %PLANET% and their %TARGET% is easiest to use when {{Name}} %ACTION%.",': '"Until {{untilDate}}, %PLANET% {{aspectWord}} their %TARGET% is easiest to use when {{Name}} %ACTION%.",'
          }
          for old, new in replacements.items():
            if old not in script:
              raise SystemExit(f'missing generic bridge variant: {old}')
            script = script.replace(old, new)
          exec(compile(script, '<friends-authoring-corrections>', 'exec'), {})
      - name: Build 351-row Friends packet
        run: node scripts/build-friends-transit-completion-v1.mjs
      - name: Validate 378-row Friends corpus
        run: node scripts/test-friends-transit-completion-v1.mjs
      - name: Print representative family samples
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packet = JSON.parse(fs.readFileSync('packages/astro-knowledge/review/transit-aspect-friends-completion-v1.json', 'utf8'));
          const seen = new Set();
          for (const row of packet.records) {
            const family = row.contentKey.split('/')[2];
            if (seen.has(family)) continue;
            seen.add(family);
            console.log(`\n### ${family}: ${row.contentKey}\n${row.body_they}\n`);
          }
          NODE
      - name: Verify diff
        run: git diff --check
      - name: Commit validated generator and corpus
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-friends-transit-completion-v1.mjs packages/astro-knowledge/review/transit-aspect-friends-completion-v1.json
          git commit -m "content(friends): stage complete independent transit corpus"
          git push origin HEAD:chatgpt/friends-transits-complete-v1

name: Sky Calendar South Node serving 60

on:
  pull_request:
    paths:
      - "packages/astro-knowledge/review/sky-calendar-south-node-60-v1/**"
      - "packages/astro-knowledge/data/transits/*-south-node.json"
      - "scripts/release-calendar-south-node-60.mjs"
      - "scripts/test-calendar-south-node-serving.mjs"
      - "scripts/test-calendar-south-node-axis-mirror.mjs"
      - "scripts/test-calendar-exact-sky-aspect-routing.mjs"
      - "scripts/test-calendar-major-exact-routing-complete.mjs"
      - "scripts/seed-published-calendar-aspect-content-studio.mjs"
      - "apps/web/src/services/skyAspectRouting.ts"
      - "apps/web/src/services/skyAspectContent.ts"
      - ".github/workflows/sky-calendar-south-node-serving-60.yml"

# These batches have shipped and were superseded by the collective release.
# PR verification must not reapply historical prose or push it onto new branches.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @tldr/astro-knowledge
      - name: Verify current hash-bound collective release and all Studio identities
        run: node scripts/test-sky-calendar-collective-release-20260907.mjs
      - name: Verify exact Calendar routing and both editable node poles
        run: node scripts/test-calendar-exact-sky-aspect-routing.mjs
      - name: Verify South Node approval, serving, and one-event axis geometry
        run: |
          node scripts/test-calendar-south-node-editorial-queue.mjs
          node scripts/test-calendar-south-node-serving.mjs
          node scripts/test-calendar-south-node-axis-mirror.mjs
      - run: git diff --check

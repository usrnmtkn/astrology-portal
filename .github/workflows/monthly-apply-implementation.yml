name: Apply monthly implementation handoff
on:
  push:
    branches: [chatgpt/monthly-template-ai-writer-v1]
    paths:
      - '.github/monthly-authoring-implementation.patch.gz.b64.part20'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply reviewed local implementation commit
        run: |
          cat .github/monthly-authoring-implementation.patch.gz.b64.part?? | base64 -d | gzip -d > /tmp/monthly.patch
          echo '2505f7b27d3507e34e42401d52c8e90db3f3d3bf6650ce2152b6defc109b8237  /tmp/monthly.patch' | sha256sum -c -
          git config user.name 'usrnmtkn'
          git config user.email 'usrnmtkn@proton.me'
          git am /tmp/monthly.patch
          git rm .github/monthly-authoring-implementation.patch.gz.b64.part?? .github/workflows/monthly-apply-implementation.yml
          git commit -m 'chore: remove monthly implementation handoff'
          git push origin HEAD:chatgpt/monthly-template-ai-writer-v1

name: Patch Calendar Week source-gap regression

on:
  push:
    branches:
      - fix/calendar-content-studio-sync-followup-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/calendar-content-studio-sync-followup-20260906
      - name: Update completed-corpus Week contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/visual/client-facing-user-flows.spec.ts")
          text = path.read_text()
          old = '''    const weeklyAspectSourceGaps = weeklyView.locator('.lunar-weekly-event.event-aspect[data-content-key^="source-gap/"]');
              await expect(weeklyAspectSourceGaps).toHaveCount(1);
              await expect(weeklyAspectSourceGaps.locator(".lunar-weekly-event__heading")).toBeVisible();
              await expect(weeklyAspectSourceGaps.locator(".lunar-weekly-event__body")).toHaveCount(0);
              await expect(weeklyAspectEvents.locator(".lunar-weekly-event__body")).toHaveCount(weeklyAspectEventCount - 1);'''
          old = old.replace("              ", "    ")
          new = '''    const weeklyAspectSourceGaps = weeklyView.locator('.lunar-weekly-event.event-aspect[data-content-key^="source-gap/"]');
              await expect(weeklyAspectSourceGaps).toHaveCount(0);
              await expect(weeklyAspectEvents.locator(".lunar-weekly-event__body")).toHaveCount(weeklyAspectEventCount);'''
          new = new.replace("              ", "    ")
          if old not in text:
              raise SystemExit("Expected stale Week source-gap assertion was not found.")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/patch-calendar-week-source-gap.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Calendar Week completed-corpus regression"
          git push origin HEAD:fix/calendar-content-studio-sync-followup-20260906

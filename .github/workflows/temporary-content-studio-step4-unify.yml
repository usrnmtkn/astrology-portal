name: Temporary Content Studio Step 4 unify

on:
  push:
    branches:
      - chatgpt/content-studio-step4-unified

permissions:
  contents: write

concurrency:
  group: temporary-content-studio-step4-unify
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build test dependencies
        run: npm run build -w @tldr/astro-knowledge
      - name: Reconcile atomic concurrency guards
        run: |
          git show 9f0517f6a9081c7ef3f45004bf5a0df09bba1e5a -- \
            api/admin/generated-content.ts \
            api/admin/prepopulate-content.ts \
            scripts/test-content-studio-hydration-reliability.mjs \
            scripts/test-content-studio-special-mutation-concurrency.mjs \
            | git apply --3way
          git checkout 9f0517f6a9081c7ef3f45004bf5a0df09bba1e5a -- \
            scripts/test-content-studio-atomic-concurrency.mjs \
            scripts/test-content-studio-prepopulate-live-race.mjs
      - name: Repair open-reader cache rehydration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/App.tsx')
          text = path.read_text()
          for loader, label in [
              ('loadPlanetTopicVocabulary()', 'planet topic vocabulary'),
              ('loadNatalCardTaglines()', 'natal card taglines'),
          ]:
              loader_index = text.find(loader)
              if loader_index < 0:
                  raise SystemExit(f'{label}: loader not found')
              effect_start = text.rfind('useEffect(() => {', 0, loader_index)
              effect_end = text.find('}, []);', loader_index)
              if effect_start < 0 or effect_end < 0 or effect_end - loader_index > 1800:
                  raise SystemExit(f'{label}: mount-only effect not found')
              text = text[:effect_end] + '}, [contentRefreshVersion]);' + text[effect_end + len('}, []);'):]
          path.write_text(text)

          Path('scripts/test-content-studio-reader-cache-rehydrate.mjs').write_text(r'''#!/usr/bin/env node
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const app = fs.readFileSync("apps/web/src/App.tsx", "utf8");
          const signal = fs.readFileSync("apps/web/src/services/contentUpdateSignal.ts", "utf8");

          assert.match(app, /subscribeToContentUpdates\(\(\) => \{[\s\S]{0,500}setContentRefreshVersion\(\(version\) => version \+ 1\)/u,
            "Open reader tabs must react to Content Studio update broadcasts.");

          for (const [label, loader] of [
            ["planet/sign vocabulary", "loadPlanetTopicVocabulary"],
            ["natal card taglines", "loadNatalCardTaglines"]
          ]) {
            const pattern = new RegExp(`useEffect\\(\\(\\) => \\{[\\s\\S]{0,900}${loader}\\(\\)[\\s\\S]{0,900}\\}, \\[contentRefreshVersion\\]\\);`, "u");
            assert.match(app, pattern, `${label} must rehydrate after Content Studio content updates.`);
          }

          assert.match(signal, /clearPlanetTopicVocabularyCache\(\)/u);
          assert.match(signal, /clearNatalCardTaglineCache\(\)/u);
          console.log("Content Studio reader cache rehydrate contract passed.");
          ''')
          PY
      - name: Combined Step 4 QA
        run: |
          git diff --check
          node scripts/test-content-studio-reader-cache-rehydrate.mjs
          node scripts/test-content-studio-runtime-cache-invalidation.mjs
          node scripts/test-content-studio-cms-performance.mjs
          node --import tsx scripts/test-content-studio-crud-hydration-guards.mjs
          node --import tsx scripts/test-content-studio-atomic-concurrency.mjs
          node --import tsx scripts/test-content-studio-prepopulate-live-race.mjs
          node scripts/test-content-studio-hydration-reliability.mjs
          node scripts/test-content-studio-special-mutation-concurrency.mjs
          node --import tsx scripts/test-content-studio-api-roundtrip.mjs
          node --import tsx scripts/test-fallback-dashboard-live-overlay.mjs
          node --import tsx scripts/test-fallback-dashboard-dynamic-natal-exact.mjs
          node --import tsx scripts/test-admin-natal-placement-preview-api.mjs
          node scripts/test-admin-natal-placement-preview-dependencies.mjs
      - name: Typecheck and builds
        run: |
          npm run typecheck
          npm run build:web
          npm run build:admin
      - name: Commit clean unified Step 4 checkpoint
        run: |
          rm .github/workflows/temporary-content-studio-step4-unify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(content): unify atomic guards and reader rehydration"
          git push

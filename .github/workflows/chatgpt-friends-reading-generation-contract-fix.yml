name: ChatGPT Friends Reading Generation Contract Fix

on:
  push:
    branches:
      - chatgpt/friends-reading-generation-contract-fix-20260906

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Patch Friends generation contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("api/_lib/content-generation.ts")
          source = path.read_text()

          schema_marker = "const bannedUserFacingPhrases = ["
          if schema_marker not in source:
              raise RuntimeError("schema insertion marker missing")
          if "const friendTransitReadingGeneratedContentSchema = {" not in source:
              friend_schema = '''const friendTransitReadingGeneratedContentSchema = {
            type: "object",
            additionalProperties: false,
            required: ["headline", "tldr", "summary", "body", "action", "timing", "sections", "sceneLock", "astrologyDrilldown"],
            properties: {
              headline: { type: "string" },
              tldr: { type: "string" },
              summary: { type: "string" },
              body: { type: "string" },
              action: { type: "string" },
              timing: { type: "string" },
              sections: {
                type: "array",
                maxItems: 0,
                items: {
                  type: "object",
                  additionalProperties: false,
                  required: ["heading", "body"],
                  properties: {
                    heading: { type: "string" },
                    body: { type: "string" }
                  }
                }
              },
              sceneLock: { type: "null" },
              astrologyDrilldown: { type: "null" }
            }
          } as const;

          function generatedContentSchemaForInput(input: GenerateContentInput) {
            return isFriendTransitReadingInput(input)
              ? friendTransitReadingGeneratedContentSchema
              : generatedContentSchema;
          }

          '''
              source = source.replace(schema_marker, friend_schema + schema_marker, 1)

          if "schema: generatedContentSchemaForInput(input)" not in source:
              needle = "schema: generatedContentSchema"
              if needle not in source:
                  raise RuntimeError("OpenAI writer schema marker missing")
              source = source.replace(needle, "schema: generatedContentSchemaForInput(input)", 1)

          if "input_schema: generatedContentSchemaForInput(input)" not in source:
              needle = "input_schema: generatedContentSchema"
              if needle not in source:
                  raise RuntimeError("Claude writer schema marker missing")
              source = source.replace(needle, "input_schema: generatedContentSchemaForInput(input)", 1)

          quality_start = source.index("function validateGeneratedContentQuality")
          quality_end = source.index("function validateAstrologyDrilldownQuality", quality_start)
          quality = source[quality_start:quality_end]
          if "if (isFriendTransitReadingInput(input)) {\n    return;\n  }" not in quality:
              body_gate = '''  if (content.body.trim().length < 180) {
            throw new Error("Generated body is too thin for editorial review.");
          }
          '''
              if body_gate not in quality:
                  body_gate = '''  if (content.body.trim().length < 180) {
    throw new Error("Generated body is too thin for editorial review.");
  }
'''
              if body_gate not in quality:
                  raise RuntimeError("Friends quality-return insertion marker missing")
              quality = quality.replace(
                  body_gate,
                  body_gate + '''
  if (isFriendTransitReadingInput(input)) {
    return;
  }
''',
                  1
              )
              source = source[:quality_start] + quality + source[quality_end:]

          validation_start = source.index("function validateGeneratedContentForInput")
          validation_end = source.index("function parseResponseJson", validation_start)
          validation = source[validation_start:validation_end]
          validation = validation.replace("  validateAstrologyDrilldownQuality(content);\n\n", "", 1)
          if "validateAstrologyDrilldownQuality(content);" not in validation:
              natal_marker = "  if (isNatalAspectGenerationContext(input)) {"
              if natal_marker not in validation:
                  raise RuntimeError("drilldown reinsertion marker missing")
              validation = validation.replace(
                  natal_marker,
                  "  validateAstrologyDrilldownQuality(content);\n\n" + natal_marker,
                  1
              )
          source = source[:validation_start] + validation + source[validation_end:]
          path.write_text(source)

          test_path = Path("scripts/test-friend-transit-reading-request-render.mjs")
          test_source = test_path.read_text()
          generation_decl = 'const generationSource = fs.readFileSync("api/_lib/content-generation.ts", "utf8");\n'
          if generation_decl not in test_source:
              api_decl = 'const apiSource = fs.readFileSync("api/generate-user-content.ts", "utf8");\n'
              if api_decl not in test_source:
                  raise RuntimeError("test api source marker missing")
              test_source = test_source.replace(api_decl, api_decl + generation_decl, 1)

          if "friendTransitReadingGeneratedContentSchema" not in test_source:
              marker = 'assert.match(apiSource, /requestSubjectType === "friend_transit_reading"[\\s\\S]{0,220}This paid reading is currently unavailable/u);\n'
              if marker not in test_source:
                  raise RuntimeError("test assertion insertion marker missing")
              additions = r'''
          assert.match(generationSource, /const friendTransitReadingGeneratedContentSchema = \{[\s\S]*sceneLock: \{ type: "null" \}[\s\S]*astrologyDrilldown: \{ type: "null" \}/u);
          assert.match(generationSource, /schema: generatedContentSchemaForInput\(input\)/u);
          assert.match(generationSource, /input_schema: generatedContentSchemaForInput\(input\)/u);
          const qualityStart = generationSource.indexOf("function validateGeneratedContentQuality");
          const qualityEnd = generationSource.indexOf("function validateAstrologyDrilldownQuality", qualityStart);
          const qualitySource = generationSource.slice(qualityStart, qualityEnd);
          assert.ok(qualitySource.indexOf("content.body.trim().length < 180") >= 0);
          assert.ok(qualitySource.indexOf("if (isFriendTransitReadingInput(input))") > qualitySource.indexOf("content.body.trim().length < 180"));
          assert.ok(qualitySource.indexOf("if (isPrimaryNatalPlacementGeneration(input))") > qualitySource.indexOf("if (isFriendTransitReadingInput(input))"));
          const validationStart = generationSource.indexOf("function validateGeneratedContentForInput");
          const validationEnd = generationSource.indexOf("function parseResponseJson", validationStart);
          const validationSource = generationSource.slice(validationStart, validationEnd);
          assert.ok(validationSource.indexOf("validateGeneratedContentQuality(content, input)") >= 0);
          assert.ok(validationSource.indexOf("if (isFriendTransitReadingInput(input))") > validationSource.indexOf("validateGeneratedContentQuality(content, input)"));
          assert.ok(validationSource.indexOf("validateAstrologyDrilldownQuality(content)") > validationSource.indexOf("if (isFriendTransitReadingInput(input))"));
          '''
              test_source = test_source.replace(marker, marker + additions, 1)
          test_path.write_text(test_source)
          PY
      - run: npm ci
      - run: node scripts/test-friend-transit-reading-request-render.mjs
      - run: node --experimental-strip-types scripts/test-friend-transit-reading-contract.mts
      - run: node --import tsx scripts/test-birth-time-angle-reliability.mts
      - run: npm run typecheck
      - run: npm run build:knowledge
      - run: npm run build:web
      - run: git diff --check
      - name: Commit validated fix
        run: |
          git config user.name usrnmtkn
          git config user.email usrnmtkn@proton.me
          git add api/_lib/content-generation.ts scripts/test-friend-transit-reading-request-render.mjs
          git commit -m "Fix Friends reading generation validation contract"
          git push origin HEAD:chatgpt/friends-reading-generation-contract-fix-20260906

name: Sky Placement residency validation temp

on:
  push:
    branches:
      - chatgpt/sky-placement-residency-aspects-clean-20260906

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build app test dependencies
        run: npm run prepare:app-test-dependencies
      - name: Run Sky Placement residency regression
        run: node --import tsx scripts/test-sky-placement-residency-aspects.mts
      - name: TypeScript
        run: npm run typecheck
      - name: Diff whitespace check
        run: git diff --check

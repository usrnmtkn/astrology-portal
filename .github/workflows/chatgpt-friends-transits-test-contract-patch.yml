name: ChatGPT Friends Transits Contract Patch

on:
  push:
    branches:
      - chatgpt/friends-transits-brief-20260905

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing Friends render contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('scripts/test-friend-placement-tables-render.mjs')
          s = p.read_text()
          old = '''  assert.match(populatedTransitsHtml, /friend-profile-copy-column\"><section class=\"daily-horoscope-summary friend-daily-forecast\"/);'''
          new = '''  assert.match(populatedTransitsHtml, /friend-profile-copy-column\"><section class=\"friend-transit-group\" aria-label=\"Short-term themes\"/);'''
          if old not in s:
            raise SystemExit('daily-first render assertion not found')
          s = s.replace(old, new, 1)
          old_order = '''  assert.ok(\n    populatedTransitsHtml.indexOf(\"Between you two\") < populatedTransitsHtml.indexOf(\"Mars trine Moon\"),\n    \"Relationship context should lead the ranked short-term transit list.\"\n  );'''
          new_order = '''  assert.ok(\n    populatedTransitsHtml.indexOf(\"Mars trine Moon\") < populatedTransitsHtml.indexOf(\"Between you two\"),\n    \"The friend's ranked short-term transit list should lead relationship context.\"\n  );'''
          if old_order not in s:
            raise SystemExit('relationship-first order assertion not found')
          s = s.replace(old_order, new_order, 1)
          p.write_text(s)
          PY
          node scripts/test-friends-transits-prioritization.mjs
      - name: Commit contract update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-friend-placement-tables-render.mjs
          git commit -m "Align Friends transit render contract"
          git push origin HEAD:chatgpt/friends-transits-brief-20260905

name: Sync effective rules runtime with final main

on:
  push:
    branches:
      - chatgpt/effective-writing-rules-runtime-current-main-v2
    paths:
      - .github/workflows/chatgpt-sync-effective-rules-final-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out runtime branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/effective-writing-rules-runtime-current-main-v2
          fetch-depth: 0
      - name: Merge final main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Remove temporary workflow and push
        run: |
          rm .github/workflows/chatgpt-sync-effective-rules-final-main.yml
          git add .github/workflows/chatgpt-sync-effective-rules-final-main.yml
          git commit -m "Remove temporary final-main sync workflow"
          git push origin HEAD:chatgpt/effective-writing-rules-runtime-current-main-v2

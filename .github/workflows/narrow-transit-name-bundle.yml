name: Narrow transit name bundle

on:
  push:
    branches:
      - fix/personal-transit-source-label

permissions:
  contents: write

jobs:
  narrow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/personal-transit-source-label
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore base bundle and apply only Friends-name resolver hunks
        run: |
          git checkout 36d8576155ec707ad2a6fa63e5ed7d4b25af366d -- apps/web/src/content/fallbackArchitectureV3/dist/tldr-content.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/web/src/content/fallbackArchitectureV3/dist/tldr-content.js")
          text = p.read_text()
          old_effect = 'const transitEffect = effectRaw && transitEffectArea ? fill(effectRaw, { natalArea: transitEffectArea }) : null;'
          new_effect = 'const transitEffect = effectRaw && transitEffectArea ? fill(effectRaw, { natalArea: transitEffectArea, Name: v === "they" ? voice : "" }) : null;'
          old_scenes = 'const cScenesFinal = cScenes ?? ctx.transitTypeLine ?? null;'
          new_scenes = 'const cScenesFinal = cScenes ? fillKeep(cScenes, { natalArea: transitEffectArea, Name: v === "they" ? voice : "" }) : ctx.transitTypeLine ?? null;'
          if text.count(old_effect) != 1:
              raise SystemExit(f"Expected one transitEffect bundle target, found {text.count(old_effect)}")
          if text.count(old_scenes) != 1:
              raise SystemExit(f"Expected one cScenesFinal bundle target, found {text.count(old_scenes)}")
          p.write_text(text.replace(old_effect, new_effect).replace(old_scenes, new_scenes))
          PY
      - name: Verify narrow bundle diff and governance
        run: |
          test "$(git diff --numstat 36d8576155ec707ad2a6fa63e5ed7d4b25af366d -- apps/web/src/content/fallbackArchitectureV3/dist/tldr-content.js | awk '{print $1":"$2}')" = "2:2"
          node scripts/test-content-approval-governance.mjs
          npm run typecheck --if-present
      - name: Commit narrow bundle and remove one-off workflow
        run: |
          rm .github/workflows/narrow-transit-name-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/web/src/content/fallbackArchitectureV3/dist/tldr-content.js
          git add -u .github/workflows/narrow-transit-name-bundle.yml
          git commit -m "Keep transit Friends name bundle diff narrow"
          git push origin HEAD:fix/personal-transit-source-label
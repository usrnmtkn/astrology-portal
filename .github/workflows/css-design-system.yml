name: CSS design system

on:
  pull_request:
    paths:
      - "apps/web/src/styles/**"
      - "apps/web/src/styles.css"
      - "apps/admin/src/**/*.css"
      - ".github/workflows/css-design-system.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/src/styles/**"
      - "apps/web/src/styles.css"
      - "apps/admin/src/**/*.css"
      - ".github/workflows/css-design-system.yml"

concurrency:
  group: css-design-system-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  css-design-system:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run shared CSS audits
        run: npm run qa:css-audit
      - name: Verify approved Studio layer tokens
        run: node scripts/test-studio-layer-tokens.mjs
      - name: Typecheck Content Studio
        run: npm run typecheck -w @tldr/admin
      - name: Build Content Studio
        run: npm run build:admin
      - name: Verify admin bundle budgets
        run: node scripts/check-admin-bundle-budgets.mjs

name: CSS design system

on:
  pull_request:
    paths:
      - "apps/web/src/styles/**"
      - "apps/web/src/styles.css"
      - "apps/admin/src/**/*.css"
      - "apps/admin/src/studio-ds/**"
      - "apps/web/src/ds/**"
      - "apps/web/DESIGN.md"
      - "scripts/test-live-ds-layers.mjs"
      - "scripts/generate-live-ds-design-md.mjs"
      - "scripts/test-studio-ds-layers.mjs"
      - "scripts/test-studio-theme.mjs"
      - "apps/admin/src/studioTheme.ts"
      - ".github/workflows/css-design-system.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/src/styles/**"
      - "apps/web/src/styles.css"
      - "apps/admin/src/**/*.css"
      - "apps/admin/src/studio-ds/**"
      - "apps/web/src/ds/**"
      - "apps/web/DESIGN.md"
      - "scripts/test-live-ds-layers.mjs"
      - "scripts/generate-live-ds-design-md.mjs"
      - "scripts/test-studio-ds-layers.mjs"
      - "scripts/test-studio-theme.mjs"
      - "apps/admin/src/studioTheme.ts"
      - ".github/workflows/css-design-system.yml"

concurrency:
  group: css-design-system-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  css-design-system:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run shared CSS audits
        run: |
          if ! npm run qa:css-audit; then
            echo "--- CSS token integrity report ---"
            sed -n '1,180p' test-results/css-audit/token-integrity.md || true
            exit 1
          fi
      - name: Verify approved Studio layer tokens
        run: node scripts/test-studio-layer-tokens.mjs
      - name: Verify Studio Shade-shaped layers
        run: node scripts/test-studio-ds-layers.mjs
      - name: Verify live reader design-system layers
        run: node scripts/test-live-ds-layers.mjs && node scripts/generate-live-ds-design-md.mjs --check

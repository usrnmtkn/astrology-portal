name: Calendar aspect Content Studio batch 2A

on:
  pull_request:
    paths:
      - "apps/web/src/content/fallbackArchitectureV3/authored-inputs/calendar-aspect-content-studio-batch-2a-v1.json"
      - "scripts/seed-calendar-aspect-content-studio-drafts.mjs"
      - "apps/admin/src/GeneratedContentAdminDashboard.tsx"
      - "scripts/test-calendar-aspect-content-studio-batch-2a.mjs"
      - "tests/visual/content-dashboard-admin-user-flows.spec.ts"
      - "packages/astro-knowledge/review/sky-calendar-composed-first-glance-2026-08-31/batch-2a-venus-saturn-squares-owner-approval.json"
      - ".github/workflows/calendar-aspect-content-studio-batch-2a.yml"
  workflow_dispatch:
    inputs:
      seed_content_studio:
        description: "Seed the 24 exact owner-approved rows as non-serving Content Studio drafts"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify owner-approved non-serving Content Studio batch
        run: node scripts/test-calendar-aspect-content-studio-batch-2a.mjs

  seed-content-studio:
    if: github.event_name == 'workflow_dispatch' && inputs.seed_content_studio
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seed exact owner-approved drafts into Content Studio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not configured for this repository."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] && [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Neither SUPABASE_URL nor VITE_SUPABASE_URL is configured for this repository."
            exit 1
          fi
          node scripts/seed-calendar-aspect-content-studio-drafts.mjs --apply

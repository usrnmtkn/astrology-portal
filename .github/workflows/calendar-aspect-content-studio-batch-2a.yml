name: Calendar aspect Content Studio batch 2A

on:
  pull_request:
    paths:
      - "apps/web/src/content/fallbackArchitectureV3/authored-inputs/calendar-aspect-content-studio-batch-2a-v1.json"
      - "scripts/seed-calendar-aspect-content-studio-drafts.mjs"
      - "scripts/test-calendar-aspect-content-studio-batch-2a.mjs"
      - "packages/astro-knowledge/review/sky-calendar-composed-first-glance-2026-08-31/batch-2a-venus-saturn-squares-owner-approval.json"
      - ".github/workflows/calendar-aspect-content-studio-batch-2a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify owner-approved non-serving Content Studio batch
        run: node scripts/test-calendar-aspect-content-studio-batch-2a.mjs

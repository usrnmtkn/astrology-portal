name: Sky summary candidate verification

on:
  pull_request:
    paths:
      - 'apps/web/src/features/sky/PublishedSkySummary.tsx'
      - 'apps/web/src/services/contentPublications.ts'
      - 'scripts/prepare-sky-summary-integration.mjs'
      - 'tests/visual/sky-summary-cold-hydration.spec.ts'
      - '.github/workflows/sky-summary-candidate.yml'

permissions:
  contents: read

concurrency:
  group: sky-summary-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integration:
    # Temporary, exact-branch review helper. It creates a Git blob only, never
    # updates a branch or publishes content. Remove before this PR is merged.
    if: github.repository == 'usrnmtkn/astrology-portal' && github.head_ref == 'chatgpt/ci-and-sky-verification-20260914' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare the reviewed, hash-guarded App integration in this checkout
        run: node scripts/prepare-sky-summary-integration.mjs
      - run: npm run build:knowledge
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Verify cold load, warm refresh, replacement, retirement and retry
        run: npx playwright test -c playwright.config.ts tests/visual/sky-summary-cold-hydration.spec.ts --workers=1
      - name: Record reviewed source diff and unreferenced blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff -- apps/web/src/App.tsx
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const response = await fetch('https://api.github.com/repos/usrnmtkn/astrology-portal/git/blobs', {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: readFileSync('apps/web/src/App.tsx', 'utf8'), encoding: 'utf-8' })
          });
          if (!response.ok) throw new Error(`Blob creation failed: ${response.status}`);
          const result = await response.json();
          console.log(JSON.stringify({ reviewedPath: 'apps/web/src/App.tsx', blobSha: result.sha }));
          NODE
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sky-summary-candidate-results
          path: test-results/
          retention-days: 7

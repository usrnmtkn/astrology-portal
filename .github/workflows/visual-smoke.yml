name: Visual smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    # Always evaluate the actual revision, including merge commits on main.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reader: ${{ steps.scope.outputs.reader }}
      studio: ${{ steps.scope.outputs.studio }}
      friends: ${{ steps.scope.outputs.friends }}
      sky: ${{ steps.scope.outputs.sky }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate workflow YAML and conditions
        run: ruby scripts/test-ci-workflow-syntax.rb
      - name: Verify shared-dependency scope regressions
        run: node scripts/test-ci-visual-scope.mjs
      - id: scope
        name: Determine affected browser surfaces
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-visual-scope.mjs

  friends-loading-performance:
    needs: scope
    if: needs.scope.outputs.friends == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://visual-smoke.supabase.test
      VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:knowledge
      - run: npx playwright install --with-deps chromium
      - name: Run Friends loading performance matrix on a fresh runner
        run: npm run qa:friends-loading-matrix
      - name: Upload Friends performance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: friends-loading-performance-results
          path: test-results/
          if-no-files-found: ignore

  visual-smoke:
    needs: scope
    if: needs.scope.outputs.reader == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: https://visual-smoke.supabase.test
      VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Verify fallback package manifest freshness
        run: node scripts/generate-fallback-package-manifest.mjs --check
      - name: Install dependencies
        run: npm ci
      - name: Audit form typography
        run: npm run qa:form-typography
      - name: Verify Content Studio link routing
        run: node --experimental-strip-types scripts/test-content-studio-link-routing.mjs
      - name: Verify Content Studio editor UX
        run: node scripts/test-admin-content-studio-usability.mjs
      - name: Verify Content Studio server module startup
        run: npm run build:knowledge && node scripts/test-content-live-status-node-runtime.mjs
      - name: Verify publication lifecycle and offline retirement
        run: npm run test:content-publications
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Enforce fresh browser release path
        run: npm run test:playwright-release-path
      - name: Build app
        run: npm run build
      - name: Check public downloads for personal identifiers
        env:
          PROJECT_PRIVACY_POLICY: ${{ secrets.PROJECT_PRIVACY_POLICY }}
        run: node scripts/check-project-privacy.mjs --directory apps/web/dist
      - name: Verify production health endpoint imports
        run: npm run test:production-health
      - name: Verify production report smoke contract
        run: node scripts/test-production-report-smoke.mjs
      - name: Enforce browser knowledge boundary
        run: npm run test:browser-knowledge-boundary
      - name: Verify reader copy eligibility and content boundary
        run: npm run test:reader-copy-repair
      - name: Enforce web bundle budgets
        run: npm run qa:bundle
      - name: Verify startup performance contracts
        run: npm run test:performance-contracts
      - name: Verify visible loading and recovery on slow or failed downloads
        run: npx playwright test -c playwright.config.ts --workers=1 tests/visual/app-loading-feedback.spec.ts
      - name: Run visual regression and smoke screens
        run: npx playwright test -c playwright.config.ts tests/visual/visual-regression-baseline.spec.ts tests/visual/visual-smoke.spec.ts
      - name: Run client-facing user flows
        run: npx playwright test -c playwright.reader-release.config.ts tests/visual/client-facing-user-flows.spec.ts tests/visual/report-library-ui.spec.ts
      - name: Upload visual smoke artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-smoke-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  studio-admin-flows:
    needs: scope
    if: needs.scope.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      VITE_SUPABASE_URL: https://visual-smoke.supabase.test
      VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:knowledge
      - run: npx playwright install --with-deps chromium
      - name: Run Content Studio admin user flows
        run: npx playwright test -c playwright.config.ts --fully-parallel --workers=1 --shard=${{ matrix.shard }}/4 tests/visual/content-dashboard-admin-user-flows.spec.ts tests/visual/calendar-review-queue-api.spec.ts tests/visual/review-queue-workflow.spec.ts tests/visual/content-publication-offline.spec.ts tests/visual/content-studio-reader-destinations.spec.ts tests/visual/content-studio-needs-attention.spec.ts
      - name: Upload Content Studio flow artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: studio-admin-flow-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  sky-placement-studio:
    needs: scope
    if: needs.scope.outputs.sky == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://visual-smoke.supabase.test
      VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Studio publication lifecycle and actual reader hydration
        run: npm run test:content-studio-api && npm run test:sky-evergreen-sections
      - run: npx playwright install --with-deps chromium
      - name: Verify placement composition editing and reader refresh stability
        run: |
          npx playwright test -c playwright.studio-secondary.config.ts
          npx playwright test -c playwright.sky-composition.config.ts
          npx playwright test -c playwright.config.ts --workers=1 tests/visual/sky-placement-retrograde.spec.ts tests/visual/sky-composable-reader.spec.ts tests/visual/sky-placement-stability.spec.ts tests/visual/sky-placement-publication-hydration.spec.ts tests/visual/sky-placement-hydration-boundary.spec.ts tests/visual/article-navigation-stability.spec.ts tests/visual/sky-you-transit-parity.spec.ts
      - name: Verify Studio crash recovery through the production web entry
        run: STUDIO_PRODUCTION_ENTRY=1 npx playwright test -c playwright.studio-recovery.config.ts
      - name: Upload Sky placement artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sky-placement-studio-results
          path: test-results/
          if-no-files-found: ignore

  sky-summary:
    needs: scope
    if: needs.scope.outputs.sky == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://visual-smoke.supabase.test
      VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:knowledge
      - name: Verify daily Sky summary composition
        run: npm run test:sky-daily-summary && node scripts/test-sky-placement-aspect-matrix.mjs
      - name: Verify daily Sky summary reader and Studio
        run: |
          npx playwright test -c playwright.config.ts --workers=1 tests/visual/sky-summary-cold-hydration.spec.ts tests/visual/sky-daily-summary.spec.ts tests/visual/sky-live-clock.spec.ts tests/visual/sky-summary-paragraphs.spec.ts tests/visual/sky-placement-aspects.spec.ts tests/visual/sky-refresh-performance.spec.ts tests/visual/sky-summary-supplied-copy.spec.ts
          npx playwright test -c playwright.sky-studio.config.ts
      - name: Enforce Content Studio bundle size and deferred editor boundaries
        run: node scripts/check-admin-bundle-budgets.mjs
      - name: Verify owner sign-in return and storage-timeout recovery
        run: npx playwright test -c playwright.studio-auth.config.ts
      - name: Verify Friends recovery, transit visibility, and Calendar dates
        run: |
          node --experimental-strip-types scripts/test-sky-aspect-date-range.mjs
          node scripts/test-you-transit-live-content-wiring.mjs
          node --import tsx scripts/test-transit-article-description.mts
          npx playwright test -c playwright.reader-recovery.config.ts
      - name: Upload Sky summary artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sky-summary-results
          path: test-results/
          if-no-files-found: ignore

env:
  PRIVATE_REPORT_DOCUMENTS: ${{ secrets.PRIVATE_REPORT_DOCUMENTS }}

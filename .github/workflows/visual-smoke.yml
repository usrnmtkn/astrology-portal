name: Visual smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://visual-smoke.supabase.test
      VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify fallback package manifest freshness
        run: node scripts/generate-fallback-package-manifest.mjs --check

      - name: Install dependencies
        run: npm ci

      - name: Audit form typography
        run: npm run qa:form-typography

      - name: Verify Content Studio link routing
        run: node --experimental-strip-types scripts/test-content-studio-link-routing.mjs

      - name: Verify Content Studio editor UX
        run: node scripts/test-admin-content-studio-usability.mjs

      - name: Verify Content Studio server module startup
        run: npm run build:knowledge && node scripts/test-content-live-status-node-runtime.mjs

      - name: Verify publication lifecycle and offline retirement
        run: npm run test:content-publications

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Enforce fresh browser release path
        run: npm run test:playwright-release-path

      - name: Build app
        run: npm run build

      - name: Verify production health endpoint imports
        run: npm run test:production-health

      - name: Verify production report smoke contract
        run: node scripts/test-production-report-smoke.mjs

      - name: Enforce browser knowledge boundary
        run: npm run test:browser-knowledge-boundary

      - name: Verify reader copy eligibility and content boundary
        run: npm run test:reader-copy-repair

      - name: Enforce web bundle budgets
        run: npm run qa:bundle

      - name: Verify startup performance contracts
        run: npm run test:performance-contracts

      - name: Run visual regression and smoke screens
        run: npx playwright test -c playwright.config.ts tests/visual/visual-regression-baseline.spec.ts tests/visual/visual-smoke.spec.ts

      - name: Run Content Studio admin user flows
        run: npx playwright test -c playwright.config.ts tests/visual/content-dashboard-admin-user-flows.spec.ts tests/visual/content-publication-offline.spec.ts tests/visual/content-studio-reader-destinations.spec.ts tests/visual/content-studio-needs-attention.spec.ts

      - name: Run client-facing user flows
        run: npx playwright test -c playwright.config.ts tests/visual/client-facing-user-flows.spec.ts tests/visual/report-library-ui.spec.ts

      - name: Run Friends loading performance matrix
        run: npm run qa:friends-loading-matrix

      - name: Upload visual smoke artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-smoke-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  sky-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://visual-smoke.supabase.test
      VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:knowledge
      - name: Verify daily Sky summary composition
        run: npm run test:sky-daily-summary
      - name: Verify daily Sky summary reader and Studio
        run: |
          npx playwright test -c playwright.config.ts --workers=1 tests/visual/sky-daily-summary.spec.ts
          npx playwright test -c playwright.sky-studio.config.ts
      - name: Enforce Content Studio bundle size and deferred editor boundaries
        run: node scripts/check-admin-bundle-budgets.mjs
      - name: Upload Sky summary artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sky-summary-results
          path: test-results/
          if-no-files-found: ignore

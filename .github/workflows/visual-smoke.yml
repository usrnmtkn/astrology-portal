name: Visual smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify fallback package manifest freshness
        run: node scripts/generate-fallback-package-manifest.mjs --check

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Enforce CSS token integrity
        run: npm run qa:css-token-integrity

      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://visual-smoke.supabase.test
          VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder

      - name: Enforce web bundle budgets
        run: npm run qa:bundle

      - name: Verify startup performance contracts
        run: npm run test:performance-contracts

      - name: Run admin user flows
        run: npx playwright test -c playwright.config.ts tests/visual/content-dashboard-admin-user-flows.spec.ts

      - name: Run client-facing user flows
        run: npx playwright test -c playwright.config.ts tests/visual/client-facing-user-flows.spec.ts

      - name: Run visual regression and smoke screens
        run: npx playwright test -c playwright.config.ts tests/visual/visual-regression-baseline.spec.ts tests/visual/visual-smoke.spec.ts

      - name: Upload visual smoke artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-smoke-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

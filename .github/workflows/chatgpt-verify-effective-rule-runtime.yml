name: Verify effective writing-rule runtime integration

on:
  push:
    branches:
      - chatgpt/effective-writing-rules-runtime-current-main-v2
    paths:
      - .github/workflows/chatgpt-verify-effective-rule-runtime.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out runtime branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/effective-writing-rules-runtime-current-main-v2
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify effective-rule runtime contract
        run: node scripts/test-effective-writing-rule-runtime-integration.mjs
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/chatgpt-verify-effective-rule-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/chatgpt-verify-effective-rule-runtime.yml
          git commit -m "Remove temporary effective-rule runtime verification"
          git push origin HEAD:chatgpt/effective-writing-rules-runtime-current-main-v2

name: Temporary Content Studio final QA

on:
  push:
    branches:
      - chatgpt/content-studio-hydration-crud-audit-finalqa

permissions:
  contents: write

concurrency:
  group: temporary-content-studio-finalqa
  cancel-in-progress: false

jobs:
  finalqa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/content-studio-hydration-crud-audit-finalqa
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build test dependencies
        run: npm run build -w @tldr/astro-knowledge

      - name: Apply final concurrency repair
        run: python scripts/tmp_content_studio_final_concurrency_patch.py

      - name: Focused CRUD hydration and concurrency QA
        run: |
          node --import tsx scripts/test-content-studio-crud-hydration-guards.mjs
          node scripts/test-content-studio-hydration-reliability.mjs
          node scripts/test-content-studio-special-mutation-concurrency.mjs
          node --import tsx scripts/test-content-studio-api-roundtrip.mjs
          node scripts/test-admin-transit-source-crud.mjs
          node --import tsx scripts/test-fallback-dashboard-live-overlay.mjs
          node --import tsx scripts/test-fallback-dashboard-dynamic-natal-exact.mjs
          node --import tsx scripts/test-admin-natal-placement-preview-api.mjs
          node scripts/test-admin-natal-placement-preview-dependencies.mjs
          node scripts/test-admin-writing-surface-map.mjs
          node scripts/test-friends-chart-performance-contract.mjs
          node --import tsx scripts/test-sky-owner-review-actions.mjs

      - name: Typecheck and production builds
        run: |
          npm run typecheck
          npm run build:web
          npm run build:admin

      - name: Commit clean final repair
        run: |
          rm -f scripts/tmp_content_studio_final_concurrency_patch.py
          rm -f .github/workflows/temporary-content-studio-finalqa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(content): close Content Studio concurrency gaps"
          git push origin HEAD:chatgpt/content-studio-hydration-crud-audit-finalqa

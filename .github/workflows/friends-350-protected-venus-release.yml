name: Friends 350 protected Venus release

on:
  push:
    branches:
      - chatgpt/friends-transit-351-owner-live-v1

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/friends-transit-351-owner-live-v1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/tldrastro-api/pyproject.toml
      - name: Merge current main history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned API dependencies
        working-directory: services/tldrastro-api
        run: python -m pip install -e ".[dev]"
      - name: Reconcile serving contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const sunPath = 'scripts/test-sun-friends-serving-v1.mjs';
          let sun = fs.readFileSync(sunPath, 'utf8');
          sun = sun.replace(
            'assert.equal(otherExplicit.length, 351, "The separately owner-approved non-Sun Friends release must populate exactly 351 additional transit rows.");',
            'assert.equal(otherExplicit.length, 350, "The separately owner-approved non-Sun Friends release must populate exactly 350 additional transit rows; Venus square Moon remains You-only.");'
          );
          fs.writeFileSync(sunPath, sun);

          const signoffPath = 'scripts/test-friends-owner-signoff-ruling.mjs';
          let signoff = fs.readFileSync(signoffPath, 'utf8');
          signoff = signoff
            .replaceAll('transit-aspect-friends-nonsun-351-owner-live-2026-09-03.json', 'transit-aspect-friends-nonsun-350-owner-live-2026-09-03.json')
            .replace('assert.equal(nonSunFriendsAuthorization.count, 351);', 'assert.equal(nonSunFriendsAuthorization.count, 350);')
            .replace('assert.equal(postSnapshotNonSunFriendKeys.size, 351);', 'assert.equal(postSnapshotNonSunFriendKeys.size, 350);');
          fs.writeFileSync(signoffPath, signoff);

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const needle = 'node scripts/test-friends-transit-nonsun-serving-v1.mjs && ';
          const add = 'node scripts/test-venus-moon-hard-owner-published-you-v1.mjs && ';
          if (!pkg.scripts['test:content'].includes(add.trim())) {
            if (!pkg.scripts['test:content'].includes(needle)) throw new Error('Friends non-Sun test hook not found in test:content.');
            pkg.scripts['test:content'] = pkg.scripts['test:content'].replace(needle, `${needle}${add}`);
          }
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
      - name: Apply exact 350-member owner release
        run: node scripts/promote-friends-transit-completion-v1.mjs --apply
      - name: Rebuild fallback browser resolver
        run: npx esbuild apps/web/src/content/fallbackArchitectureV3/resolver/index.browser.ts --bundle --format=esm --outfile=apps/web/src/content/fallbackArchitectureV3/dist/tldr-content.js
      - name: Regenerate governed fallback artifacts
        run: |
          node scripts/generate-fallback-package-manifest.mjs
          node scripts/build-canonical-content-hub.mjs --write
          node scripts/build-knowledge-index.mjs --write
          node scripts/build-phrase-index.mjs --write
          node scripts/build-production-sky-kernel-comparison.mjs --write
          node scripts/build-content-inventory.mjs --source-commit=${GITHUB_SHA}
          node scripts/build-content-export.mjs
          npm run build:writing-harness
      - name: Run protected Friends focused gates
        run: |
          node scripts/promote-friends-transit-completion-v1.mjs
          node scripts/test-friends-transit-completion-v1.mjs
          node scripts/test-friends-transit-nonsun-serving-v1.mjs
          node scripts/test-venus-moon-hard-owner-published-you-v1.mjs
          node scripts/test-sun-friends-serving-v1.mjs
          node --experimental-strip-types scripts/test-transit-friend-pronoun-grammar.mjs
          node --import tsx scripts/test-friends-transit-detail-provenance-gate.mjs
          node scripts/test-fallback-refresh-wiring.mjs
          node scripts/test-fallback-package-cache-contract.mjs
          node scripts/test-content-inventory-export.mjs
          node scripts/test-friends-owner-signoff-ruling.mjs
          node scripts/generate-fallback-package-manifest.mjs --check
          node scripts/build-knowledge-index.mjs --check
          node scripts/build-phrase-index.mjs --check
          git diff --check
      - name: Run repository typecheck
        run: npm run typecheck
      - name: Run full content gate
        run: npm run test:content
      - name: Build web application
        run: npm run build:web
      - name: Enforce authorized bundle budgets
        run: npm run qa:bundle
      - name: Review corrective release diff
        run: |
          git status --short
          git diff --stat
          git diff --check
      - name: Commit and push corrected release
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "release(friends): preserve Venus Moon Friends source gap"
          fi
          git push origin HEAD:chatgpt/friends-transit-351-owner-live-v1

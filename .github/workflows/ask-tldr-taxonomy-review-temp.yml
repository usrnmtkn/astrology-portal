name: Temp validate Ask TLDR taxonomy review

on:
  push:
    branches:
      - chatgpt/ask-tldr-taxonomy-review-clean

permissions:
  contents: write

jobs:
  validate-taxonomy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/ask-tldr-taxonomy-review-clean
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run taxonomy contract
        run: node scripts/test-ask-tldr-question-taxonomy.mjs
      - name: Remove temporary workflow after successful validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ask-tldr-taxonomy-review-temp.yml
          git add -A .github/workflows/ask-tldr-taxonomy-review-temp.yml
          git commit -m "chore: remove temporary Ask TLDR taxonomy validator"
          git push origin HEAD:chatgpt/ask-tldr-taxonomy-review-clean

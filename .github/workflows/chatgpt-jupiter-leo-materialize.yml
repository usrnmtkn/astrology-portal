name: Materialize approved Jupiter Leo house set

on:
  push:
    branches:
      - chatgpt/jupiter-leo-12-owner-approved-current-main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/jupiter-leo-12-owner-approved-current-main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize protected house passages
        run: npm run content:materialize-sky-placement-houses

      - name: Regenerate fallback reader partitions and manifests
        run: npm run build:fallback-manifest

      - name: Verify protected Jupiter in Leo passages
        run: node scripts/test-sky-placement-house-templates.mjs

      - name: Verify generated package freshness
        run: node scripts/generate-fallback-package-manifest.mjs --check

      - name: Commit generated package and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-jupiter-leo-materialize.yml
          git add apps/web/src/content/fallbackArchitectureV3 packages/astro-knowledge/review/jupiter-leo-house-horoscopes-owner-approved-12-2026-09-05
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 1
          fi
          git commit -m "Regenerate approved Jupiter in Leo 12-house reader package"
          git push origin HEAD:chatgpt/jupiter-leo-12-owner-approved-current-main

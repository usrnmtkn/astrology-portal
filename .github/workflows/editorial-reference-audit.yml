name: Editorial reference cleanup verification
on:
  push:
    branches: [chatgpt/remove-external-editorial-references-20260916]
    paths: [.github/workflows/editorial-reference-audit.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-external-editorial-references-20260916
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm isolated branch and capture existing failures
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = chatgpt/remove-external-editorial-references-20260916
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p /tmp/editorial-cleanup-verification
          git status --porcelain
          git rev-parse HEAD > /tmp/editorial-cleanup-verification/input-commit.txt
          set +e
          node packages/astro-knowledge/scripts/test-placement-pipeline.js > /tmp/editorial-cleanup-verification/baseline-placement.log 2>&1
          echo "$?" > /tmp/editorial-cleanup-verification/baseline-placement.exit
          node packages/astro-knowledge/scripts/test-satori-writer.js > /tmp/editorial-cleanup-verification/baseline-writer.log 2>&1
          echo "$?" > /tmp/editorial-cleanup-verification/baseline-writer.exit
      - name: Apply source cleanup and rebuild generated policy
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/editorial-reference-cleanup.py | tee /tmp/editorial-cleanup-verification/source-changes.json
          node packages/astro-knowledge/scripts/compile-satori-editorial-decisions.js
          node scripts/build-writing-harness-instructions.mjs
          node scripts/build-knowledge-index.mjs --write > /tmp/editorial-cleanup-verification/knowledge-build.log
          node scripts/build-phrase-index.mjs --write > /tmp/editorial-cleanup-verification/phrase-build.log
          node scripts/generate-fallback-package-manifest.mjs > /tmp/editorial-cleanup-verification/fallback-build.log
          git rm -- .github/editorial-reference-cleanup.py
      - name: Required focused checks
        shell: bash
        run: |
          set -euo pipefail
          {
            node scripts/test-editorial-reference-policy.mjs
            node packages/astro-knowledge/scripts/compile-satori-editorial-decisions.js --check
            node packages/astro-knowledge/scripts/test-satori-editorial-decisions.js
            node packages/astro-knowledge/scripts/test-adjacent-voice-recognizability.js
            node packages/astro-knowledge/scripts/test-sky-placement-structural-slots.js
            node scripts/test-editorial-copy-boundary.mjs
            node scripts/build-knowledge-index.mjs --check
            node scripts/build-phrase-index.mjs --check
            git diff --check
          } | tee /tmp/editorial-cleanup-verification/focused-checks.log
          set +e
          node packages/astro-knowledge/scripts/test-placement-pipeline.js > /tmp/editorial-cleanup-verification/updated-placement.log 2>&1
          echo "$?" > /tmp/editorial-cleanup-verification/updated-placement.exit
          node packages/astro-knowledge/scripts/test-satori-writer.js > /tmp/editorial-cleanup-verification/updated-writer.log 2>&1
          echo "$?" > /tmp/editorial-cleanup-verification/updated-writer.exit
      - name: Install isolated dependencies and check content boundary
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts > /tmp/editorial-cleanup-verification/npm-ci.log 2>&1
          npm run build:knowledge > /tmp/editorial-cleanup-verification/knowledge-package-build.log 2>&1
          set +e
          npm run test:reader-copy-boundary > /tmp/editorial-cleanup-verification/reader-copy-suite.log 2>&1
          echo "$?" > /tmp/editorial-cleanup-verification/reader-copy-suite.exit
          npm run test:content-studio-api > /tmp/editorial-cleanup-verification/content-studio-suite.log 2>&1
          echo "$?" > /tmp/editorial-cleanup-verification/content-studio-suite.exit
      - name: Record checks and push only the cleanup branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, json
          out=pathlib.Path('/tmp/editorial-cleanup-verification')
          statuses={p.stem:p.read_text().strip() for p in out.glob('*.exit')}
          assert statuses['baseline-placement']==statuses['updated-placement'], statuses
          assert statuses['baseline-writer']==statuses['updated-writer'], statuses
          report='''# Editorial reference cleanup - 2026-09-16

          This branch removes explicit named external editorial attributions, links,
          comparison metadata, and positive outside-writer targets. The standalone
          comparison document and database name-to-alias rewriting utility are removed.
          A full-tree text guard replaces the former exemption-based attribution test.

          Scope: source files only. No merge, deployment, migration, database write,
          publication, approval-state change, or Git-history rewrite is performed.
          Legacy `cc/...` content IDs, workbook provenance, and other abbreviated
          source records remain. Their replacement requires a coordinated content
          and persisted-ID migration; this is not a purge of those sources.
          The scanner checks text and filenames; binary visual content is not covered.
          Spreadsheet XML was separately checked and had no explicit name matches.

          The staged content JSON changes only specified comparison/source metadata.
          Locked transit entries change only source-link arrays. Reader strings,
          review states, source-row keys and approvals are preserved.

          Focused checks: reference policy, editorial policy compilation/freshness,
          editorial decision regressions, adjacent-voice judge boundaries,
          structural slot regressions, editorial-copy boundary, and knowledge/phrase
          index freshness all passed. See the branch workflow logs for full output.

          Broader-suite exit codes (zero means passed):
          '''
          for name,status in sorted(statuses.items()):report+=f'\n- {name}: {status}'
          report+='\n\nThe two baseline/updated comparisons have existing failures on the input snapshot.\nNo full-application pass or production verification is claimed.\n'
          report='\n'.join(line[10:] if line.startswith('          ') else line for line in report.splitlines())+'\n'
          pathlib.Path('docs/qa/editorial-reference-cleanup-2026-09-16.md').write_text(report)
          (out/'suite-statuses.json').write_text(json.dumps(statuses,indent=2))
          print(json.dumps(statuses,indent=2))
          PY
          node scripts/test-editorial-reference-policy.mjs
          git diff --check
          git add -u
          git add docs/qa/editorial-reference-cleanup-2026-09-16.md
          git diff --cached --stat | tee /tmp/editorial-cleanup-verification/changed-files.txt
          git diff --cached --binary > /tmp/editorial-cleanup-verification/cleanup.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove named external editorial references and enforce full-tree checks'
          git push origin HEAD:refs/heads/chatgpt/remove-external-editorial-references-20260916
          git rev-parse HEAD | tee /tmp/editorial-cleanup-verification/output-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-cleanup-verification
          path: /tmp/editorial-cleanup-verification/
          retention-days: 2

name: Editorial reference audit
on:
  push:
    branches: [chatgpt/remove-external-editorial-references-20260916]
    paths: [.github/workflows/editorial-reference-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked snapshot for dependency review
        shell: bash
        run: |
          mkdir -p /tmp/editorial-reference-context
          git archive --format=tar.gz HEAD > /tmp/editorial-reference-context/repository.tar.gz
          git rev-parse HEAD > /tmp/editorial-reference-context/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-reference-context
          path: /tmp/editorial-reference-context/
          retention-days: 1

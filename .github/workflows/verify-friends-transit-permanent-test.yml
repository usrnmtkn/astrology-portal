name: Verify permanent Friends transit corpus contract

on:
  push:
    branches:
      - chatgpt/friends-transits-complete-v1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/friends-transits-complete-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-friends-transit-completion-v1.mjs
      - run: git diff --check

name: Browser suite coverage

# A browser suite that no workflow runs is not a gate. This check owns that question on its own so
# it still runs when the browser QA workflow is narrowed, disabled, or skipped by a path filter.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # A workflow can be disabled in the repository while its file still looks correct, so the check
  # reads the workflow states as well as the files.
  actions: read

concurrency:
  group: browser-suite-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-suite-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify every browser suite is run by an enabled workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/test-browser-suite-coverage.mjs

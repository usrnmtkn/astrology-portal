name: ChatGPT Content Studio Navigation Patch

on:
  push:
    branches:
      - chatgpt/content-studio-navigation-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/content-studio-navigation-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply navigation fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/admin/src/GeneratedContentAdminDashboard.tsx")
          source = path.read_text()
          if "const hasOpenEditor = Boolean(" not in source:
              old = '''  function closeEditor() {\n    if (isLoading) return false;\n'''
              new = '''  function closeEditor() {\n    const hasOpenEditor = Boolean(\n      selectedRow\n      || draft\n      || compositionEditorContext\n      || skyArticleEditor\n      || skyArticleEditionForm\n    );\n    if (isLoading && hasOpenEditor) {\n      setMessage("Finish the current editor operation before leaving this section.");\n      return false;\n    }\n'''
              if old not in source:
                  raise SystemExit("closeEditor guard did not match expected source")
              source = source.replace(old, new, 1)
              path.write_text(source)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify navigation contract
        run: node scripts/test-content-studio-navigation.mjs
      - name: Build Content Studio
        run: npm run build:admin
      - name: Commit source fix
        run: |
          if git diff --quiet -- apps/admin/src/GeneratedContentAdminDashboard.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/GeneratedContentAdminDashboard.tsx
          git commit -m "Fix Content Studio section navigation"
          git push origin HEAD:chatgpt/content-studio-navigation-20260906

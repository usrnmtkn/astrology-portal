name: Temporary Content Studio Step 4 LKG

on:
  push:
    branches:
      - chatgpt/content-studio-step4-lkg

permissions:
  contents: write

concurrency:
  group: temporary-content-studio-step4-lkg
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build knowledge dependency
        run: npm run build -w @tldr/astro-knowledge
      - name: Apply Step 4 LKG patch
        run: |
          bash scripts/temporary-step4-lkg-patch.sh
          bash scripts/temporary-step4-lkg-public-reader.sh
      - name: Refresh current production snapshot through reader RLS
        run: node scripts/refresh-content-studio-last-known-good.mjs
      - name: Last-known-good and Step 4 QA
        run: |
          git diff --check
          node scripts/test-content-studio-last-known-good.mjs
          node scripts/test-content-studio-reader-cache-rehydrate.mjs
          node scripts/test-content-studio-runtime-cache-invalidation.mjs
          node scripts/test-content-studio-cms-performance.mjs
          node --import tsx scripts/test-content-studio-crud-hydration-guards.mjs
          node --import tsx scripts/test-content-studio-atomic-concurrency.mjs
          node --import tsx scripts/test-content-studio-prepopulate-live-race.mjs
          node scripts/test-content-studio-hydration-reliability.mjs
          node scripts/test-content-studio-special-mutation-concurrency.mjs
          node --import tsx scripts/test-content-studio-api-roundtrip.mjs
          node --import tsx scripts/test-fallback-dashboard-live-overlay.mjs
          node --import tsx scripts/test-fallback-dashboard-dynamic-natal-exact.mjs
          node --import tsx scripts/test-admin-natal-placement-preview-api.mjs
          node scripts/test-admin-natal-placement-preview-dependencies.mjs
      - name: Typecheck and builds
        run: |
          npm run typecheck
          npm run build:web
          npm run build:admin
      - name: Commit clean Step 4 LKG checkpoint
        run: |
          rm .github/workflows/temporary-content-studio-step4-lkg.yml
          rm scripts/temporary-step4-lkg-patch.sh
          rm scripts/temporary-step4-lkg-public-reader.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(content): add nightly CMS last-known-good fallback"
          git push

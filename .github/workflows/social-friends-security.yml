name: Social friends security

on:
  pull_request:
    paths:
      - "api/account.ts"
      - "api/_lib/**"
      - "api/friend-report-checkout.ts"
      - "api/friend-report-request.ts"
      - "api/you-report-request.ts"
      - "api/report-share.ts"
      - "api/generate-friend-transit-reading.ts"
      - "api/stripe-webhook.ts"
      - "api/cron/run-friend-report-jobs.ts"
      - "api/cron/run-you-report-jobs.ts"
      - "api/admin/friend-report-test-cleanup.ts"
      - "api/admin/generated-report-feedback.ts"
      - "apps/admin/src/GeneratedReportDraftReview.tsx"
      - "apps/admin/src/ReportFulfillmentAdminPanel.tsx"
      - "apps/web/src/App.tsx"
      - "apps/web/src/main.tsx"
      - "apps/web/src/features/friends/**"
      - "apps/web/src/features/you/**"
      - "apps/web/src/components/**"
      - "apps/web/src/services/**"
      - "apps/web/src/content/**"
      - "apps/web/src/styles/**"
      - "apps/web/src/styles.css"
      - "apps/web/src/types.ts"
      - "apps/web/supabase/**"
      - "packages/**"
      - "artifacts/owner-author-*-2026-*.md"
      - "scripts/test-*friend*"
      - "scripts/test-*report*"
      - "scripts/test-birth-time-angle-reliability.mts"
      - "scripts/test-transit-reading-checkpoints.mts"
      - "tldr-astro-phrasebank/TLDR-GENERATED-REPORT-*.md"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/social-friends-security.yml"
  push:
    branches: [main]
    paths:
      - "api/account.ts"
      - "api/_lib/**"
      - "api/friend-report-checkout.ts"
      - "api/friend-report-request.ts"
      - "api/you-report-request.ts"
      - "api/report-share.ts"
      - "api/generate-friend-transit-reading.ts"
      - "api/stripe-webhook.ts"
      - "api/cron/run-friend-report-jobs.ts"
      - "api/cron/run-you-report-jobs.ts"
      - "api/admin/friend-report-test-cleanup.ts"
      - "api/admin/generated-report-feedback.ts"
      - "apps/admin/src/GeneratedReportDraftReview.tsx"
      - "apps/admin/src/ReportFulfillmentAdminPanel.tsx"
      - "apps/web/src/App.tsx"
      - "apps/web/src/main.tsx"
      - "apps/web/src/features/friends/**"
      - "apps/web/src/features/you/**"
      - "apps/web/src/components/**"
      - "apps/web/src/services/**"
      - "apps/web/src/content/**"
      - "apps/web/src/styles/**"
      - "apps/web/src/styles.css"
      - "apps/web/src/types.ts"
      - "apps/web/supabase/**"
      - "packages/**"
      - "artifacts/owner-author-*-2026-*.md"
      - "scripts/test-*friend*"
      - "scripts/test-*report*"
      - "scripts/test-birth-time-angle-reliability.mts"
      - "scripts/test-transit-reading-checkpoints.mts"
      - "tldr-astro-phrasebank/TLDR-GENERATED-REPORT-*.md"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/social-friends-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-friends-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  social-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:knowledge
      - run: node scripts/test-social-friends-contract.mjs
      - run: node --import tsx scripts/test-birth-time-angle-reliability.mts
      - run: node --import tsx scripts/test-friend-transit-reading-contract.mts
      - run: node --import tsx scripts/test-friend-report-paid-lifecycle.mts
      - run: node --import tsx scripts/test-you-report-paid-lifecycle.mts
      - run: node --import tsx scripts/test-generated-report-judge-governance.mts
      - run: node --import tsx scripts/test-generated-report-correction.mjs
      - run: node --import tsx scripts/test-report-quality-retries.mjs
      - run: node --import tsx scripts/test-transit-reading-checkpoints.mts
      - run: node --import tsx scripts/test-report-worker-continuation.mjs
      - run: node --import tsx scripts/test-generated-report-owner-corpus.mjs
      - run: node --import tsx scripts/test-generated-report-breadth.mjs
      - run: node --import tsx scripts/test-friend-transit-reading-request-render.mjs
      - run: npm run typecheck
      - run: npm run build:web

  database-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Start ephemeral Supabase database
        run: supabase db start --workdir apps/web
      - name: Apply migrations to a clean database
        run: supabase db reset --local --workdir apps/web
      - name: Run rollback-only cross-user authorization test
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f apps/web/supabase/tests/social_friend_authorization.sql
      - name: Run Friends report lifecycle authorization test
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f apps/web/supabase/tests/friend_report_lifecycle_authorization.sql
      - name: Run You report lifecycle authorization test
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f apps/web/supabase/tests/you_report_lifecycle_authorization.sql
      - name: Run You report production hardening test
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f apps/web/supabase/tests/you_report_production_hardening.sql
      - name: Run generated report owner feedback authorization test
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/test-generated-report-owner-feedback-authorization.sql
      - name: Run report checkpoint storage authorization test
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f apps/web/supabase/tests/transit_report_model_checkpoints.sql
      - name: Stop ephemeral Supabase database
        if: always()
        run: supabase stop --workdir apps/web --no-backup

env:
  PRIVATE_REPORT_DOCUMENTS: ${{ secrets.PRIVATE_REPORT_DOCUMENTS }}

name: Temporary natal preview hydration parity

on:
  push:
    branches:
      - chatgpt/content-studio-natal-preview-parity

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build knowledge prerequisite
        run: npm run build -w @tldr/astro-knowledge

      - name: Run natal preview parity tests
        run: |
          node --experimental-strip-types scripts/test-admin-natal-placement-sources.mjs
          node --experimental-strip-types scripts/test-admin-natal-placement-preview-dependencies.mjs
          node --import tsx scripts/test-admin-natal-placement-preview-api.mjs

      - name: Run typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build:web

      - name: Build admin
        run: npm run build:admin

      - name: Remove temporary workflow
        run: rm .github/workflows/temporary-natal-preview-parity.yml

      - name: Commit workflow cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: remove temporary natal preview parity gate"
          git push origin HEAD:chatgpt/content-studio-natal-preview-parity

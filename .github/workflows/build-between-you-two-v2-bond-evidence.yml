name: Build Between You Two V2 bond evidence
on:
  push:
    branches:
      - owner/between-you-two-v2-20260905
    paths:
      - scripts/build-between-you-two-v2-bond-evidence.mjs
      - .github/workflows/build-between-you-two-v2-bond-evidence.yml
permissions:
  contents: write
jobs:
  build-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/build-between-you-two-v2-bond-evidence.mjs
      - name: Commit evidence artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/astro-knowledge/review/between-you-two-v2-2026-09-05/bond-evidence-28.json
          git diff --cached --check
          git commit -m "review(friends): capture 28 canonical V2 bond families"
          git push origin HEAD

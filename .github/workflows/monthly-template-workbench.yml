name: Monthly template workbench
on:
  push:
    branches: [chatgpt/monthly-editorial-template-final]
    paths: [.github/workflows/monthly-template-workbench.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:knowledge
      - name: Export isolated test dependencies
        run: |
          mkdir -p /tmp/monthly-template-dependencies
          git rev-parse HEAD > /tmp/monthly-template-dependencies/source-sha.txt
          tar -czf /tmp/monthly-template-dependencies/dependencies.tar.gz node_modules packages/astro-knowledge/dist
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-template-dependencies
          path: /tmp/monthly-template-dependencies
          retention-days: 1

name: ChatGPT Friends Reading Test Access Current Main

on:
  push:
    branches:
      - chatgpt/friends-reading-test-access-current-main-20260906

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test-friend-transit-reading-request-render.mjs
      - run: node --experimental-strip-types scripts/test-friend-transit-reading-contract.mts
      - run: node --import tsx scripts/test-friend-natal-chart-completeness.mjs
      - run: npm run typecheck
      - run: npm run build:knowledge
      - run: npm run build:web

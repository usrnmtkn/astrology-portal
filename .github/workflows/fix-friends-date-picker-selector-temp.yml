name: Temp repair Friends date picker selector

on:
  push:
    branches:
      - fix/friends-date-picker-exact-region-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/friends-date-picker-exact-region-20260906
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Patch ambiguous Friends locator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/visual/client-facing-user-flows.spec.ts')
          s = p.read_text()
          old = '    await expect(page.getByLabel("Friends")).toBeVisible();'
          new = '    await expect(page.getByRole("region", { name: "Friends", exact: true })).toBeVisible();'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-friends-date-picker-selector-temp.yml
          git add tests/visual/client-facing-user-flows.spec.ts .github/workflows/fix-friends-date-picker-selector-temp.yml
          git commit -m "test: target exact Friends region in date picker flow"
          git push origin HEAD:fix/friends-date-picker-exact-region-20260906

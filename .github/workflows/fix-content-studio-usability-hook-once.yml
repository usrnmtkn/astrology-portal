name: Fix Content Studio usability hook once

on:
  push:
    branches:
      - chatgpt/content-studio-usability-cleanup

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore quiet aspect-context test hook
        run: |
          python - <<'PY'
          from pathlib import Path
          dashboard = Path('apps/admin/src/GeneratedContentAdminDashboard.tsx')
          text = dashboard.read_text()
          old = '<span className="admin-review-queue-use">{readerUse}</span>'
          new = '<span className="admin-review-queue-use admin-aspect-context-pill">{readerUse}</span>'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one reader-use span, found {text.count(old)}')
          dashboard.write_text(text.replace(old, new, 1))

          test = Path('scripts/test-admin-content-studio-usability.mjs')
          test_text = test.read_text()
          old_test = 'className="admin-review-queue-use">\\{readerUse\\}<\\/span>'
          new_test = 'className="admin-review-queue-use admin-aspect-context-pill">\\{readerUse\\}<\\/span>'
          if test_text.count(old_test) != 1:
              raise SystemExit(f'expected exactly one focused reader-use assertion, found {test_text.count(old_test)}')
          test.write_text(test_text.replace(old_test, new_test, 1))
          PY
      - name: Verify focused usability contracts
        run: |
          node scripts/test-admin-content-studio-usability.mjs
          node scripts/test-admin-friends-transits-navigation.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/GeneratedContentAdminDashboard.tsx scripts/test-admin-content-studio-usability.mjs
          git commit -m "Preserve aspect context on quiet review metadata"
          git push origin HEAD:chatgpt/content-studio-usability-cleanup

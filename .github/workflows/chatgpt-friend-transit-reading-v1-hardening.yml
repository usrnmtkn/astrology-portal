name: ChatGPT Friend Transit Reading V1 Hardening

on:
  push:
    branches:
      - chatgpt/friend-transit-reading-v1-20260906

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/friend-transit-reading-v1-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Harden request and UI state boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              source = path.read_text()
              if new in source:
                  return
              if old not in source:
                  raise SystemExit(f"{label} did not match")
              path.write_text(source.replace(old, new, 1))

          # Stronger personal-transit proof: a writer-eligible item needs actual approved reader copy and provenance.
          path = Path("api/_lib/friend-transit-reading.ts")
          source = path.read_text()
          old = '''  if ([...primaryThemes, ...longerCycles].some((item) => !item.detailAvailable || !item.evidence.transitPlanet || !item.evidence.aspect || !item.evidence.natalPoint)) {\n    throw new Error("FRIEND_TRANSIT_READING_PERSONAL_EVIDENCE_INVALID");\n  }'''
          new = '''  if ([...primaryThemes, ...longerCycles].some((item) => (\n    !item.detailAvailable\n    || !item.id\n    || !item.title\n    || !item.summary\n    || !item.evidence.transitPlanet\n    || !item.evidence.aspect\n    || !item.evidence.natalPoint\n    || item.evidence.contentKeys.length === 0\n  ))) {\n    throw new Error("FRIEND_TRANSIT_READING_PERSONAL_EVIDENCE_INVALID");\n  }'''
          if old in source:
              source = source.replace(old, new, 1)

          anchor = '''export function friendTransitReadingCanGenerate(brief: FriendTransitReadingBrief) {\n  return [...brief.primaryThemes, ...brief.longerCycles].length > 0;\n}\n'''
          addition = '''export function friendTransitReadingCanGenerate(brief: FriendTransitReadingBrief) {\n  return [...brief.primaryThemes, ...brief.longerCycles].length > 0;\n}\n\nexport function friendTransitReadingRequestLock(input: { brief: unknown; subjectId: string; targetDate: string }) {\n  const brief = assertFriendTransitReadingBrief(input.brief);\n  const subjectId = stringValue(input.subjectId);\n  const targetDate = stringValue(input.targetDate);\n  if (!subjectId) throw new Error("FRIEND_TRANSIT_READING_SUBJECT_REQUIRED");\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/u.test(targetDate)) throw new Error("FRIEND_TRANSIT_READING_TARGET_DATE_REQUIRED");\n  if (!friendTransitReadingCanGenerate(brief)) throw new Error("FRIEND_TRANSIT_READING_NO_PERSONAL_TRANSIT_EVIDENCE");\n  return {\n    brief,\n    contentKey: `friend-transit-reading/${subjectId}/${targetDate}`,\n    surface: "friends" as const,\n    mode: "in_depth" as const,\n    eventType: FRIEND_TRANSIT_READING_EVENT_TYPE,\n    headline: `What's going on with ${brief.friendName} right now?`,\n    knowledgeIds: friendTransitReadingKnowledgeIds(brief),\n    facts: {\n      contentType: FRIEND_TRANSIT_READING_CONTENT_TYPE,\n      blockType: FRIEND_TRANSIT_READING_CONTENT_TYPE,\n      friendTransitsBrief: brief\n    },\n    sourceSnapshot: {\n      schema: "friend-transit-reading-source.v1",\n      briefSchema: brief.schema,\n      friendName: brief.friendName,\n      dateLabel: brief.dateLabel,\n      counts: brief.counts,\n      targetDate\n    }\n  };\n}\n'''
          if addition not in source:
              if anchor not in source: raise SystemExit("request lock anchor missing")
              source = source.replace(anchor, addition, 1)
          path.write_text(source)

          # Server must use the pure lock instead of reconstructing authority inline.
          path = Path("api/generate-user-content.ts")
          source = path.read_text()
          source = source.replace(
              '''  assertFriendTransitReadingBrief,\n  friendTransitReadingCanGenerate,\n  friendTransitReadingKnowledgeIds\n} from "./_lib/friend-transit-reading.js";''',
              '''  friendTransitReadingRequestLock\n} from "./_lib/friend-transit-reading.js";'''
          )
          old_block = '''    if (input.subjectType === "friend_transit_reading") {\n      const brief = assertFriendTransitReadingBrief(input.facts?.friendTransitsBrief);\n      if (!friendTransitReadingCanGenerate(brief)) {\n        throw new Error("FRIEND_TRANSIT_READING_NO_PERSONAL_TRANSIT_EVIDENCE");\n      }\n      const targetDate = typeof input.targetDate === "string" && /^\\d{4}-\\d{2}-\\d{2}$/u.test(input.targetDate)\n        ? input.targetDate\n        : "";\n      if (!targetDate) throw new Error("FRIEND_TRANSIT_READING_TARGET_DATE_REQUIRED");\n      input.contentKey = `friend-transit-reading/${input.subjectId}/${targetDate}`;\n      input.surface = "friends";\n      input.mode = "in_depth";\n      input.eventType = FRIEND_TRANSIT_READING_EVENT_TYPE;\n      input.headline = `What's going on with ${brief.friendName} right now?`;\n      input.knowledgeIds = friendTransitReadingKnowledgeIds(brief);\n      input.facts = {\n        contentType: FRIEND_TRANSIT_READING_CONTENT_TYPE,\n        blockType: FRIEND_TRANSIT_READING_CONTENT_TYPE,\n        friendTransitsBrief: brief\n      };\n      input.sourceSnapshot = {\n        schema: "friend-transit-reading-source.v1",\n        briefSchema: brief.schema,\n        friendName: brief.friendName,\n        dateLabel: brief.dateLabel,\n        counts: brief.counts,\n        targetDate\n      };\n      input.voiceNotes = undefined;\n      input.allowQualityFallback = false;\n      input.status = "DRAFT";\n    }'''
          new_block = '''    if (input.subjectType === "friend_transit_reading") {\n      const locked = friendTransitReadingRequestLock({\n        brief: input.facts?.friendTransitsBrief,\n        subjectId: input.subjectId,\n        targetDate: typeof input.targetDate === "string" ? input.targetDate : ""\n      });\n      input.contentKey = locked.contentKey;\n      input.surface = locked.surface;\n      input.mode = locked.mode;\n      input.eventType = locked.eventType;\n      input.headline = locked.headline;\n      input.knowledgeIds = locked.knowledgeIds;\n      input.facts = locked.facts;\n      input.sourceSnapshot = locked.sourceSnapshot;\n      input.voiceNotes = undefined;\n      input.allowQualityFallback = false;\n      input.status = "DRAFT";\n    }'''
          if new_block not in source:
              if old_block not in source: raise SystemExit("inline friend request block missing")
              source = source.replace(old_block, new_block, 1)
          path.write_text(source)

          # DRAFT is audit storage, but this one on-demand product still needs the immediate generated payload in memory.
          path = Path("apps/web/src/services/userGeneratedContent.ts")
          source = path.read_text()
          old = '''  if (saved) {\n    return saved.status === "LIVE" ? fromRow(saved) : null;\n  }\n\n  return payload?.generated ?? null;'''
          new = '''  if (saved) {\n    if (saved.status === "LIVE") return fromRow(saved);\n    if (request.subjectType === "friend_transit_reading") return payload?.generated ?? null;\n    return null;\n  }\n\n  return payload?.generated ?? null;'''
          if new not in source:
              if old not in source: raise SystemExit("DRAFT return anchor missing")
              source = source.replace(old, new, 1)
          path.write_text(source)

          # A response belongs to the friend/date selection that started it, even if navigation changes while it is in flight.
          path = Path("apps/web/src/features/friends/ManualChartsPanel.tsx")
          source = path.read_text()
          old_selected = '''  const selectedChart = allFriendCharts.find((chart) => chart.id === selectedChartId) ?? null;\n  const selectedFriendNatalChartComplete = selectedChart'''
          new_selected = '''  const selectedChart = allFriendCharts.find((chart) => chart.id === selectedChartId) ?? null;\n  const friendTransitReadingSelectionKey = `${selectedChart?.id ?? ""}|${currentSky?.generatedAt.slice(0, 10) ?? ""}`;\n  const friendTransitReadingSelectionKeyRef = useRef(friendTransitReadingSelectionKey);\n  friendTransitReadingSelectionKeyRef.current = friendTransitReadingSelectionKey;\n  const selectedFriendNatalChartComplete = selectedChart'''
          if new_selected not in source:
              if old_selected not in source: raise SystemExit("selection key anchor missing")
              source = source.replace(old_selected, new_selected, 1)
          source = source.replace(
              '  }, [selectedChart?.id, selectedFriendTransitReadingDate]);',
              '  }, [friendTransitReadingSelectionKey]);'
          fn_old = '''  async function generateSelectedFriendTransitReading() {\n    if (!selectedChart || !selectedFriendTransitReadingDate || !selectedFriendTransitReadingAvailable) return;\n    setFriendTransitReadingStatus("loading");'''
          fn_new = '''  async function generateSelectedFriendTransitReading() {\n    if (!selectedChart || !selectedFriendTransitReadingDate || !selectedFriendTransitReadingAvailable) return;\n    const requestSelectionKey = friendTransitReadingSelectionKey;\n    setFriendTransitReadingStatus("loading");'''
          if fn_new not in source:
              if fn_old not in source: raise SystemExit("generation function anchor missing")
              source = source.replace(fn_old, fn_new, 1)
          response_old = '''      if (!generated) throw new Error("The short reading was not returned.");\n      setFriendTransitReading(generated);\n      setFriendTransitReadingStatus("ready");\n    } catch (error) {\n      setFriendTransitReading(null);'''
          response_new = '''      if (friendTransitReadingSelectionKeyRef.current !== requestSelectionKey) return;\n      if (!generated) throw new Error("The short reading was not returned.");\n      setFriendTransitReading(generated);\n      setFriendTransitReadingStatus("ready");\n    } catch (error) {\n      if (friendTransitReadingSelectionKeyRef.current !== requestSelectionKey) return;\n      setFriendTransitReading(null);'''
          if response_new not in source:
              if response_old not in source: raise SystemExit("stale response anchor missing")
              source = source.replace(response_old, response_new, 1)
          path.write_text(source)

          # Add request lock checks to the core contract fixture.
          path = Path("scripts/test-friend-transit-reading-contract.mts")
          source = path.read_text()
          source = source.replace(
              '  friendTransitReadingPrompt,\n  validateFriendTransitReadingDraft',
              '  friendTransitReadingPrompt,\n  friendTransitReadingRequestLock,\n  validateFriendTransitReadingDraft'
          )
          insert_anchor = '''assert.equal(friendTransitReadingCanGenerate(brief), true);\nassert.deepEqual(friendTransitReadingKnowledgeIds(brief), ['''
          insert_new = '''assert.equal(friendTransitReadingCanGenerate(brief), true);\nconst lockedRequest = friendTransitReadingRequestLock({ brief: rawBrief, subjectId: "friend-123", targetDate: "2026-09-06" });\nassert.equal(lockedRequest.contentKey, "friend-transit-reading/friend-123/2026-09-06");\nassert.equal(lockedRequest.surface, "friends");\nassert.equal(lockedRequest.mode, "in_depth");\nassert.equal(lockedRequest.eventType, "friend-transit-reading");\nassert.equal(lockedRequest.headline, "What's going on with Alex right now?");\nassert.deepEqual(lockedRequest.knowledgeIds, ["you-transit-v3-mars-trine-moon", "you-transit-v3-pluto-square-sun", "house-2"]);\nassert.throws(() => friendTransitReadingRequestLock({ brief: rawBrief, subjectId: "friend-123", targetDate: "Sep 6" }), /TARGET_DATE_REQUIRED/u);\nassert.throws(() => assertFriendTransitReadingBrief({\n  ...rawBrief,\n  primaryThemes: [{ ...rawBrief.primaryThemes[0], evidence: { ...rawBrief.primaryThemes[0].evidence, contentKeys: [] } }]\n}), /PERSONAL_EVIDENCE_INVALID/u);\nassert.deepEqual(friendTransitReadingKnowledgeIds(brief), ['''
          if insert_new not in source:
              if insert_anchor not in source: raise SystemExit("contract lock insert anchor missing")
              source = source.replace(insert_anchor, insert_new, 1)
          path.write_text(source)
          PY

          cat > scripts/test-friend-transit-reading-request-render.mjs <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import React from "react";
          import { renderToStaticMarkup } from "react-dom/server";
          import { createServer } from "vite";

          const panelSource = fs.readFileSync("apps/web/src/features/friends/ManualChartsPanel.tsx", "utf8");
          const serviceSource = fs.readFileSync("apps/web/src/services/userGeneratedContent.ts", "utf8");
          const apiSource = fs.readFileSync("api/generate-user-content.ts", "utf8");
          assert.match(panelSource, /friendTransitReadingSelectionKeyRef\.current = friendTransitReadingSelectionKey/u);
          assert.match(panelSource, /friendTransitReadingSelectionKeyRef\.current !== requestSelectionKey/u);
          assert.match(serviceSource, /request\.subjectType === "friend_transit_reading"\) return payload\?\.generated/u);
          assert.match(apiSource, /friendTransitReadingRequestLock\(\{/u);
          assert.match(apiSource, /input\.status = "DRAFT"/u);
          assert.match(apiSource, /input\.allowQualityFallback = false/u);

          const server = await createServer({ root: "./apps/web", configFile: false, optimizeDeps: { noDiscovery: true }, server: { middlewareMode: true }, appType: "custom", logLevel: "silent" });
          try {
            const { FriendTransitsTab } = await server.ssrLoadModule("/src/features/friends/FriendTransitsTab.tsx");
            const { buildFriendTransitsBrief } = await server.ssrLoadModule("/src/features/friends/friendTransitsBrief.ts");
            const brief = buildFriendTransitsBrief({
              friendName: "Alex",
              dateLabel: "Today",
              personalTransitGroups: [{ key: "short", label: "Short-term themes", transits: [{
                id: "mars-moon", title: "Mars trine Moon", durationLabel: "A few days", rangeLabel: "Sep 5-8", timingLabel: "Active now",
                summary: "Alex can act on what they feel with less friction.", orb: "1°", detailAvailable: true,
                evidence: { transitPlanet: "Mars", transitSign: "Aries", aspect: "trine", natalPoint: "Moon", natalSign: "Sagittarius", natalHouse: 7, direction: "applying", score: 80, significance: "major", timingBonuses: [], contentKeys: ["authored/transit-aspect/mars/moon/soft"] }
              }] }],
              bondTransits: [], houseTransits: [], dailyForecast: null, dailyDoItems: [], dailyDontItems: [], patternItems: []
            });
            const baseProps = { brief, readingAvailable: true, onGenerateReading() {}, onOpenBondTransit() {}, onOpenHouseTransit() {}, onOpenPersonalTransit() {}, patternTimingOverrides: {} };
            const idle = renderToStaticMarkup(React.createElement(FriendTransitsTab, baseProps));
            assert.match(idle, /What&#x27;s going on with Alex right now\?/u);
            assert.match(idle, /Give me the short version/u);
            const loading = renderToStaticMarkup(React.createElement(FriendTransitsTab, { ...baseProps, readingStatus: "loading" }));
            assert.match(loading, /Putting Alex&#x27;s current transits together/u);
            const ready = renderToStaticMarkup(React.createElement(FriendTransitsTab, { ...baseProps, readingStatus: "ready", reading: {
              headline: "What's going on with Alex right now?", summary: "Alex has more room to move with what they already know today.", body: "Alex can act on what they feel with less friction.\n\nThe transit cards below remain the source of truth."
            } }));
            assert.match(ready, /Alex has more room to move/u);
            assert.match(ready, /The transit cards below remain the source of truth/u);
            assert.doesNotMatch(ready, /Give me the short version/u);
            const error = renderToStaticMarkup(React.createElement(FriendTransitsTab, { ...baseProps, readingStatus: "error", readingError: "Generation failed safely." }));
            assert.match(error, /Generation failed safely/u);
            assert.match(error, /Try again/u);
            const unavailable = renderToStaticMarkup(React.createElement(FriendTransitsTab, { ...baseProps, readingAvailable: false }));
            assert.doesNotMatch(unavailable, /Give me the short version/u);
          } finally {
            await server.close();
          }
          console.log("Friend transit reading request/render regression passed.");
          EOF
      - name: Verify safety boundary
        run: |
          if git diff --name-only ${{ github.event.before }} HEAD | grep -qx 'apps/web/src/App.tsx'; then
            echo 'App.tsx must remain untouched.' >&2
            exit 1
          fi
          test ! -e apps/web/src/features/friends/friendHouseTransitPriority.ts
      - run: npm ci
      - name: Contract
        run: node --experimental-strip-types scripts/test-friend-transit-reading-contract.mts
      - name: Request/render regression
        run: node scripts/test-friend-transit-reading-request-render.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build knowledge
        run: npm run build:knowledge
      - name: Build web
        run: npm run build:web
      - name: Commit hardening
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/friend-transit-reading.ts api/generate-user-content.ts apps/web/src/services/userGeneratedContent.ts apps/web/src/features/friends/ManualChartsPanel.tsx scripts/test-friend-transit-reading-contract.mts scripts/test-friend-transit-reading-request-render.mjs
          git commit -m "Harden Friends transit reading request flow"
          git push origin HEAD:chatgpt/friend-transit-reading-v1-20260906

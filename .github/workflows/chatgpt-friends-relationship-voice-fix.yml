name: ChatGPT Friends Relationship Voice Fix

on:
  push:
    branches:
      - chatgpt/friends-reading-relationship-voice-fix-20260906

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/friends-reading-relationship-voice-fix-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply relationship voice contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('api/_lib/friend-transit-reading.ts')
          source = path.read_text()
          source = source.replace(
              'export const FRIEND_TRANSIT_READING_PROMPT_VERSION = "friend-transit-reading-v1";',
              'export const FRIEND_TRANSIT_READING_PROMPT_VERSION = "friend-transit-reading-v1.1";',
              1
          )
          old = '    `Write about ${brief.friendName} in third person using their name and they/them/their. Never address the reader as you/your.`,\n'
          new = (
              '    `Write ${brief.friendName}\\\'s personal astrology in third person using their name and they/them/their.`,\n'
              '    `When using Between You Two relationship context, address the reader directly and prefer the bridge: "Things between you and ${brief.friendName}..." Do not use you/your outside relationship context.`,\n'
          )
          if old not in source:
              raise SystemExit('Prompt register line not found')
          source = source.replace(old, ''.join(new), 1)
          old_priority = '    "Between You Two is relationship context and must remain distinct.",\n'
          new_priority = (
              '    "Between You Two is relationship context and must remain distinct.",\n'
              '    `If relationship context is used, speak to the reader naturally as "Things between you and ${brief.friendName}..." rather than referring to both people as "the two of them."`,\n'
          )
          if old_priority not in source:
              raise SystemExit('Relationship priority line not found')
          source = source.replace(old_priority, ''.join(new_priority), 1)

          anchor = 'export function validateFriendTransitReadingDraft(input: { draft: FriendTransitReadingDraft; brief: FriendTransitReadingBrief; expectedHeadline: string }) {\n'
          helper = '''function relationshipSecondPersonAllowed(text: string, matchIndex: number, brief: FriendTransitReadingBrief) {\n  if (brief.relationshipActivations.length === 0 || matchIndex < 0) return false;\n  const starts = [\n    text.lastIndexOf(".", matchIndex),\n    text.lastIndexOf("!", matchIndex),\n    text.lastIndexOf("?", matchIndex),\n    text.lastIndexOf("\\n", matchIndex)\n  ];\n  const start = Math.max(...starts) + 1;\n  const endings = [\n    text.indexOf(".", matchIndex),\n    text.indexOf("!", matchIndex),\n    text.indexOf("?", matchIndex),\n    text.indexOf("\\n", matchIndex)\n  ].filter((value) => value >= 0);\n  const end = endings.length > 0 ? Math.min(...endings) : text.length;\n  const sentence = text.slice(start, end);\n  const friendNamePattern = new RegExp(`\\\\b${escapeRegex(brief.friendName)}\\\\b`, "iu");\n  return friendNamePattern.test(sentence)\n    && /\\b(?:between|connection|relationship)\\b/iu.test(sentence);\n}\n\n'''
          if helper not in source:
              if anchor not in source:
                  raise SystemExit('Validator anchor not found')
              source = source.replace(anchor, helper + anchor, 1)
          old_loop = '''  for (const match of text.matchAll(/\\b(?:you|your|yours|yourself|yourselves)\\b/giu)) {\n    issues.push({ code: "second_person", value: match[0], message: "Friend transit reading addressed the reader instead of describing the friend." });\n  }\n'''
          new_loop = '''  for (const match of text.matchAll(/\\b(?:you|your|yours|yourself|yourselves)\\b/giu)) {\n    if (!relationshipSecondPersonAllowed(text, match.index ?? -1, input.brief)) {\n      issues.push({ code: "second_person", value: match[0], message: "Friend transit reading used second person outside explicit relationship context." });\n    }\n  }\n'''
          if old_loop not in source:
              raise SystemExit('Second-person validator loop not found')
          source = source.replace(old_loop, new_loop, 1)
          path.write_text(source)

          path = Path('src/astro-writing/validateCopy.mjs')
          source = path.read_text()
          old = '  if (register === "third_person" && /\\b(?:you|your|yours|yourself|yourselves)\\b/iu.test(text)) {\n'
          new = '  if (register === "third_person" && family !== "friend-transit-reading" && /\\b(?:you|your|yours|yourself|yourselves)\\b/iu.test(text)) {\n'
          if old not in source:
              raise SystemExit('Third-person register guard not found')
          source = source.replace(old, new, 1)
          path.write_text(source)

          path = Path('scripts/test-friend-transit-reading-contract.mts')
          source = path.read_text()
          source = source.replace(
              'assert.match(prompt, /Never address the reader as you\\/your/i);',
              'assert.match(prompt, /Things between you and \\${brief\\.friendName}|Things between you and Alex/i);\nassert.match(prompt, /Do not use you\\/your outside relationship context/i);',
              1
          )
          old_body = '    body: "Alex can name what needs attention today without making every reaction bigger than it is. Mars trine Moon supports that quicker emotional follow-through, while the relationship context still calls for patience rather than an immediate answer.\\n\\nUnderneath that, Pluto square Sun is a slower pressure cycle. Money and what Alex can rely on also need more deliberate structure while Saturn moves through the 2nd house. The immediate shift and the longer background are different stories, but both point toward handling what is actually changing instead of forcing the old plan to keep working.",\n'
          new_body = '    body: "Alex can name what needs attention today without making every reaction bigger than it is. Mars trine Moon supports that quicker emotional follow-through. Things between you and Alex may need a little more patience right now, which is separate from what Alex is dealing with personally.\\n\\nUnderneath that, Pluto square Sun is a slower pressure cycle. Money and what Alex can rely on also need more deliberate structure while Saturn moves through the 2nd house. The immediate shift and the longer background are different stories, but both point toward handling what is actually changing instead of forcing the old plan to keep working.",\n'
          if old_body not in source:
              raise SystemExit('Valid fixture body not found')
          source = source.replace(old_body, new_body, 1)
          path.write_text(source)
          PY
      - name: Verify diff scope
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          allowed='^(api/_lib/friend-transit-reading\.ts|src/astro-writing/validateCopy\.mjs|scripts/test-friend-transit-reading-contract\.mts)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected changed files:" >&2
            echo "$bad" >&2
            exit 1
          fi
      - run: npm ci
      - run: node --experimental-strip-types scripts/test-friend-transit-reading-contract.mts
      - run: node scripts/test-friend-transit-reading-request-render.mjs
      - run: node --import tsx scripts/test-friend-natal-chart-completeness.mjs
      - run: node --test tests/astro-writing/writing-kernel.test.mjs
      - run: npm run typecheck
      - run: npm run build:knowledge
      - run: npm run build:web
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/friend-transit-reading.ts src/astro-writing/validateCopy.mjs scripts/test-friend-transit-reading-contract.mts
          git commit -m "Fix Friends relationship synthesis voice"
          git push origin HEAD:chatgpt/friends-reading-relationship-voice-fix-20260906

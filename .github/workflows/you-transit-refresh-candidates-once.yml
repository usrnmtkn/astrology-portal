name: You transit refresh candidates

on:
  push:
    branches:
      - chatgpt/refresh-you-personal-transit-corpus

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build You refresh candidates
        run: node scripts/build-you-transit-refresh-candidates.mjs --write
      - name: Print ambiguity review
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const review = JSON.parse(fs.readFileSync('packages/astro-knowledge/review/transit-aspect-you-refresh-review-2026-09-04.json', 'utf8'));
          console.log(`BROAD_COREFERENCE_CANDIDATES=${review.broadCoreferenceCandidateCount}`);
          console.log(`THIRD_PARTY_PROTECTIONS=${review.thirdPartyProtectionHitCount}`);
          console.log(`UNRESOLVED=${review.unresolvedCount}`);
          for (const item of review.ambiguityReview) {
            if (item.thirdPartyProtectionHits.length > 0) {
              console.log(`PROTECTED\t${item.contentKey}\t${item.thirdPartyProtectionHits.map((hit) => `${hit.id}:${hit.count}`).join(',')}`);
            }
          }
          if (review.unresolvedCount !== 0) process.exit(1);
          NODE
      - name: Commit generated review packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/astro-knowledge/review/transit-aspect-you-refresh-candidates-2026-09-04.json \
                  packages/astro-knowledge/review/transit-aspect-you-refresh-review-2026-09-04.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate You Personal Transit refresh candidates"
          git push origin HEAD:chatgpt/refresh-you-personal-transit-corpus

name: One-time Studio AI writer style migration

on:
  push:
    branches:
      - chatgpt/admin-design-system-audit-phase2-final-20260916
    paths:
      - ".github/workflows/studio-ai-writer-style-migration-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/admin-design-system-audit-phase2-final-20260916
      - name: Move compact AI writer sizing into the Studio design system
        run: |
          python - <<'PY'
          from pathlib import Path

          theme_path = Path('apps/admin/src/admin-theme.css')
          theme = theme_path.read_text()
          marker = '  --studio-textarea-height: 160px;\n'
          addition = marker + '  --studio-compact-textarea-height: 96px;\n'
          if theme.count(marker) != 1 or '--studio-compact-textarea-height:' in theme:
              raise SystemExit('Unexpected admin-theme compact textarea state')
          theme_path.write_text(theme.replace(marker, addition, 1))

          css_path = Path('apps/admin/src/studio-system.css')
          css = css_path.read_text()
          marker = '#root .admin-dashboard textarea { min-height: var(--studio-textarea-height); resize: vertical; }\n'
          addition = marker + '#root .admin-dashboard .admin-ai-writing-instruction { min-height: var(--studio-compact-textarea-height); }\n'
          if css.count(marker) != 1 or '.admin-ai-writing-instruction {' in css:
              raise SystemExit('Unexpected Studio compact textarea rule state')
          css_path.write_text(css.replace(marker, addition, 1))

          ui_path = Path('apps/admin/src/SkyArticleAiWriter.tsx')
          ui = ui_path.read_text()
          marker = '        rows={4}\n        placeholder="Keep the opening, make the middle more concrete, and preserve the evergreen meaning."\n'
          addition = '        rows={4}\n        className="admin-ai-writing-instruction"\n        placeholder="Keep the opening, make the middle more concrete, and preserve the evergreen meaning."\n'
          if ui.count(marker) != 1 or 'className="admin-ai-writing-instruction"' in ui:
              raise SystemExit('Unexpected AI writer class state')
          ui_path.write_text(ui.replace(marker, addition, 1))

          test_path = Path('scripts/test-studio-article-writer.mjs')
          test = test_path.read_text()
          read_marker = " const endpoint=fs.readFileSync(new URL('../api/admin/sky-article-writing.ts',import.meta.url),'utf8');\n"
          read_addition = read_marker + " const studioCss=fs.readFileSync(new URL('../apps/admin/src/studio-system.css',import.meta.url),'utf8');\n const studioTheme=fs.readFileSync(new URL('../apps/admin/src/admin-theme.css',import.meta.url),'utf8');\n"
          assert_marker = " assert.match(ui,/rows=\\{4\\}[\\s\\S]{0,120}minHeight: 96/u,'AI direction field must stay compact enough to keep the generate action visible.');\n"
          assert_addition = " assert.match(ui,/rows=\\{4\\}[\\s\\S]{0,120}className=\"admin-ai-writing-instruction\"/u,'AI direction field must use the canonical compact textarea class.');\n assert.match(studioCss,/\\.admin-ai-writing-instruction\\s*\\{[^}]*min-height:\\s*var\\(--studio-compact-textarea-height\\)/u,'AI direction field compact sizing must live in Studio CSS.');\n assert.match(studioTheme,/--studio-compact-textarea-height:\\s*96px/u,'AI direction field must preserve the approved 96px compact height token.');\n"
          if test.count(read_marker) != 1 or test.count(assert_marker) != 1:
              raise SystemExit('Unexpected article writer regression-test state')
          test = test.replace(read_marker, read_addition, 1).replace(assert_marker, assert_addition, 1)
          test_path.write_text(test)
          PY
      - name: Commit the migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/admin-theme.css apps/admin/src/studio-system.css apps/admin/src/SkyArticleAiWriter.tsx scripts/test-studio-article-writer.mjs
          git diff --cached --check
          git commit -m "Move AI writer compact sizing into Studio CSS"
          git push origin HEAD:chatgpt/admin-design-system-audit-phase2-final-20260916

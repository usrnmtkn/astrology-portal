name: Finalize required vs optional editorial backlog

on:
  push:
    branches:
      - chatgpt/required-vs-optional-editorial-backlog

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply zero-required backlog classification
        run: python3 scripts/temp-finalize-zero-required-backlog.py
      - name: Rebuild unresolved artifacts
        run: |
          node scripts/build-content-unresolved-queue.mjs
          node scripts/build-content-unresolved-dashboard.mjs
      - name: Verify classification contracts
        run: |
          node scripts/test-content-unresolved-actionable-queue.mjs
          node scripts/build-content-unresolved-queue.mjs --check
          node scripts/build-content-unresolved-dashboard.mjs --check
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify TypeScript and Content Studio build
        run: |
          npm run typecheck
          npm run build:admin
      - name: Commit zero-required backlog model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/build-content-unresolved-queue.mjs \
            scripts/test-content-unresolved-actionable-queue.mjs \
            config/content-unresolved-retirements-v1.json \
            api/admin/content-coverage.ts \
            apps/admin/src/ContentCoverageDashboard.tsx \
            docs/content-management/GOVERNED-APPROVALS.md \
            docs/content-management/README.md \
            packages/astro-knowledge/generated/content-unresolved-queue-v1.json \
            packages/astro-knowledge/generated/content-unresolved-dashboard-v1.html
          git commit -m "fix(content): separate optional enrichment from required backlog"
          git push origin HEAD:chatgpt/required-vs-optional-editorial-backlog

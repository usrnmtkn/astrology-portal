name: Patch Friends bridge variables

on:
  push:
    branches:
      - chatgpt/friends-transits-complete-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/friends-transits-complete-v1
      - name: Patch bridge variants
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/build-friends-transit-completion-v1.yml')
          s = p.read_text()
          replacements = {
            '"As this contact with their %TARGET% continues through {{untilDate}}, {{Name}} %ACTION%.",': '"As %PLANET% {{aspectWord}} their %TARGET% continues through {{untilDate}}, {{Name}} %ACTION%.",',
            '"%PLANET% stays in contact with their %TARGET% through {{untilDate}}. {{Name}} %ACTION%."': '"%PLANET% {{aspectWord}} their %TARGET% stays active through {{untilDate}}. {{Name}} %ACTION%."'
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing bridge variant: {old}')
            s = s.replace(old, new)
          p.write_text(s)
      - name: Commit patch and remove helper
        run: |
          rm -f .github/workflows/patch-friends-bridge-variables.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: keep aspect variable in all Friends bridges"
          git push origin HEAD:chatgpt/friends-transits-complete-v1

name: Release 351 Friends transits owner live v1

on:
  push:
    branches:
      - chatgpt/friends-transit-351-owner-live-v1

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/friends-transit-351-owner-live-v1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/tldrastro-api/pyproject.toml
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned API dependencies
        working-directory: services/tldrastro-api
        run: python -m pip install -e ".[dev]"
      - name: Apply exact owner-approved 351-row Friends release
        run: node scripts/promote-friends-transit-completion-v1.mjs --apply
      - name: Wire permanent Friends release contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const sunPath = 'scripts/test-sun-friends-serving-v1.mjs';
          let sun = fs.readFileSync(sunPath, 'utf8');
          const oldGuard = 'assert.equal(otherExplicit.length, 0, "Sun release must not silently populate other transit families.");';
          const newGuard = 'assert.equal(otherExplicit.length, 351, "The separately owner-approved non-Sun Friends release must populate exactly 351 additional transit rows.");';
          if (sun.includes(oldGuard)) sun = sun.replace(oldGuard, newGuard);
          else if (!sun.includes(newGuard)) throw new Error('Sun Friends non-Sun guard not found.');
          fs.writeFileSync(sunPath, sun);

          const packagePath = 'package.json';
          let pkg = fs.readFileSync(packagePath, 'utf8');
          const existing = 'node --experimental-strip-types scripts/test-friends-transit-eligible-cap.mts && node --import tsx scripts/test-friends-transit-detail-provenance-gate.mjs && ';
          const wired = 'node --experimental-strip-types scripts/test-friends-transit-eligible-cap.mts && node scripts/test-friends-transit-nonsun-serving-v1.mjs && node --import tsx scripts/test-friends-transit-detail-provenance-gate.mjs && ';
          if (pkg.includes(existing)) pkg = pkg.replace(existing, wired);
          else if (!pkg.includes(wired)) throw new Error('Could not locate Friends test:content wiring point.');
          fs.writeFileSync(packagePath, pkg);
          NODE
      - name: Rebuild fallback browser resolver
        run: npx esbuild apps/web/src/content/fallbackArchitectureV3/resolver/index.browser.ts --bundle --format=esm --outfile=apps/web/src/content/fallbackArchitectureV3/dist/tldr-content.js
      - name: Regenerate governed fallback artifacts
        run: |
          node scripts/generate-fallback-package-manifest.mjs
          node scripts/build-canonical-content-hub.mjs --write
          node scripts/build-knowledge-index.mjs --write
          node scripts/build-phrase-index.mjs --write
          node scripts/build-production-sky-kernel-comparison.mjs --write
          node scripts/build-content-inventory.mjs --source-commit=${GITHUB_SHA}
          node scripts/build-content-export.mjs
          npm run build:writing-harness
      - name: Run focused 351-row Friends serving gates
        run: |
          node scripts/promote-friends-transit-completion-v1.mjs
          node scripts/test-friends-transit-completion-v1.mjs
          node scripts/test-friends-transit-nonsun-serving-v1.mjs
          node scripts/test-sun-friends-serving-v1.mjs
          node --experimental-strip-types scripts/test-transit-friend-pronoun-grammar.mjs
          node --import tsx scripts/test-friends-transit-detail-provenance-gate.mjs
          node scripts/test-fallback-refresh-wiring.mjs
          node scripts/test-fallback-package-cache-contract.mjs
          node scripts/test-content-inventory-export.mjs
          node scripts/generate-fallback-package-manifest.mjs --check
          node scripts/build-knowledge-index.mjs --check
          node scripts/build-phrase-index.mjs --check
          git diff --check
      - name: Run repository typecheck
        run: npm run typecheck
      - name: Run full content gate
        run: npm run test:content
      - name: Build web application
        run: npm run build:web
      - name: Review controlled release diff
        run: |
          git status --short
          git diff --stat
          git diff --check
      - name: Commit controlled 351-row Friends release
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No release changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release(friends): serve 351 owner-approved transit rewrites"
          git push origin HEAD:chatgpt/friends-transit-351-owner-live-v1

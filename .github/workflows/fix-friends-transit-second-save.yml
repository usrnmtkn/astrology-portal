name: Repair Friends transit second save

on:
  push:
    branches:
      - chatgpt/fix-friends-transit-second-save

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-friends-transit-second-save
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped repair
        run: node scripts/apply-friends-transit-second-save-fix.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run Content Studio API roundtrip regression
        run: node scripts/test-content-studio-api-roundtrip.mjs
      - name: Verify diff
        run: git diff --check
      - name: Commit repair and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-friends-transit-second-save.yml scripts/apply-friends-transit-second-save-fix.mjs
          git add api/admin/generated-content.ts scripts/test-content-studio-api-roundtrip.mjs
          git commit -m "fix(content): allow Friends transit revision placeholders"
          git push origin HEAD:chatgpt/fix-friends-transit-second-save

name: Temporary Sky residency bundle trim

on:
  push:
    branches:
      - fix/sky-residency-visual-smoke-20260906

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/sky-residency-visual-smoke-20260906
      - name: Simplify residency merge path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          detail_path = Path('apps/web/src/features/sky/SkyDetailArticle.tsx')
          detail = detail_path.read_text()
          start_marker = '  const existingDetailSections = detail.sections ?? [];\n'
          end_marker = '  const metaRows = detailMetaRows(detail.meta);\n'
          start = detail.find(start_marker)
          end = detail.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('SkyDetailArticle trim target not found')
          replacement = '''  const existingDetailSections = detail.sections ?? [];
          const detailSections = residencyContext && residencyAspectSections
            ? [
                ...existingDetailSections.filter((section) => section.role !== "aspect"),
                ...residencyAspectSections,
                ...existingDetailSections.filter((section) => (
                  section.role === "aspect"
                  && !residencyAspectSections.some((candidate) => candidate.heading === section.heading)
                ))
              ]
            : existingDetailSections;
          '''
          detail_path.write_text(detail[:start] + replacement + detail[end:])

          test_path = Path('scripts/test-sky-placement-residency-aspects.mts')
          test = test_path.read_text()
          start_marker = '  assert.match(detailSource, /skyPlacementResidencyAspectSections/u);\n'
          end_marker = '  assert.doesNotMatch(\n'
          start = test.find(start_marker)
          end = test.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Residency regression trim target not found')
          replacement = '''  assert.match(detailSource, /skyPlacementResidencyAspectSections/u);
          assert.match(
            detailSource,
            /residencyContext && residencyAspectSections[\\s\\S]*?residencyAspectSections\\.some/u,
            "Residency enrichment must keep existing exact aspect content visible while loading and preserve unmatched approved aspects afterward."
          );
          '''
          test_path.write_text(test[:start] + replacement + test[end:])
          PY

          git diff --check
      - name: Commit trim and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-sky-residency-bundle-trim.yml
          git add apps/web/src/features/sky/SkyDetailArticle.tsx scripts/test-sky-placement-residency-aspects.mts
          git commit -m "Trim Sky residency aspect merge path"
          git push origin HEAD:fix/sky-residency-visual-smoke-20260906

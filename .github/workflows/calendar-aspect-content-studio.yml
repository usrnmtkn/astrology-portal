name: Calendar aspect Content Studio

on:
  pull_request:
    paths:
      - "apps/web/src/content/fallbackArchitectureV3/admin/WRITING-STYLE-GUIDE.md"
      - "apps/web/src/content/fallbackArchitectureV3/contracts/CONTENT-ROLE-CONTRACT.json"
      - "apps/web/src/content/fallbackArchitectureV3/authored-inputs/calendar-aspect-consequence-first-drafts-v1.json"
      - "apps/web/src/content/fallbackArchitectureV3/resolver/calendarAspectContentStudio.mjs"
      - "apps/web/src/services/skyAspectContent.ts"
      - "api/admin/sky-v4-preview.ts"
      - "apps/admin/src/GeneratedContentAdminDashboard.tsx"
      - "scripts/stage-calendar-aspect-content-studio-drafts.mjs"
      - "scripts/test-calendar-aspect-content-studio-drafts.mjs"
      - "scripts/seed-published-calendar-aspect-content-studio.mjs"
      - "scripts/test-published-calendar-aspect-content-studio.mjs"
      - "tests/visual/content-dashboard-admin-user-flows.spec.ts"
      - "packages/astro-knowledge/data/transits/**"
      - "packages/astro-knowledge/data/sky-calendar/composed-cards-v1.json"
      - "apps/web/src/content/fallbackArchitectureV3/source-rows/sky-aspect-phrasebook-v1.json"
      - "packages/astro-knowledge/review/sky-calendar-composed-first-glance-2026-08-31/**"
      - ".github/workflows/calendar-aspect-content-studio.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/src/content/fallbackArchitectureV3/authored-inputs/calendar-aspect-consequence-first-drafts-v1.json"
      - "apps/web/src/content/fallbackArchitectureV3/resolver/calendarAspectContentStudio.mjs"
      - "apps/web/src/services/skyAspectContent.ts"
      - "api/admin/sky-v4-preview.ts"
      - "apps/admin/src/GeneratedContentAdminDashboard.tsx"
      - "scripts/stage-calendar-aspect-content-studio-drafts.mjs"
      - "scripts/test-calendar-aspect-content-studio-drafts.mjs"
      - "scripts/seed-published-calendar-aspect-content-studio.mjs"
      - "scripts/test-published-calendar-aspect-content-studio.mjs"
      - "tests/visual/content-dashboard-admin-user-flows.spec.ts"
      - "packages/astro-knowledge/data/transits/**"
      - ".github/workflows/calendar-aspect-content-studio.yml"
  workflow_dispatch:
    inputs:
      seed_content_studio:
        description: "Seed the 24 composed-card rewrites as non-serving Content Studio drafts"
        required: true
        default: false
        type: boolean
      sync_published_exact_aspects:
        description: "Mirror all LIVE exact Sky Calendar aspects, including pole-specific South Node copy, into Content Studio and verify the remote set"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  calendar-aspect-content-studio:
    name: calendar-aspect-content-studio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify consequence-first draft package
        run: node scripts/test-calendar-aspect-content-studio-drafts.mjs
      - name: Materialize safe Content Studio rows
        run: node scripts/stage-calendar-aspect-content-studio-drafts.mjs --out=/tmp/calendar-aspect-content-studio-drafts.json
      - name: Verify published exact-aspect Content Studio contract
        run: |
          node scripts/test-published-calendar-aspect-content-studio.mjs
          node scripts/seed-published-calendar-aspect-content-studio.mjs

  seed-content-studio:
    if: github.event_name == 'workflow_dispatch' && inputs.seed_content_studio
    needs: calendar-aspect-content-studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Seed composed-card drafts into Content Studio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not configured for this repository."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] && [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Neither SUPABASE_URL nor VITE_SUPABASE_URL is configured for this repository."
            exit 1
          fi
          node scripts/stage-calendar-aspect-content-studio-drafts.mjs --apply --verify-remote --out=/tmp/calendar-aspect-content-studio-drafts.json

  sync-published-exact-aspects:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sync_published_exact_aspects)
    needs: calendar-aspect-content-studio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Mirror or verify published exact aspects in Content Studio
        env:
          SUPABASE_URL: https://hdmdufozrgrajkfhydit.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_iX90KdzcQzw8a8OydBHHXA_COnEMcns
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/test-published-calendar-aspect-content-studio.mjs
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Service-role credentials are available; applying and verifying the governed exact-aspect mirror."
            node scripts/seed-published-calendar-aspect-content-studio.mjs --apply --verify-remote
          else
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not available to GitHub Actions. Skipping the write and performing read-only byte-for-byte verification of the existing 439-row Content Studio mirror."
            node scripts/seed-published-calendar-aspect-content-studio.mjs --verify-remote
          fi

name: Calendar aspect Content Studio

on:
  pull_request:
    paths:
      - "apps/web/src/content/fallbackArchitectureV3/admin/WRITING-STYLE-GUIDE.md"
      - "apps/web/src/content/fallbackArchitectureV3/contracts/CONTENT-ROLE-CONTRACT.json"
      - "apps/web/src/content/fallbackArchitectureV3/authored-inputs/calendar-aspect-consequence-first-drafts-v1.json"
      - "apps/web/src/content/fallbackArchitectureV3/resolver/calendarAspectContentStudio.mjs"
      - "api/admin/sky-v4-preview.ts"
      - "scripts/stage-calendar-aspect-content-studio-drafts.mjs"
      - "scripts/test-calendar-aspect-content-studio-drafts.mjs"
      - "packages/astro-knowledge/data/sky-calendar/composed-cards-v1.json"
      - "apps/web/src/content/fallbackArchitectureV3/source-rows/sky-aspect-phrasebook-v1.json"
      - "packages/astro-knowledge/review/calendar-consequence-first-content-studio-2026-09-01/**"
      - ".github/workflows/calendar-aspect-content-studio.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/src/content/fallbackArchitectureV3/authored-inputs/calendar-aspect-consequence-first-drafts-v1.json"
      - "apps/web/src/content/fallbackArchitectureV3/resolver/calendarAspectContentStudio.mjs"
      - "api/admin/sky-v4-preview.ts"
      - "scripts/stage-calendar-aspect-content-studio-drafts.mjs"
      - "scripts/test-calendar-aspect-content-studio-drafts.mjs"
      - ".github/workflows/calendar-aspect-content-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-aspect-content-studio:
    name: calendar-aspect-content-studio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify consequence-first draft package
        run: node scripts/test-calendar-aspect-content-studio-drafts.mjs
      - name: Materialize safe Content Studio rows
        run: node scripts/stage-calendar-aspect-content-studio-drafts.mjs --out=/tmp/calendar-aspect-content-studio-drafts.json

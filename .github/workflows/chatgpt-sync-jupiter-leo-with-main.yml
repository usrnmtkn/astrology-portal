name: Sync Jupiter Leo promotion with current main

on:
  push:
    branches:
      - chatgpt/jupiter-leo-12-owner-approved-current-main
    paths:
      - .github/workflows/chatgpt-sync-jupiter-leo-with-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out promotion branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/jupiter-leo-12-owner-approved-current-main
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Remove temporary workflow and push
        run: |
          rm .github/workflows/chatgpt-sync-jupiter-leo-with-main.yml
          git add .github/workflows/chatgpt-sync-jupiter-leo-with-main.yml
          git commit --amend --no-edit
          git push origin HEAD:chatgpt/jupiter-leo-12-owner-approved-current-main

name: Memory graph browser contract

on:
  pull_request:
    paths:
      - '.github/workflows/memory-graph.yml'
      - 'api/admin/memory-graph.ts'
      - 'apps/admin/src/MemoryGraphDashboard.tsx'
      - 'apps/admin/src/StudioControls.tsx'
      - 'apps/admin/src/studio-system.css'
      - 'apps/admin/src/studioTheme.ts'
      - 'apps/web/src/main.tsx'
      - 'config/agent-memory-sources-v1.json'
      - 'data/agent-memory/**'
      - 'scripts/*memory*'
      - 'tests/memory/**'
      - 'tests/helpers/studio-memory*'
      - 'tests/helpers/studio-article-memory*'
      - 'tests/visual/studio-article-memory.spec.ts'
      - 'tests/visual/studio-memory-feedback.spec.ts'
      - 'tests/visual/review-queue-workflow.spec.ts'
      - 'playwright.memory.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  memory-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:knowledge
      - name: Verify Studio entry bundle budget before browser tests
        run: npm run build:admin && node scripts/check-admin-bundle-budgets.mjs
        env:
          VITE_SUPABASE_URL: https://visual-smoke.supabase.test
          VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder
      - run: npm run test:agent-memory-browser
      - name: Verify Studio correction capture and review in desktop and mobile editors
        run: npx playwright test tests/visual/studio-article-memory.spec.ts tests/visual/studio-memory-feedback.spec.ts tests/visual/review-queue-workflow.spec.ts --workers=1
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: memory-graph-browser-results
          path: test-results/

env:
  PRIVATE_REPORT_DOCUMENTS: ${{ secrets.PRIVATE_REPORT_DOCUMENTS }}

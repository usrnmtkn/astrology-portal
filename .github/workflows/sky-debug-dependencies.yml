name: Sky isolated verification dependencies
on:
  push:
    branches: [chatgpt/ci-and-sky-verification-20260914]
    paths: ['.github/workflows/sky-debug-dependencies.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: tar -czf /tmp/sky-debug-node-modules.tgz node_modules
      - uses: actions/upload-artifact@v6
        with:
          name: sky-debug-node-modules
          path: /tmp/sky-debug-node-modules.tgz
          retention-days: 1

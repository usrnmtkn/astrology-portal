name: ChatGPT Safe Friends Transits Brief Patch

on:
  push:
    branches:
      - chatgpt/friend-transits-brief-safe-main-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/friend-transits-brief-safe-main-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Integrate brief without restoring reverted prioritization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/features/friends/ManualChartsPanel.tsx")
          source = path.read_text()

          old_import = '''import type {\n  FriendBondTransitView,\n  FriendDailyForecastView,\n  FriendHouseTransitView,\n  FriendPersonalTransitGroup\n} from "./FriendTransitsTab";'''
          new_import = '''import {\n  buildFriendTransitsBrief,\n  type FriendBondTransitView,\n  type FriendDailyForecastView,\n  type FriendHouseTransitView,\n  type FriendPersonalTransitGroup\n} from "./friendTransitsBrief";'''
          if old_import in source:
              source = source.replace(old_import, new_import, 1)
          elif 'buildFriendTransitsBrief' not in source:
              raise SystemExit("Friends transit type import no longer matches safe main")

          bond_old = '''  const selectedBondTransitViewCards = useMemo<FriendBondTransitView[]>(() => (\n    selectedBondTransitCards.map((card) => ({\n      id: card.id,\n      headline: card.headline,\n      effectBody: card.effectBody,\n      activationBody: card.activationBody\n    }))\n  ), [selectedBondTransitCards]);'''
          bond_new = '''  const selectedBondTransitViewCards = useMemo<FriendBondTransitView[]>(() => (\n    selectedBondTransitCards.map((card) => ({\n      id: card.id,\n      headline: card.headline,\n      effectBody: card.effectBody,\n      activationBody: card.activationBody,\n      transitPlanet: card.transitPlanet\n    }))\n  ), [selectedBondTransitCards]);'''
          if bond_old in source:
              source = source.replace(bond_old, bond_new, 1)

          house_start = source.index("  const selectedFriendHouseTransitViewCards")
          house_end = source.index("  const selectedFriendPersonalTransitGroups", house_start)
          house_segment = source[house_start:house_end]
          if "contentKey: card.contentKey" not in house_segment:
              house_segment = house_segment.replace(
                  "      id: card.contentKey,\n      transitPlanet:",
                  "      id: card.contentKey,\n      contentKey: card.contentKey,\n      transitPlanet:",
                  1
              )
              source = source[:house_start] + house_segment + source[house_end:]

          personal_start = source.index("  const selectedFriendPersonalTransitGroups")
          personal_end = source.index("  const selectedFriendPlacementRows", personal_start)
          personal_segment = source[personal_start:personal_end]
          if "evidence: {" not in personal_segment:
              old_detail = '''            detailAvailable: acceptedOwnerApprovedTransitSections(\n              normalized.sections,\n              fallbackV3ApprovalLevelForContentKey\n            ).length > 0\n'''
              new_detail = '''            detailAvailable: acceptedOwnerApprovedTransitSections(\n              normalized.sections,\n              fallbackV3ApprovalLevelForContentKey\n            ).length > 0,\n            evidence: {\n              transitPlanet: transit.transitPlanet,\n              transitSign: transit.transitSign,\n              aspect: transit.aspect,\n              natalPoint: transit.natalPoint,\n              natalSign: transit.natalSign,\n              natalHouse: transit.natalHouse,\n              direction: transit.direction,\n              score: transit.score,\n              significance: transit.significance,\n              timingBonuses: transit.timingBonuses ?? [],\n              contentKeys: normalized.sections.flatMap((section) => section.sourceKeys)\n            }\n'''
              if old_detail not in personal_segment:
                  raise SystemExit("Personal transit detail gate no longer matches safe main")
              personal_segment = personal_segment.replace(old_detail, new_detail, 1)
              source = source[:personal_start] + personal_segment + source[personal_end:]

          status_marker = "  const selectedFriendNatalAspectPatternStatus ="
          if "const selectedFriendTransitsBrief = useMemo" not in source:
              status_index = source.index(status_marker)
              brief = '''  const selectedFriendTransitsBrief = useMemo(() => buildFriendTransitsBrief({\n    friendName: selectedChart?.displayName ?? "Friend",\n    dateLabel: transitDateLabel,\n    personalTransitGroups: selectedFriendPersonalTransitGroups,\n    bondTransits: selectedBondTransitViewCards,\n    houseTransits: selectedFriendHouseTransitViewCards,\n    dailyForecast: selectedFriendDailyForecast,\n    dailyDoItems: selectedFriendDailyDoDont?.do ?? [],\n    dailyDontItems: selectedFriendDailyDoDont?.dont ?? [],\n    patternItems: currentSkyLoading ? [] : selectedFriendNatalAspectPatternItems\n  }), [\n    currentSkyLoading,\n    selectedBondTransitViewCards,\n    selectedChart?.displayName,\n    selectedFriendDailyDoDont,\n    selectedFriendDailyForecast,\n    selectedFriendHouseTransitViewCards,\n    selectedFriendNatalAspectPatternItems,\n    selectedFriendPersonalTransitGroups,\n    transitDateLabel\n  ]);\n'''
              source = source[:status_index] + brief + source[status_index:]

          old_component = '''            <FriendTransitsTab\n              bondTransits={selectedBondTransitViewCards}\n              isLoading={currentSkyLoading}\n              dailyForecast={selectedFriendDailyForecast}\n              dailyDoItems={selectedFriendDailyDoDont?.do ?? []}\n              dailyDontItems={selectedFriendDailyDoDont?.dont ?? []}\n              dateLabel={transitDateLabel}\n              friendName={selectedChart.displayName}\n              houseTransits={selectedFriendHouseTransitViewCards}\n              onOpenBondTransit={openBondTransitById}\n              onOpenHouseTransit={openFriendHouseTransitById}\n              onOpenPersonalTransit={openFriendTransitById}\n              patternItems={currentSkyLoading ? [] : selectedFriendNatalAspectPatternItems}\n              patternTimingOverrides={currentSkyLoading ? {} : selectedFriendNatalAspectPatternTimingOverrides}\n              personalTransitGroups={selectedFriendPersonalTransitGroups}\n            />'''
          new_component = '''            <FriendTransitsTab\n              brief={selectedFriendTransitsBrief}\n              isLoading={currentSkyLoading}\n              onOpenBondTransit={openBondTransitById}\n              onOpenHouseTransit={openFriendHouseTransitById}\n              onOpenPersonalTransit={openFriendTransitById}\n              patternTimingOverrides={currentSkyLoading ? {} : selectedFriendNatalAspectPatternTimingOverrides}\n            />'''
          if old_component in source:
              source = source.replace(old_component, new_component, 1)
          elif "brief={selectedFriendTransitsBrief}" not in source:
              raise SystemExit("FriendTransitsTab call no longer matches safe main")

          if "rankFriendHouseTransitActivations" in source:
              raise SystemExit("Unsafe PR #568 house prioritization was restored")
          safe_house_selection = '''currentSkyHouseActivations(currentSky, selectedFriendReadyNatalChart)\n      .slice(0, 4)'''
          if safe_house_selection not in source:
              raise SystemExit("Safe post-revert house selection changed")

          path.write_text(source)
          PY
      - name: Verify safe diff boundary
        run: |
          git diff -- apps/web/src/features/friends/ManualChartsPanel.tsx
          if git diff --name-only | grep -qx 'apps/web/src/App.tsx'; then
            echo 'App.tsx must remain untouched so reverted angle targeting stays reverted.' >&2
            exit 1
          fi
      - run: npm ci
      - name: Brief fixtures
        run: node --experimental-strip-types scripts/test-friend-transits-brief.mts
      - name: Brief render regression
        run: node scripts/test-friend-transits-brief-render.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build knowledge
        run: npm run build:knowledge
      - name: Build web
        run: npm run build:web
      - name: Commit safe integration
        run: |
          if git diff --quiet -- apps/web/src/features/friends/ManualChartsPanel.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/friends/ManualChartsPanel.tsx
          git commit -m "Integrate Friends transits brief on safe main"
          git push origin HEAD:chatgpt/friend-transits-brief-safe-main-20260906

name: Content Studio revision completion

on:
  pull_request:
    paths:
      - "apps/web/supabase/migrations/20260907061500_content_studio_revision_completion.sql"
      - "scripts/test-content-studio-revision-completion.mjs"
      - ".github/workflows/content-studio-revision-completion.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/supabase/migrations/20260907061500_content_studio_revision_completion.sql"
      - "scripts/test-content-studio-revision-completion.mjs"
      - ".github/workflows/content-studio-revision-completion.yml"

permissions:
  contents: read

concurrency:
  group: content-studio-revision-completion-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  revision-completion-contract:
    if: ${{ (github.ref_type == 'branch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && vars.RELEASE_ACTIVE_PR != '' && format('{0}', github.event.pull_request.number) == vars.RELEASE_ACTIVE_PR) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-content-studio-revision-completion.mjs

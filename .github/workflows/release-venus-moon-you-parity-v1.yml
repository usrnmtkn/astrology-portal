name: Release Venus Moon You parity v1
# Temporary diagnostic checkpoint. Restore full release gates after scene inventory is identified.

on:
  push:
    branches:
      - chatgpt/friends-transits-complete-v1

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/friends-transits-complete-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose checked-in approved serving scene inventory
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { approvedServingSceneCatalog } from './src/astro-writing/sceneEvidence.mjs';
          const approved = fs.readFileSync('data/writing/OWNER_APPROVED_EXAMPLES.jsonl', 'utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          const sceneRows = approvedServingSceneCatalog(approved).map(({ contentKey, sceneNouns }) => ({ contentKey, sceneNouns }));
          console.log(JSON.stringify({ count: sceneRows.length, rows: sceneRows }, null, 2));
          NODE
          exit 1

name: Temp North Node owner source lock

on:
  push:
    branches:
      - release/north-node-exact-48-20260905

permissions:
  contents: read

jobs:
  compare-owner-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/test-calendar-exact-owner-source-lock-temp.mjs

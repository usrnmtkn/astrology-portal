name: Reader recovery verification

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/verify-production-sky-summary.mjs'
      - 'scripts/verify-production-sky-placement.mjs'
      - 'scripts/test-admin-*.mts'
      - 'apps/web/src/content/skyDailySummary*'
      - 'apps/web/src/features/sky/PublishedSkySummary.tsx'
      - 'apps/web/src/services/contentPublications.ts'
      - 'apps/web/src/App.tsx'
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: reader-recovery-verification-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.deployment.sha || github.ref }}
  cancel-in-progress: true

jobs:
  production-summary:
    # The public site is tested AFTER production deployment, not against a PR's
    # still-unfixed base. The strict cold-load assertion is unchanged.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       (startsWith(github.event.deployment.environment, 'Production') ||
        startsWith(github.event.deployment.environment, 'production')))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect the deployed guest Sky page without modifying content
        run: node scripts/verify-production-sky-summary.mjs && node scripts/verify-production-sky-placement.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: production-sky-summary-verification
          path: |
            test-results/production-sky-summary/
            test-results/production-sky-placement/
          retention-days: 7

  reader-contracts:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_REPORT_DOCUMENTS: ${{ secrets.PRIVATE_REPORT_DOCUMENTS }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:knowledge
      - name: Verify Daily Sky composition
        run: npm run test:sky-daily-summary
      - name: Verify hydration regression
        if: success() || failure()
        run: node --import tsx scripts/test-sky-summary-hydration-stability.mts
      - name: Verify Content Studio save and reader contracts
        if: success() || failure()
        run: npm run test:content-studio-api
      - name: Verify publication retirement and exact documented source-gap refusals
        if: success() || failure()
        run: npm run test:content-publications

name: Editorial reference policy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reference-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-editorial-reference-policy.mjs

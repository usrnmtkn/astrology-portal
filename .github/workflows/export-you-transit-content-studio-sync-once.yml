name: Export You transit Content Studio sync artifact

on:
  push:
    branches:
      - chatgpt/you-transit-content-studio-sync-artifact

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Export exact merged source file
        run: |
          mkdir -p artifacts
          cp apps/web/src/content/fallbackArchitectureV3/source-rows/transit-synastry-rows-v1.json artifacts/transit-synastry-rows-v1.json
          sha256sum artifacts/transit-synastry-rows-v1.json > artifacts/transit-synastry-rows-v1.sha256
          git rev-parse HEAD > artifacts/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: you-transit-content-studio-sync
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

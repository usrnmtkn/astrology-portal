name: Patch Sky related aspect write-ups

on:
  push:
    branches:
      - "fix/sky-related-aspect-writeups-final"
    paths:
      - "scripts/patch-sky-related-aspect-writeups.mjs"
      - ".github/workflows/patch-sky-related-aspect-writeups.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Sky related-aspect repair
        run: node scripts/patch-sky-related-aspect-writeups.mjs
      - name: Verify focused source contract
        run: node scripts/test-sky-placement-exact-aspect-authority.mjs
      - name: Build astro knowledge
        run: npm run build -w @tldr/astro-knowledge
      - name: Build web
        run: npm run build -w @tldr/web
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify Sun-Lilith full write-up regression
        run: npx playwright test -c playwright.config.ts tests/visual/client-facing-user-flows.spec.ts --grep "Sky placement renders approved related aspects as full write-ups without source-gap rows"
      - name: Verify existing Sun in Virgo regression
        run: npx playwright test -c playwright.config.ts tests/visual/client-facing-user-flows.spec.ts --grep "Sun in Virgo detail serves the exact canonical V4 owner-approved article"
      - name: Verify whitespace
        run: git diff --check
      - name: Commit permanent repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx scripts/test-sky-placement-exact-aspect-authority.mjs tests/visual/client-facing-user-flows.spec.ts
          git diff --cached --check
          git commit -m "fix(sky): render approved related aspect write-ups"
          git push origin HEAD

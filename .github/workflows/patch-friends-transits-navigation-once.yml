name: Patch Friends Transits navigation once

on:
  push:
    branches:
      - chatgpt/friends-transits-navigation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Patch Content Studio navigation
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/admin/src/GeneratedContentAdminDashboard.tsx')
          text = path.read_text()

          old_classifier = '  if (key.includes("friends") || key.includes("synastry") || key.includes("relationship") || surface === "friends" || surface === "relationship" || surface === "synastry" || surface === "composite") return "friends";'
          new_classifier = '  if (key.includes("friends") || key.includes("synastry") || key.includes("relationship") || key.includes("bond-effect") || surface === "friends" || surface === "relationship" || surface === "synastry" || surface === "composite") return "friends";'
          if 'key.includes("bond-effect")' not in text:
              if text.count(old_classifier) != 1:
                  raise SystemExit('Could not find the Friends fallback-section classifier exactly once.')
              text = text.replace(old_classifier, new_classifier, 1)

          if '<span>Friends Transits</span>' not in text:
              start = text.index('                {item.page === "skyWriteups" && (')
              end_marker = '                )}\n              </Fragment>'
              end = text.index(end_marker, start)
              insert_at = end + len('                )}\n')
              block = '''                {item.page === "skyWriteups" && (\n                  <>\n                    <button\n                      type="button"\n                      title="Friends > Transits reader-facing copy"\n                      onClick={() => navigateAdminPage("skyWriteups", new URLSearchParams({ view: "transits-to-natal", audience: "friends" }))}\n                      aria-current={window.location.hash.includes("audience=friends") && activePage === "skyWriteups" ? "page" : undefined}\n                    >\n                      <Users size={16} aria-hidden="true" />\n                      <span>Friends Transits</span>\n                    </button>\n                    <div className="admin-nav-workspace-group" aria-label="Friends Transits sections">\n                      <button\n                        type="button"\n                        title="Edit the bond-effect passages shown under Friends > Transits > Between you two"\n                        onClick={() => navigateAdminPage("knowledge", new URLSearchParams({ section: "friends", q: "bond-effect", audience: "friends" }))}\n                        aria-current={window.location.hash.includes("audience=friends") && activePage === "knowledge" && window.location.hash.includes("bond-effect") ? "page" : undefined}\n                      >\n                        <span>Between you two</span>\n                      </button>\n                      <button\n                        type="button"\n                        title="Edit Friend View Copy for the personal transits shown as Active for the selected friend"\n                        onClick={() => navigateAdminPage("skyWriteups", new URLSearchParams({ view: "transits-to-natal", audience: "friends" }))}\n                        aria-current={window.location.hash.includes("audience=friends") && activePage === "skyWriteups" && skyWriteupWorkspaceView === "transits-to-natal" ? "page" : undefined}\n                      >\n                        <span>Active for {"{{Name}}"}</span>\n                      </button>\n                      <button\n                        type="button"\n                        title="Edit the house-transit passages shown under Friends > Transits > Where it lands"\n                        onClick={() => navigateAdminPage("skyWriteups", new URLSearchParams({ view: "house-transits", audience: "friends" }))}\n                        aria-current={window.location.hash.includes("audience=friends") && activePage === "skyWriteups" && skyWriteupWorkspaceView === "house-transits" ? "page" : undefined}\n                      >\n                        <span>Where it lands (house transit)</span>\n                      </button>\n                    </div>\n                  </>\n                )}\n'''
              text = text[:insert_at] + block + text[insert_at:]

          path.write_text(text)
          PY
      - name: Run focused navigation tests
        run: |
          node scripts/test-admin-friends-transits-navigation.mjs
          node scripts/test-admin-transit-natal-sources.mjs
          node scripts/test-admin-natal-aspect-sources.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Navigation patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/GeneratedContentAdminDashboard.tsx
          git commit -m "Improve Friends Transits Content Studio navigation"
          git push origin HEAD:chatgpt/friends-transits-navigation

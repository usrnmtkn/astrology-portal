name: Audit Content Studio CRUD

on:
  push:
    branches:
      - chatgpt/content-studio-crud-save-fix

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://visual-smoke.supabase.test
      VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/content-studio-crud-save-fix
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Align admin CRUD tests with owner publish action
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/visual/content-dashboard-admin-user-flows.spec.ts')
          text = path.read_text()
          old_label = 'Approve & publish revision'
          if old_label not in text:
              raise SystemExit('Expected old package publish label was not found in admin flow tests.')
          text = text.replace(old_label, 'Save & publish revision')
          old_status = 'await expect(editor.getByLabel("Reader status after save")).toHaveValue("LIVE");'
          if old_status not in text:
              raise SystemExit('Expected package reader-status assertion was not found.')
          text = text.replace(old_status, 'await expect(editor.getByLabel("Reader status after save")).toHaveText("Published");')
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Content Studio API CRUD roundtrip
        run: npm run test:content-studio-api
      - name: Run Content Studio admin user flows
        run: npm run qa:admin-flows
      - name: Build Content Studio admin
        run: npm run build:admin
      - name: Commit verified test alignment
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git rm .github/workflows/chatgpt-content-studio-full-crud-audit.yml
          git add tests/visual/content-dashboard-admin-user-flows.spec.ts
          git commit -m "test(admin): cover repaired package publish controls"
          git push origin HEAD:chatgpt/content-studio-crud-save-fix

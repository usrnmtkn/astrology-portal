name: Probe Friends historical signoff v1

on:
  push:
    branches:
      - chatgpt/friends-transits-complete-v1-gate-repair

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/friends-transits-complete-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify historical Friends signoff snapshot
        run: node scripts/test-friends-owner-signoff-ruling.mjs

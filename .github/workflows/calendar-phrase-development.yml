name: Apply verified monthly authoring patch
on:
  push:
    branches: [chatgpt/monthly-phrase-authoring-memory]
    paths: [.github/workflows/calendar-phrase-development.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/chatgpt/monthly-phrase-authoring-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/monthly-phrase-authoring-memory
      - name: Verify and apply application patch only
        shell: bash
        run: |
          set -euo pipefail
          cat .github/monthly-patch-1.txt .github/monthly-patch-2.txt .github/monthly-patch-3.txt | base64 --decode > /tmp/monthly-source.patch.xz
          echo '24eeec3299611ad6b5910a1e6e14b478344c8f61421882b88fc360b6598bef70  /tmp/monthly-source.patch.xz' | sha256sum --check
          xz -dc /tmp/monthly-source.patch.xz > /tmp/monthly-source.patch
          git apply --check --unidiff-zero --exclude='.github/workflows/*' /tmp/monthly-source.patch
          git apply --index --unidiff-zero --exclude='.github/workflows/*' /tmp/monthly-source.patch
          git rm .github/monthly-patch-1.txt .github/monthly-patch-2.txt .github/monthly-patch-3.txt
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git commit -m 'feat: add memory-supported monthly phrase authoring to Content Studio'
          git push origin HEAD:refs/heads/chatgpt/monthly-phrase-authoring-memory

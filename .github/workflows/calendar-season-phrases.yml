name: Calendar seasonal phrase contract
on:
  pull_request:
    paths:
      - 'src/content-studio/**'
      - 'apps/admin/src/CalendarOverviewEditor.tsx'
      - 'apps/admin/src/CalendarTemplatePreview.tsx'
      - 'apps/admin/src/calendar*.ts'
      - 'apps/admin/src/useCalendarSeasonPhraseSources.ts'
      - 'apps/web/src/content/studioCustomVariables.*'
      - 'api/_lib/studio-variables.ts'
      - 'scripts/test-calendar-season-*'
      - 'tests/visual/calendar-season-phrases.spec.ts'
      - 'playwright.sky-forecast.config.ts'
      - '.github/workflows/calendar-season-phrases.yml'
permissions:
  contents: read
concurrency:
  group: calendar-season-phrases-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  seasonal-phrases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:knowledge
      - run: node --import tsx scripts/test-calendar-season-phrases.mjs
      - run: node --import tsx scripts/test-calendar-season-phrase-api.mts
      - run: npm run qa:css-audit
      - run: npx playwright install --with-deps chromium
      - name: Test source bindings in a fresh Studio build
        run: npx playwright test -c playwright.sky-forecast.config.ts tests/visual/calendar-season-phrases.spec.ts
      - name: Keep the existing Studio bundle limits
        run: node scripts/check-admin-bundle-budgets.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: calendar-season-phrase-results
          path: |
            test-results/sky-forecast-runs/
            test-results/calendar-season-phrases-*.png
          if-no-files-found: ignore
          retention-days: 3
    env:
      PRIVATE_REPORT_DOCUMENTS: ${{ secrets.PRIVATE_REPORT_DOCUMENTS }}
      VITE_SUPABASE_URL: https://visual-smoke.supabase.test
      VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder

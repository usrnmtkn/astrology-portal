name: Patch review queue tag layout once

on:
  push:
    branches:
      - chatgpt/review-queue-tags-below-title

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Move review queue tags below title
        run: >-
          python -c "from pathlib import Path; p=Path('apps/admin/src/admin-components.css'); t=p.read_text(); m='/* Review queue cards: keep tags below the title instead of squeezing the heading. */'; b='\\n\\n'+m+'\\n.admin-dashboard .admin-review-queue-row-head {\\n  grid-template-columns: 24px minmax(0, 1fr);\\n}\\n\\n.admin-dashboard .admin-review-queue-row-head > .admin-content-row-check {\\n  grid-column: 1;\\n  grid-row: 1;\\n}\\n\\n.admin-dashboard .admin-review-queue-row-head > .admin-review-queue-copy {\\n  grid-column: 2;\\n  grid-row: 1;\\n  min-width: 0;\\n}\\n\\n.admin-dashboard .admin-review-queue-row-head > .admin-review-queue-meta-strip {\\n  grid-column: 2;\\n  grid-row: 2;\\n  justify-content: flex-start;\\n  min-width: 0;\\n}\\n'; p.write_text(t.rstrip()+b+'\\n') if m not in t else None"
      - name: Verify focused layout contract
        run: >-
          node -e "const fs=require('fs'); const css=fs.readFileSync('apps/admin/src/admin-components.css','utf8'); const m='/* Review queue cards: keep tags below the title instead of squeezing the heading. */'; const r=css.slice(css.lastIndexOf(m)); if(!r.includes('grid-template-columns: 24px minmax(0, 1fr);')) throw new Error('review queue header must use two columns'); if(!r.includes('grid-row: 2;')) throw new Error('tag strip must be on second row'); if(!r.includes('justify-content: flex-start;')) throw new Error('tag strip must be left aligned'); console.log('Review queue tag layout contract passed.');"
      - name: Commit layout fix
        run: |
          if git diff --quiet; then
            echo "Layout fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/admin-components.css
          git commit -m "Place review queue tags below titles"
          git push origin HEAD:chatgpt/review-queue-tags-below-title

name: Patch review queue tag layout once

on:
  push:
    branches:
      - chatgpt/review-queue-tags-below-title

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Move review queue tags below title
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/admin/src/admin-components.css')
          text = path.read_text()
          marker = '/* Review queue cards: keep tags below the title instead of squeezing the heading. */'
          block = '''

/* Review queue cards: keep tags below the title instead of squeezing the heading. */
.admin-dashboard .admin-review-queue-row-head {
  grid-template-columns: 24px minmax(0, 1fr);
}

.admin-dashboard .admin-review-queue-row-head > .admin-content-row-check {
  grid-column: 1;
  grid-row: 1;
}

.admin-dashboard .admin-review-queue-row-head > .admin-review-queue-copy {
  grid-column: 2;
  grid-row: 1;
  min-width: 0;
}

.admin-dashboard .admin-review-queue-row-head > .admin-review-queue-meta-strip {
  grid-column: 2;
  grid-row: 2;
  justify-content: flex-start;
  min-width: 0;
}
'''
          if marker not in text:
              text = text.rstrip() + block + '\n'
              path.write_text(text)
          PY
      - name: Verify focused layout contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const css = fs.readFileSync('apps/admin/src/admin-components.css', 'utf8');
          const marker = '/* Review queue cards: keep tags below the title instead of squeezing the heading. */';
          const rules = css.slice(css.lastIndexOf(marker));
          if (!rules.includes('grid-template-columns: 24px minmax(0, 1fr);')) throw new Error('review queue header must use two columns');
          if (!rules.includes('grid-row: 2;')) throw new Error('tag strip must be on second row');
          if (!rules.includes('justify-content: flex-start;')) throw new Error('tag strip must be left aligned');
          console.log('Review queue tag layout contract passed.');
          NODE
      - name: Commit layout fix
        run: |
          if git diff --quiet; then
            echo "Layout fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/admin-components.css
          git commit -m "Place review queue tags below titles"
          git push origin HEAD:chatgpt/review-queue-tags-below-title

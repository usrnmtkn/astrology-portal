name: Calendar phrase writing
on:
  pull_request:
    paths:
      - 'api/admin/calendar-phrase-writing.ts'
      - 'api/_lib/calendar-*.ts'
      - 'src/content-studio/**'
      - 'apps/admin/src/MonthlyPhraseStudio.tsx'
      - 'apps/admin/src/SkyForecastTemplateStudio.tsx'
      - 'scripts/test-calendar-phrase-authoring.mts'
      - 'tests/visual/calendar-phrase-writing.spec.ts'
      - '.github/workflows/calendar-phrase-writing.yml'
  push:
    branches: [chatgpt/monthly-phrase-authoring-memory]
    paths:
      - 'api/admin/calendar-phrase-writing.ts'
      - 'api/_lib/calendar-*.ts'
      - 'src/content-studio/**'
      - 'apps/admin/src/MonthlyPhraseStudio.tsx'
      - 'scripts/test-calendar-phrase-authoring.mts'
      - 'tests/visual/calendar-phrase-writing.spec.ts'
      - '.github/workflows/calendar-phrase-writing.yml'
permissions:
  contents: read
concurrency:
  group: calendar-phrase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @tldr/astro-knowledge
      - name: Nested templates, governed provider mock, source receipts and storage
        run: node --import tsx scripts/test-calendar-phrase-authoring.mts
      - run: npm run test:content-studio-api
      - run: npm run qa:css-audit
      - run: npx tsc --noEmit -p apps/admin/tsconfig.json
      - run: npx playwright install --with-deps chromium
      - name: Fresh production build and real Content Studio browser flows
        run: npx playwright test tests/visual/calendar-phrase-writing.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-phrase-qa
          path: test-results/
          retention-days: 3

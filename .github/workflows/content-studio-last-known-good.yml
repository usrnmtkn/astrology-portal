name: Refresh Content Studio last-known-good snapshot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [Content Studio API contract, Visual smoke, Project privacy]
    types: [completed]
    branches: [automation/content-studio-snapshot]

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: content-studio-last-known-good
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Reconcile published content and exact-head checks
        env:
          PROJECT_PRIVACY_POLICY: ${{ secrets.PROJECT_PRIVACY_POLICY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-content-studio-snapshot.mjs

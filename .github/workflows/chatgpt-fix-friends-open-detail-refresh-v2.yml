name: Verify Friends live detail refresh

on:
  push:
    branches:
      - chatgpt/fix-content-studio-live-overlay-loader

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://visual-smoke.supabase.test
      VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/fix-content-studio-live-overlay-loader
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python scripts/apply-friends-open-detail-refresh.py
      - name: Install dependencies
        run: npm ci
      - name: Build astro knowledge prerequisite
        run: npm run build -w @tldr/astro-knowledge
      - name: Test detail refresh contract
        run: node scripts/test-friends-live-detail-refresh.mjs
      - name: Test live overlay selection
        run: node --experimental-strip-types scripts/test-fallback-dashboard-live-overlay.mjs
      - name: Test Friends hydration policy
        run: node --import tsx scripts/test-friends-content-loading-policy.mjs
      - name: Test Friends Transit override
        run: node scripts/test-friends-transit-dashboard-override.mjs
      - name: Build admin
        run: npm run build:admin
      - name: Build reader
        run: npm run build -w @tldr/web
      - name: Commit verified repair
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git rm .github/workflows/chatgpt-fix-friends-open-detail-refresh-v2.yml scripts/apply-friends-open-detail-refresh.py
          git add apps/web/src/App.tsx apps/web/src/features/friends/ManualChartsPanel.tsx scripts/test-friends-live-detail-refresh.mjs package.json
          git commit -m "fix: refresh open Friends details after live content hydration"
          git push origin HEAD:chatgpt/fix-content-studio-live-overlay-loader

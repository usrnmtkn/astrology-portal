name: Temp run corrected birth-time angle reliability patch

on:
  push:
    branches:
      - fix/birth-time-angle-reliability-20260906

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/birth-time-angle-reliability-20260906
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply corrected guarded patch
        run: python scripts/apply-birth-time-angle-reliability-v2-temp.py
      - name: Install dependencies
        run: npm ci
      - name: Run birth-time reliability regression
        run: node --experimental-strip-types scripts/test-birth-time-angle-reliability.mts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit implementation and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/apply-birth-time-angle-reliability-temp.py
          rm scripts/apply-birth-time-angle-reliability-v2-temp.py
          rm .github/workflows/birth-time-angle-reliability-patch-temp.yml
          rm .github/workflows/birth-time-angle-reliability-patch-v2-temp.yml
          rm .github/workflows/birth-time-angle-reliability-patch-v3-temp.yml
          git add -A
          git commit -m "fix: require known birth time for angles and houses"
          git push origin HEAD:fix/birth-time-angle-reliability-20260906

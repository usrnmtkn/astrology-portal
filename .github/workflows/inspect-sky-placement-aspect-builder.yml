name: Fix sky placement repeated exact aspects

on:
  push:
    branches:
      - fix/sky-placement-aspect-dedupe-order-20260907

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sky-placement-aspect-dedupe-order-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @tldr/astro-knowledge
      - run: python .github/scripts/apply-sky-placement-aspect-dedupe-order.py
      - run: node scripts/test-sky-placement-exact-aspect-authority.mjs
      - run: node --import tsx scripts/test-sky-placement-residency-aspects.mts
      - run: node scripts/test-calendar-south-node-serving.mjs
      - run: npm run typecheck
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-sky-placement-aspect-builder.yml .github/scripts/apply-sky-placement-aspect-dedupe-order.py
          git add apps/web/src/App.tsx apps/web/src/features/sky/SkyDetailArticle.tsx apps/web/src/services/skyPlacementResidencyAspects.ts scripts/test-sky-placement-exact-aspect-authority.mjs scripts/test-sky-placement-residency-aspects.mts
          git commit -m "Deduplicate repeated Sky placement aspects by exact date"
          git push origin HEAD:fix/sky-placement-aspect-dedupe-order-20260907

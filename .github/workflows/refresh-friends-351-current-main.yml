name: Refresh Friends 351 release on current main

on:
  push:
    branches:
      - chatgpt/friends-transit-351-owner-live-v1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/friends-transit-351-owner-live-v1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/tldrastro-api/pyproject.toml
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(
              "packages/astro-knowledge/generated/knowledge-index.json"
              "packages/astro-knowledge/review/production-sky-kernel-comparison-v1/comparison.json"
            )
            if [ "${conflicts[*]}" != "${expected[*]}" ]; then
              printf 'Unexpected merge conflicts:\n%s\n' "${conflicts[@]}"
              exit 1
            fi
            git checkout --theirs -- "${expected[@]}"
            git add "${expected[@]}"
            git commit --no-edit
          fi
      - name: Reconcile current Sky exact-approval fixtures
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'scripts/test-reviewed-sky-aspect-phrasebook.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const dataImport = 'const approvedJupiterNeptune = readJson("../packages/astro-knowledge/data/transits/jupiter-trine-neptune.json");\n';
          const imports = [
            ['approvedJupiterNeptuneExact', 'jupiter-trine-neptune-exact-approval.json'],
            ['approvedNeptunePlutoExact', 'neptune-sextile-pluto-exact-approval.json'],
            ['approvedUranusNeptuneExact', 'uranus-sextile-neptune-exact-approval.json'],
            ['approvedUranusPlutoExact', 'uranus-trine-pluto-exact-approval.json']
          ];
          let insert = dataImport;
          for (const [name, file] of imports) {
            if (!source.includes(`const ${name} =`)) {
              insert += `const ${name} = readJson("../packages/astro-knowledge/review/sky-calendar-exact-approved-2026-09-03/records/${file}");\n`;
            }
          }
          if (insert !== dataImport) source = source.replace(dataImport, insert);
          const oldJupiter = `assert.equal(\n  approvedJupiterNeptune.readerCopy?.body,\n  ownerRewriteSource.payloads["sky.jupiter.trine.neptune"].payload.body,\n);`;
          const newJupiter = `assert.equal(approvedJupiterNeptuneExact.authority, "owner");\nassert.equal(approvedJupiterNeptuneExact.decision, "approve");\nassert.equal(approvedJupiterNeptuneExact.approvalLevel, "exact_owner_approved");\nassert.ok(approvedJupiterNeptuneExact.capabilities.includes("serving"));\nassert.equal(approvedJupiterNeptune.readerCopy?.body, approvedJupiterNeptuneExact.body);`;
          if (source.includes(oldJupiter)) source = source.replace(oldJupiter, newJupiter);
          const oldLoop = `for (const id of ["neptune-sextile-pluto", "uranus-sextile-neptune", "uranus-trine-pluto"]) {\n  const [transiting, aspect, other] = id.split("-");\n  assert.equal(\n    exactTransitRecords.find((record) => record.id === id)?.readerCopy?.body,\n    ownerRewriteSource.payloads[\`sky.${transiting}.${aspect}.${other}\`].payload.body,\n  );\n}`;
          const newLoop = `for (const [id, approval] of [\n  ["neptune-sextile-pluto", approvedNeptunePlutoExact],\n  ["uranus-sextile-neptune", approvedUranusNeptuneExact],\n  ["uranus-trine-pluto", approvedUranusPlutoExact]\n]) {\n  assert.equal(approval.authority, "owner");\n  assert.equal(approval.decision, "approve");\n  assert.equal(approval.approvalLevel, "exact_owner_approved");\n  assert.ok(approval.capabilities.includes("serving"));\n  assert.equal(exactTransitRecords.find((record) => record.id === id)?.readerCopy?.body, approval.body);\n}`;
          if (source.includes(oldLoop)) source = source.replace(oldLoop, newLoop);
          fs.writeFileSync(path, source);
          NODE
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned API dependencies
        working-directory: services/tldrastro-api
        run: python -m pip install -e ".[dev]"
      - name: Re-apply exact owner-approved Friends release
        run: node scripts/promote-friends-transit-completion-v1.mjs --apply
      - name: Rebuild fallback browser resolver
        run: npx esbuild apps/web/src/content/fallbackArchitectureV3/resolver/index.browser.ts --bundle --format=esm --outfile=apps/web/src/content/fallbackArchitectureV3/dist/tldr-content.js
      - name: Regenerate governed fallback artifacts
        run: |
          node scripts/generate-fallback-package-manifest.mjs
          node scripts/build-canonical-content-hub.mjs --write
          node scripts/build-knowledge-index.mjs --write
          node scripts/build-phrase-index.mjs --write
          node scripts/build-production-sky-kernel-comparison.mjs --write
          node scripts/build-content-inventory.mjs --source-commit=${GITHUB_SHA}
          node scripts/build-content-export.mjs
          npm run build:writing-harness
      - name: Run focused Friends release gates
        run: |
          node scripts/promote-friends-transit-completion-v1.mjs
          node scripts/test-friends-transit-completion-v1.mjs
          node scripts/test-friends-transit-nonsun-serving-v1.mjs
          node scripts/test-sun-friends-serving-v1.mjs
          node --experimental-strip-types scripts/test-transit-friend-pronoun-grammar.mjs
          node --import tsx scripts/test-friends-transit-detail-provenance-gate.mjs
          node scripts/test-fallback-refresh-wiring.mjs
          node scripts/test-fallback-package-cache-contract.mjs
          node scripts/test-content-inventory-export.mjs
          node scripts/test-friends-owner-signoff-ruling.mjs
          node scripts/test-reviewed-sky-aspect-phrasebook.mjs
          node scripts/generate-fallback-package-manifest.mjs --check
          node scripts/build-knowledge-index.mjs --check
          node scripts/build-phrase-index.mjs --check
          git diff --check
      - name: Run repository typecheck
        run: npm run typecheck
      - name: Run full content gate
        run: npm run test:content
      - name: Build web application
        run: npm run build:web
      - name: Enforce authorized bundle budgets
        run: npm run qa:bundle
      - name: Review refreshed release diff
        run: |
          git status --short
          git diff --stat
          git diff --check
      - name: Commit and push refreshed release
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "release(friends): refresh 351 rewrites on latest main"
          fi
          git push origin HEAD:chatgpt/friends-transit-351-owner-live-v1

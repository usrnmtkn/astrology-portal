name: Sky hydration inspection

on:
  push:
    branches: [chatgpt/ci-and-sky-verification-20260914]
    paths:
      - '.github/workflows/sky-hydration-inspection.yml'
      - 'scripts/verify-sky-placement-hydration.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sky-hydration-inspection
  cancel-in-progress: true

jobs:
  visual-reference-candidates:
    if: github.ref == 'refs/heads/chatgpt/ci-and-sky-verification-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_SUPABASE_URL: https://visual-smoke.supabase.test
      VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:knowledge
      - run: npx playwright install --with-deps chromium
      # Candidates require visual review before adoption. This read-only job
      # cannot commit baselines or turn a release check green automatically.
      - name: Capture Linux candidates for the current merged UI
        run: npx playwright test tests/visual/visual-regression-baseline.spec.ts --workers=1 --update-snapshots
      - run: git rev-parse HEAD > test-results/visual-reference-source-sha.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: visual-reference-candidates
          path: |
            tests/visual/visual-regression-baseline.spec.ts-snapshots/*-linux.png
            test-results/
          retention-days: 3
  source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Package tracked source for isolated debugging (no credentials or runtime data)
        run: git archive --format=tar.gz -o /tmp/sky-repair-source.tar.gz HEAD
      - uses: actions/upload-artifact@v6
        with:
          name: sky-repair-source
          path: /tmp/sky-repair-source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect published guest placement cards and articles
        if: hashFiles('scripts/verify-sky-placement-hydration.mjs') != ''
        run: node scripts/verify-sky-placement-hydration.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sky-placement-browser-observation
          path: test-results/sky-placement-observation/
          if-no-files-found: ignore
          retention-days: 3

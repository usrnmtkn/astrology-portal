name: Temporary Content Studio CRUD repair

on:
  push:
    branches:
      - chatgpt/content-studio-hydration-crud-audit-stage2

permissions:
  contents: write

concurrency:
  group: temporary-content-studio-crud-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/content-studio-hydration-crud-audit-stage2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply audited repair
        run: python scripts/tmp_content_studio_hydration_crud_repair.py

      - name: Focused CRUD and hydration QA
        run: |
          node --import tsx scripts/test-content-studio-crud-hydration-guards.mjs
          node scripts/test-content-studio-hydration-reliability.mjs
          node --import tsx scripts/test-content-studio-api-roundtrip.mjs
          node scripts/test-admin-transit-source-crud.mjs
          node --import tsx scripts/test-fallback-dashboard-live-overlay.mjs
          node --import tsx scripts/test-fallback-dashboard-dynamic-natal-exact.mjs
          node --import tsx scripts/test-admin-natal-placement-preview-api.mjs
          node scripts/test-admin-natal-placement-preview-dependencies.mjs
          node scripts/test-admin-writing-surface-map.mjs
          node scripts/test-friends-chart-performance-contract.mjs

      - name: Typecheck and builds
        run: |
          npm run typecheck
          npm run build:web
          npm run build:admin

      - name: Commit repair and remove temporary runner
        run: |
          rm -f scripts/tmp_content_studio_hydration_crud_repair.py
          rm -f .github/workflows/temporary-content-studio-crud-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(content): harden Content Studio hydration and CRUD"
          git push origin HEAD:chatgpt/content-studio-hydration-crud-audit-stage2

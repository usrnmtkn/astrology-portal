name: Calendar day workbench
on:
  push:
    branches: [chatgpt/calendar-day-overview-20260913]
    paths: [.github/workflows/calendar-day-workbench.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/calendar-day-overview-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync latest main into the isolated feature branch
        run: |
          test "$GITHUB_REF" = "refs/heads/chatgpt/calendar-day-overview-20260913"
          test "$GITHUB_REPOSITORY" = "usrnmtkn/astrology-portal"
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
          git push origin HEAD:chatgpt/calendar-day-overview-20260913
          mkdir -p test-results/calendar-day-diagnostics
          git log -1 --format='TESTED_COMMIT=%H' | tee test-results/calendar-day-diagnostics/revision.txt
          git rev-list --left-right --count origin/main...HEAD | tee -a test-results/calendar-day-diagnostics/revision.txt
          git diff --check
      - run: npm ci
      - id: knowledge
        run: npm run build:knowledge
      - name: Day reading and Calendar content boundary
        if: ${{ !cancelled() && steps.knowledge.outcome == 'success' }}
        run: |
          node --import tsx scripts/test-calendar-day-reading.mts 2>&1 | tee test-results/calendar-day-diagnostics/reading.log
          node scripts/test-calendar-package-boundary.mjs 2>&1 | tee test-results/calendar-day-diagnostics/boundary.log
      - name: Shared overview regression suite
        if: ${{ !cancelled() && steps.knowledge.outcome == 'success' }}
        run: npm run test:sky-daily-summary 2>&1 | tee test-results/calendar-day-diagnostics/summary.log
      - name: Design token audits
        if: ${{ !cancelled() && steps.knowledge.outcome == 'success' }}
        run: npm run qa:css-audit 2>&1 | tee test-results/calendar-day-diagnostics/css.log
      - name: Web typecheck
        if: ${{ !cancelled() && steps.knowledge.outcome == 'success' }}
        run: npm run typecheck -w @tldr/web 2>&1 | tee test-results/calendar-day-diagnostics/typecheck.log
      - name: Install browser
        if: ${{ !cancelled() && steps.knowledge.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Fresh release build and browser verification
        if: ${{ !cancelled() && steps.knowledge.outcome == 'success' }}
        run: npx playwright test tests/visual/calendar-day-reading.spec.ts --project=chromium-desktop --retries=0 --max-failures=1 2>&1 | tee test-results/calendar-day-diagnostics/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-day-verification
          retention-days: 2
          path: |
            test-results/calendar-day-diagnostics
            test-results/calendar-day-reading
            test-results/playwright
            apps/web/src/features/calendar/CalendarDayReading.tsx
            apps/web/src/App.tsx
            apps/web/src/features/calendar/LunarCalendar.tsx
            scripts/test-calendar-package-boundary.mjs

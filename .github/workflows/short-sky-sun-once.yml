name: Verify Sky-only short Sun summaries

on:
  push:
    branches: [codex/refine-same-day-void-moon]
    paths: [.github/workflows/short-sky-sun-once.yml]

permissions:
  contents: write

jobs:
  short-sun:
    if: github.repository == 'usrnmtkn/astrology-portal' && github.ref == 'refs/heads/codex/refine-same-day-void-moon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/refine-same-day-void-moon
          fetch-depth: 1
      - name: Apply the isolated presentation change and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          helper = Path('apps/web/src/content/skySunSummaryExcerpt.ts')
          assert not helper.exists(), 'Do not overwrite an existing excerpt implementation'
          helper.write_text(dedent('''\
          let sentenceSegmenter: Intl.Segmenter | undefined;

          /** Sky uses the first two sentences; the shared source remains complete.
           * Slice the original string at sentence boundaries, never by character
           * count, and keep shorter copy unchanged. Calendar does not opt in.
           */
          export function skySunSummaryExcerpt(body: string): string {
            if (!body.trim() || typeof Intl.Segmenter !== "function") return body;
            sentenceSegmenter ??= new Intl.Segmenter("en", { granularity: "sentence" });
            let sentences = 0;
            let boundary = 0;
            for (const { segment, index } of sentenceSegmenter.segment(body)) {
              if (!segment.trim()) continue;
              if (sentences === 2) return body.slice(0, boundary).trimEnd();
              sentences += 1;
              boundary = index + segment.length;
            }
            return body;
          }
          '''))

          summary = Path('apps/web/src/content/skyDailySummary.ts')
          source = summary.read_text()
          source = 'import { skySunSummaryExcerpt } from "./skySunSummaryExcerpt";\n' + source
          old_signature = 'export function skyDailySummaryParts(facts: SkyDailySummaryFacts, content?: CmsGeneratedContentMap, { editorialPreview = false, openingOnly = false } = {}): SummaryPart[] {'
          new_signature = dedent('''\
          export type SkyDailySummaryOptions = {
            editorialPreview?: boolean;
            openingOnly?: boolean;
            sunSummaryLength?: "full" | "short";
          };

          export function skyDailySummaryParts(facts: SkyDailySummaryFacts, content?: CmsGeneratedContentMap, { editorialPreview = false, openingOnly = false, sunSummaryLength = "full" }: SkyDailySummaryOptions = {}): SummaryPart[] {
          ''').rstrip()
          assert source.count(old_signature) == 1, 'Summary signature changed; stop rather than overwrite'
          source = source.replace(old_signature, new_signature)
          old_clause = '    const clause = body === "moon" ? savedCopy(content, sourceKey, moonSummaryBody(placement.sign, moonKind), editorialPreview) : fullerClause(body, placement.sign, content, editorialPreview);'
          new_clause = '\n'.join([
              old_clause.replace('const clause =', 'const fullClause ='),
              '    // Apply the Sky excerpt before assembly normalizes sentence punctuation.',
              '    // Saved content and the verified publication cache retain the full body.',
              '    const clause = body === "sun" && sunSummaryLength === "short" ? skySunSummaryExcerpt(fullClause) : fullClause;'
          ])
          assert source.count(old_clause) == 1
          summary.write_text(source.replace(old_clause, new_clause))

          reader = Path('apps/web/src/features/sky/PublishedSkySummary.tsx')
          source = reader.read_text()
          old_call = 'children(skyDailySummaryParts({ ...facts, ...skySummaryEventFacts(events, state.content) }, state.content))'
          new_call = 'children(skyDailySummaryParts({ ...facts, ...skySummaryEventFacts(events, state.content) }, state.content, { sunSummaryLength: "short" }))'
          assert source.count(old_call) == 1, 'Published Sky call changed; stop rather than overwrite'
          reader.write_text(source.replace(old_call, new_call))

          tests = Path('scripts/test-sky-daily-summary.mts')
          source = tests.read_text()
          source = 'import { skySunSummaryExcerpt } from "../apps/web/src/content/skySunSummaryExcerpt.ts";\nimport { calendarSunSummary } from "../apps/web/src/features/calendar/calendarDaySummary.ts";\nimport { moonSummaryKey } from "../apps/web/src/content/skyMoonSummary.ts";\n' + source
          marker = 'const clauses = JSON.parse('
          assert source.count(marker) == 1
          regression = dedent('''\
          // Owner request 2026-09-24: short Sun overview in Sky, full copy in Calendar.
          // This runs before the later publication-retirement fixtures.
          {
            const shortClause = "shifts the spotlight entirely to the spaces between us. There is a sudden, collective sensitivity to friction in the air and a shared pull to bring things back to center.";
            const fullClause = `${shortClause} This season asks us all to discover what genuine symmetry actually feels like. The collective focus highlights exactly where things have grown lopsided across our schedules, our environments, and our connections, making it easier to smooth out the edges together. We are invited to prioritize beauty, collaboration, and fairness, remembering that true harmony requires everyone’s needs to carry the same weight.`;
            const sunKey = "cms/sky-daily-summary/sun/libra";
            const moonKey = moonSummaryKey("Aquarius", "regular");
            const moonClause = "brings a first thought. The second thought has space. The third thought stays in the Moon passage.";
            const content = new Map([
              [sunKey, { contentKey: sunKey, body: fullClause, status: "LIVE" }],
              [moonKey, { contentKey: moonKey, body: moonClause, status: "LIVE" }]
            ]) as Parameters<typeof skyDailySummaryParts>[1];
            const facts = {
              sun: { sign: "Libra", degree: 1 }, moon: { sign: "Aquarius", degree: 29 },
              moonIsVoid: true, voidRemainingLabel: "42 min", voidNextSign: "Pisces",
              ingresses: [{ id: "moon-pisces", label: "Moon enters Pisces" }]
            };
            const short = skyDailySummaryParts(facts, content, { sunSummaryLength: "short" });
            const full = skyDailySummaryParts(facts, content);
            const rendered = short.map(part => part.text).join("");
            assert.equal(skySunSummaryExcerpt(fullClause), shortClause);
            assert.equal(short.find(part => part.sourceKey === sunKey)?.text, shortClause);
            assert.equal(full.find(part => part.sourceKey === sunKey)?.text, fullClause);
            assert.equal(short.find(part => part.sourceKey === moonKey)?.text, moonClause);
            assert.equal(content?.get(sunKey)?.body, fullClause, "Excerpt must not mutate the saved source");
            assert.equal(short.find(part => part.action === "sun")?.text, "Sun in Libra at 1°");
            assert.ok(rendered.startsWith(`The Sun in Libra at 1° ${shortClause}`));
            assert.ok(!rendered.includes(".."), "Assembly must not add a second full stop");
            assert.ok(!rendered.includes("This season asks"));
            assert.ok(rendered.includes("The Moon is void of course for another 42 minutes, until it enters Pisces."));
            assert.ok(!rendered.includes("Moon enters Pisces today."));
            const sky = {
              generatedAt: "2026-09-23T12:00:00Z", location: { timeZone: "America/New_York" },
              positions: [{ planet: "Sun", sign: "Libra", degree: 1 }]
            } as Parameters<typeof calendarSunSummary>[0];
            const calendar = calendarSunSummary(sky, content, []);
            assert.equal(calendar.find(part => part.sourceKey === sunKey)?.text, fullClause, "Calendar must retain every sentence after Sky renders");
            assert.equal(skyDailySummaryParts(facts, content, { sunSummaryLength: "full" }).find(part => part.sourceKey === sunKey)?.text, fullClause);
            for (const body of ["", "One sentence.", "One sentence. Two sentences.", "No final full stop"]) {
              assert.equal(skySunSummaryExcerpt(body), body);
            }
            assert.equal(skySunSummaryExcerpt("Allow 3.5 hours. Start tomorrow. Keep this third sentence in Calendar."), "Allow 3.5 hours. Start tomorrow.");
            assert.equal(skySunSummaryExcerpt("Can this wait? Yes, it can! The third sentence stays in Calendar."), "Can this wait? Yes, it can!");
            assert.equal(skySunSummaryExcerpt("First sentence.\\n\\nSecond sentence.\\n\\nThird sentence."), "First sentence.\\n\\nSecond sentence.");
            const readerSource = readFileSync(new URL("../apps/web/src/features/sky/PublishedSkySummary.tsx", import.meta.url), "utf8");
            assert.ok(readerSource.includes('state.content, { sunSummaryLength: "short" }'), "The live Sky reader must opt in to the excerpt");
            console.log("Sky Sun excerpt: supplied Libra copy, unchanged Calendar/source/Moon/link/void behavior, sentence boundaries, and live reader opt-in passed.");
          }

          ''')
          tests.write_text(source.replace(marker, regression + marker))
          print('Changed only Sky Sun display, one pure helper, and regression coverage; no saved writing changed.')
          PY
          git diff --check
          git diff --stat
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check helper types and existing Sky and Calendar contracts
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc --noEmit --target ES2022 --module ESNext --moduleResolution Node --skipLibCheck apps/web/src/content/skySunSummaryExcerpt.ts
          npm run test:sky-daily-summary
          node --import tsx scripts/test-sky-summary-hydration-stability.mts
          node scripts/test-calendar-timing-event-copy.mjs
          node scripts/test-sky-placement-loading-system.mjs
      - name: Commit verified changes and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'codex/refine-same-day-void-moon'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/short-sky-sun-once.yml
          git add apps/web/src/content/skySunSummaryExcerpt.ts apps/web/src/content/skyDailySummary.ts apps/web/src/features/sky/PublishedSkySummary.tsx scripts/test-sky-daily-summary.mts
          git diff --cached --check
          git commit -m 'Shorten Sky Sun overview to two sentences without changing Calendar copy'
          git push origin HEAD:refs/heads/codex/refine-same-day-void-moon

name: Validate proposed Sun Friends transits

on:
  push:
    branches:
      - chatgpt/friends-transit-sun-proposed-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/friends-transit-sun-proposed-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Bind proposal hashes to exact current copy
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";
          const path = "packages/astro-knowledge/review/transit-aspect-friends-sun-proposed-v1.json";
          const proposal = JSON.parse(await readFile(path, "utf8"));
          for (const record of proposal.records) {
            record.body_they_sha256 = createHash("sha256").update(record.body_they).digest("hex");
          }
          await writeFile(path, `${JSON.stringify(proposal, null, 2)}\n`);
          NODE
      - name: Validate independent Sun Friends proposal
        run: node scripts/test-transit-friends-sun-proposed-v1.mjs
      - name: Verify repository diff
        run: git diff --check
      - name: Commit validated hash binding and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-friends-transit-sun-proposed.yml
          git add packages/astro-knowledge/review/transit-aspect-friends-sun-proposed-v1.json scripts/test-transit-friends-sun-proposed-v1.mjs
          git commit -m "content(friends): validate proposed Sun transit batch"
          git push origin HEAD:chatgpt/friends-transit-sun-proposed-v1

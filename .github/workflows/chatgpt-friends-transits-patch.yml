name: ChatGPT Friends Transits Patch

on:
  push:
    branches:
      - chatgpt/friends-transits-brief-20260905

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Friends transits cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          repo = Path('.')

          priority_path = repo / 'apps/web/src/features/friends/friendHouseTransitPriority.ts'
          priority_path.write_text('''const FRIEND_HOUSE_TRANSIT_SIGNIFICANCE_TIERS: Record<string, number> = {\n  pluto: 0,\n  neptune: 0,\n  uranus: 0,\n  chiron: 0,\n  saturn: 0,\n  jupiter: 1,\n  "north-node": 1,\n  "south-node": 1,\n  mars: 2,\n  lilith: 2,\n  sun: 3,\n  venus: 3,\n  mercury: 3,\n  moon: 4\n};\n\nfunction normalizedKeyPart(value: string) {\n  return value.trim().toLowerCase().replace(/\\s+/gu, "-");\n}\n\nexport function friendHouseTransitSignificanceTier(planet: string) {\n  return FRIEND_HOUSE_TRANSIT_SIGNIFICANCE_TIERS[normalizedKeyPart(planet)] ?? 3;\n}\n\nexport function rankFriendHouseTransitActivations<T extends { house: number; planet: string }>(activations: T[]) {\n  return [...activations].sort((first, second) => {\n    const tierDelta = friendHouseTransitSignificanceTier(first.planet)\n      - friendHouseTransitSignificanceTier(second.planet);\n\n    if (tierDelta !== 0) return tierDelta;\n\n    const firstAngular = [1, 4, 7, 10].includes(first.house) ? 0 : 1;\n    const secondAngular = [1, 4, 7, 10].includes(second.house) ? 0 : 1;\n\n    return firstAngular - secondAngular || first.house - second.house;\n  });\n}\n''')

          brief_path = repo / 'apps/web/src/features/friends/friendTransitsBrief.ts'
          brief_path.write_text('''type DetailAvailability = { detailAvailable: boolean };\n\ntype PersonalTransitGroup<T extends DetailAvailability> = {\n  key: "short" | "long";\n  transits: T[];\n};\n\nexport function buildFriendTransitsBriefState<\n  TPersonalTransit extends DetailAvailability,\n  THouseTransit extends DetailAvailability\n>({\n  personalTransitGroups,\n  houseTransits,\n  bondTransitCount,\n  hasDailyForecast,\n  dailyDoCount,\n  dailyDontCount,\n  hasActivePattern\n}: {\n  personalTransitGroups: PersonalTransitGroup<TPersonalTransit>[];\n  houseTransits: THouseTransit[];\n  bondTransitCount: number;\n  hasDailyForecast: boolean;\n  dailyDoCount: number;\n  dailyDontCount: number;\n  hasActivePattern: boolean;\n}) {\n  const visiblePersonalTransitGroups = personalTransitGroups.map((group) => ({\n    ...group,\n    transits: group.transits.filter((transit) => transit.detailAvailable)\n  }));\n  const visibleHouseTransits = houseTransits.filter((transit) => transit.detailAvailable);\n  const shortTermTransits = visiblePersonalTransitGroups.find((group) => group.key === "short")?.transits ?? [];\n  const longTermTransits = visiblePersonalTransitGroups.find((group) => group.key === "long")?.transits ?? [];\n  const personalTransitCount = shortTermTransits.length + longTermTransits.length;\n\n  return {\n    visibleHouseTransits,\n    shortTermTransits,\n    longTermTransits,\n    hasDailyGuidance: dailyDoCount === 3 && dailyDontCount === 3,\n    hasAnyTransit: hasDailyForecast\n      || personalTransitCount > 0\n      || visibleHouseTransits.length > 0\n      || bondTransitCount > 0\n      || hasActivePattern\n  };\n}\n''')

          app_path = repo / 'apps/web/src/App.tsx'
          app = app_path.read_text()
          old_targets = '''function natalTransitTargets(natalSky: SkySnapshot) {\n  if (typeof natalSky.ascendantLongitude !== "number") {\n    return natalSky.positions;\n  }\n\n  return [\n    ...natalSky.positions,\n    positionFromLongitude({\n      planet: "Ascendant",\n      glyph: pointGlyph("Ascendant"),\n      longitude: natalSky.ascendantLongitude\n    }),\n    positionFromLongitude({\n      planet: "Descendant",\n      glyph: pointGlyph("Descendant"),\n      longitude: natalSky.ascendantLongitude + 180\n    })\n  ];\n}\n'''
          new_targets = '''function natalTransitTargets(natalSky: SkySnapshot) {\n  const targets = [...natalSky.positions];\n\n  if (typeof natalSky.ascendantLongitude === "number") {\n    targets.push(\n      positionFromLongitude({\n        planet: "Ascendant",\n        glyph: pointGlyph("Ascendant"),\n        longitude: natalSky.ascendantLongitude\n      }),\n      positionFromLongitude({\n        planet: "Descendant",\n        glyph: pointGlyph("Descendant"),\n        longitude: natalSky.ascendantLongitude + 180\n      })\n    );\n  }\n\n  if (typeof natalSky.midheavenLongitude === "number") {\n    targets.push(\n      positionFromLongitude({\n        planet: "Midheaven",\n        glyph: "MC",\n        longitude: natalSky.midheavenLongitude\n      }),\n      positionFromLongitude({\n        planet: "Imum Coeli",\n        glyph: "IC",\n        longitude: natalSky.midheavenLongitude + 180\n      })\n    );\n  }\n\n  return targets;\n}\n'''
          if old_targets not in app:
            raise SystemExit('natalTransitTargets source did not match expected main')
          app = app.replace(old_targets, new_targets, 1)

          old_timing = '''  if (point === "Midheaven") {\n    return "mc";\n  }\n\n  if (point === "North Node" || point === "True Node") {'''
          new_timing = '''  if (point === "Midheaven") {\n    return "mc";\n  }\n\n  if (point === "Imum Coeli" || point === "IC") {\n    return "ic";\n  }\n\n  if (point === "North Node" || point === "True Node") {'''
          if old_timing not in app:
            raise SystemExit('timingTargetName source did not match expected main')
          app = app.replace(old_timing, new_timing, 1)
          app_path.write_text(app)

          panel_path = repo / 'apps/web/src/features/friends/ManualChartsPanel.tsx'
          panel = panel_path.read_text()
          import_anchor = 'import { selectEligibleFriendTransits } from "./friendTransitEligibility";\n'
          if import_anchor not in panel:
            raise SystemExit('ManualChartsPanel import anchor missing')
          panel = panel.replace(
            import_anchor,
            import_anchor + 'import { rankFriendHouseTransitActivations } from "./friendHouseTransitPriority";\n',
            1
          )
          old_house = '''    return currentSkyHouseActivations(currentSky, selectedFriendReadyNatalChart)\n      .slice(0, 4)'''
          new_house = '''    return rankFriendHouseTransitActivations(\n      currentSkyHouseActivations(currentSky, selectedFriendReadyNatalChart)\n    )\n      .slice(0, 4)'''
          if old_house not in panel:
            raise SystemExit('Friends house transit selection source did not match expected main')
          panel = panel.replace(old_house, new_house, 1)
          panel_path.write_text(panel)

          tab_path = repo / 'apps/web/src/features/friends/FriendTransitsTab.tsx'
          tab = tab_path.read_text()
          tab_import_anchor = 'import { NatalAspectPatternActivationsSection } from "../you/NatalAspectPatternsSection";\n'
          if tab_import_anchor not in tab:
            raise SystemExit('FriendTransitsTab import anchor missing')
          tab = tab.replace(
            tab_import_anchor,
            tab_import_anchor + 'import { buildFriendTransitsBriefState } from "./friendTransitsBrief";\n',
            1
          )
          state_start = tab.index('  const visiblePersonalTransitGroups = personalTransitGroups.map')
          state_end_marker = '  const hasDailyGuidance = dailyDoItems.length === 3 && dailyDontItems.length === 3;\n'
          state_end = tab.index(state_end_marker, state_start) + len(state_end_marker)
          new_state = '''  const {\n    visibleHouseTransits,\n    shortTermTransits,\n    longTermTransits,\n    hasAnyTransit,\n    hasDailyGuidance\n  } = buildFriendTransitsBriefState({\n    personalTransitGroups,\n    houseTransits,\n    bondTransitCount: bondTransits.length,\n    hasDailyForecast: Boolean(dailyForecast),\n    dailyDoCount: dailyDoItems.length,\n    dailyDontCount: dailyDontItems.length,\n    hasActivePattern: patternItems.some((item) => Boolean(item.activationCopy))\n  });\n'''
          tab = tab[:state_start] + new_state + tab[state_end:]

          daily_start = tab.index('        {dailyForecast ? (')
          bond_start = tab.index('        {bondTransits.length > 0 && (', daily_start)
          daily_segment = tab[daily_start:bond_start]
          tab = tab[:daily_start] + tab[bond_start:]

          bond_start = tab.index('        {bondTransits.length > 0 && (')
          short_start = tab.index('        {shortTermTransits.length > 0 ? (', bond_start)
          bond_segment = tab[bond_start:short_start]
          tab = tab[:bond_start] + tab[short_start:]

          house_start = tab.index('        {visibleHouseTransits.length > 0 && (')
          tab = tab[:house_start] + bond_segment + tab[house_start:]

          long_start = tab.index('        {longTermTransits.length > 0 ? (')
          tab = tab[:long_start] + daily_segment + tab[long_start:]
          tab_path.write_text(tab)

          test_path = repo / 'scripts/test-friends-transits-prioritization.mjs'
          test_path.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport path from "node:path";\nimport { fileURLToPath } from "node:url";\n\nconst repoRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");\nconst read = (relativePath) => fs.readFileSync(path.join(repoRoot, relativePath), "utf8");\n\nconst app = read("apps/web/src/App.tsx");\nconst panel = read("apps/web/src/features/friends/ManualChartsPanel.tsx");\nconst tab = read("apps/web/src/features/friends/FriendTransitsTab.tsx");\nconst housePriority = read("apps/web/src/features/friends/friendHouseTransitPriority.ts");\nconst brief = read("apps/web/src/features/friends/friendTransitsBrief.ts");\n\nassert.match(app, /planet: "Midheaven"[\\s\\S]*longitude: natalSky\\.midheavenLongitude/);\nassert.match(app, /planet: "Imum Coeli"[\\s\\S]*longitude: natalSky\\.midheavenLongitude \\+ 180/);\nassert.match(app, /point === "Imum Coeli" \\|\\| point === "IC"[\\s\\S]*return "ic"/);\nassert.match(panel, /rankFriendHouseTransitActivations\\([\\s\\S]*currentSkyHouseActivations\\(currentSky, selectedFriendReadyNatalChart\\)[\\s\\S]*\\.slice\\(0, 4\\)/);\nassert.match(housePriority, /pluto: 0/);\nassert.match(housePriority, /saturn: 0/);\nassert.match(housePriority, /jupiter: 1/);\nassert.match(housePriority, /moon: 4/);\nassert.match(brief, /detailAvailable/);\nassert.match(brief, /hasDailyGuidance: dailyDoCount === 3 && dailyDontCount === 3/);\n\nconst shortIndex = tab.indexOf('{shortTermTransits.length > 0');\nconst bondIndex = tab.indexOf('{bondTransits.length > 0');\nconst houseIndex = tab.indexOf('{visibleHouseTransits.length > 0');\nconst dailyIndex = tab.indexOf('{dailyForecast ?');\nconst longIndex = tab.indexOf('{longTermTransits.length > 0');\nassert.ok(shortIndex >= 0 && bondIndex > shortIndex, "Active-for transits should lead relationship context");\nassert.ok(houseIndex > bondIndex, "House context should follow relationship context");\nassert.ok(dailyIndex > houseIndex, "Daily guidance should support, not outrank, prioritized transits");\nassert.ok(longIndex > dailyIndex, "Longer cycles should remain after daily context");\n\nconsole.log("Friends transits prioritization contract passed.");\n''')
          PY

          node scripts/test-friends-transits-prioritization.mjs

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx \
            apps/web/src/features/friends/ManualChartsPanel.tsx \
            apps/web/src/features/friends/FriendTransitsTab.tsx \
            apps/web/src/features/friends/friendHouseTransitPriority.ts \
            apps/web/src/features/friends/friendTransitsBrief.ts \
            scripts/test-friends-transits-prioritization.mjs
          git commit -m "Improve Friends transit prioritization"
          git push origin HEAD:chatgpt/friends-transits-brief-20260905

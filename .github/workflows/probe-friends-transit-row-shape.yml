name: Probe Friends transit row shape

on:
  push:
    branches:
      - chatgpt/friends-transits-complete-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/friends-transits-complete-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print representative authored-card shapes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = JSON.parse(fs.readFileSync('apps/web/src/content/fallbackArchitectureV3/source-rows/transit-synastry-rows-v1.json','utf8'));
          for (const key of [
            'authored/transit-aspect/chiron/ascendant/hard',
            'authored/transit-aspect/venus/moon/hard',
            'authored/transit-aspect/sun/ascendant/hard'
          ]) {
            const row = source.authoredCards.find((item) => item.contentKey === key);
            if (!row) throw new Error(`missing ${key}`);
            console.log(`\n### ${key}`);
            console.log(JSON.stringify({
              keys: Object.keys(row).sort(),
              contentKey: row.contentKey,
              body_you: row.body_you,
              body_you_revision: row.body_you_revision,
              body_they: row.body_they,
              body_they_review_status: row.body_they_review_status,
              body_they_sha256: row.body_they_sha256,
              body_they_approved_via: row.body_they_approved_via,
              body_they_authorship: row.body_they_authorship,
              body_they_name_variable: row.body_they_name_variable,
              body_they_sourceMechanism: row.body_they_sourceMechanism,
              body_they_approval: row.body_they_approval,
              approval: row.approval,
              approved_via: row.approved_via,
              review_status: row.review_status,
              content_role: row.content_role
            }, null, 2));
          }
          NODE

name: API tests

on:
  pull_request:
    paths:
      - "services/tldrastro-api/**"
      - ".github/workflows/api-tests.yml"
  push:
    branches:
      - main
    paths:
      - "services/tldrastro-api/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-ephemeris-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/tldrastro-api
    env:
      TLDR_ASTRO_TEST_EPHEMERIS_ENGINES: moshier,swiss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/tldrastro-api/pyproject.toml
      - name: Install pinned API dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run API suite
        run: python -m pytest

name: Apply verified report repair on isolated branch
on:
  push:
    branches: [fix/report-reader-contract-20260916]
    paths: [.report-repair-transfer/**, .github/workflows/apply-verified-report-repair.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'usrnmtkn/astrology-portal' && github.ref == 'refs/heads/fix/report-reader-contract-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify pinned patch and apply only to the repair branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 9a4a2218ef50288502e6403c6544d67fda50f375
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          text = ''.join(Path(f'.report-repair-transfer/{i}.txt').read_text().strip() for i in range(1,5))
          patch = gzip.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '9f75b8ff3a61156c4fce047337feb69a39898b4c1d0a06bf679003186b5760eb'
          allowed = {
            '.github/workflows/report-reader-contract.yml',
            'api/_lib/friend-report-lifecycle.ts', 'api/_lib/friend-transit-reading-generation.ts',
            'api/_lib/friend-transit-reading.ts', 'api/_lib/report-provider-schema.ts',
            'api/_lib/transit-reading-aspect-claims.ts', 'api/_lib/transit-reading-checkpoints.ts',
            'api/_lib/transit-reading-generation.ts', 'api/_lib/transit-reading-judge.ts',
            'api/_lib/transit-reading-reader-copy.ts', 'api/_lib/transit-reading-revision.ts',
            'api/_lib/you-report-lifecycle.ts', 'api/_lib/you-transit-reading-generation.ts',
            'api/_lib/you-transit-reading.ts', 'scripts/test-report-reader-contract.mts',
            'scripts/test-transit-reading-checkpoints.mts', 'scripts/test-transit-report-delivery.mjs'
          }
          touched = {line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')}
          assert touched == allowed, touched ^ allowed
          Path(os.environ['RUNNER_TEMP'], 'verified-report.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/verified-report.patch"
          git apply "$RUNNER_TEMP/verified-report.patch"
          git diff --check
          git rm .report-repair-transfer/{1,2,3,4}.txt .github/workflows/apply-verified-report-repair.yml
          git add .github/workflows/report-reader-contract.yml api/_lib/friend-report-lifecycle.ts api/_lib/friend-transit-reading-generation.ts api/_lib/friend-transit-reading.ts api/_lib/report-provider-schema.ts api/_lib/transit-reading-aspect-claims.ts api/_lib/transit-reading-checkpoints.ts api/_lib/transit-reading-generation.ts api/_lib/transit-reading-judge.ts api/_lib/transit-reading-reader-copy.ts api/_lib/transit-reading-revision.ts api/_lib/you-report-lifecycle.ts api/_lib/you-transit-reading-generation.ts api/_lib/you-transit-reading.ts scripts/test-report-reader-contract.mts scripts/test-transit-reading-checkpoints.mts scripts/test-transit-report-delivery.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(reports): align reader validation and targeted correction; guard persistence'
          test "$(git ls-remote origin refs/heads/fix/report-reader-contract-20260916 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/fix/report-reader-contract-20260916

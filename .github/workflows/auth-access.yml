name: Diagnostic admin baseline control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-font-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          fc-match system-ui
          fc-match sans-serif
          dpkg-query -W fonts-dejavu-core
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
      volumes:
        - /usr/share/fonts:/usr/share/fonts/runner:ro
    strategy:
      fail-fast: false
      matrix:
        source:
          - da33275eb019731ccaf946b6e1fbeb9e35896cd3
          - 750bac580695214d734d72a41d5ab96bb089b6dc
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      VITE_SUPABASE_URL: https://visual-smoke.supabase.test
      VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder
      EXPECTED_SOURCE: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/source"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: |
          fc-cache -f
          fc-match system-ui
      - run: npm ci
      - run: npm run build:knowledge
      - run: |
          cp ../harness/scripts/ci-validate-playwright-image.mjs scripts/qa-ci-validate-playwright-image.mjs
          node scripts/qa-ci-validate-playwright-image.mjs
      - run: node ../harness/scripts/qa-admin-baseline-control.mjs
      - name: Capture existing admin case only
        run: npx playwright test -c playwright.config.ts tests/visual/visual-regression-baseline.spec.ts --grep 'admin dashboard surfaces match baseline' --workers=1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: admin-control-${{ matrix.source }}
          path: source/test-results/playwright/**/admin-*

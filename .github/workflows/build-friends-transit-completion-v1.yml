name: Build complete Friends transit corpus

on:
  push:
    branches:
      - chatgpt/friends-transits-complete-v1

permissions:
  contents: write

jobs:
  build-corpus:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/friends-transits-complete-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply pre-build authoring corrections
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/build-friends-transit-completion-v1.mjs')
          s = p.read_text()
          replacements = {
            'any: "This transit",': 'any: "this transit",',
            '"north-node": "an unfamiliar direction asking for a first attempt",': '"north-node": "an unfamiliar direction pulling them toward a first attempt",',
            'domain: "an unfamiliar direction, role, or habit that asks them to develop something they cannot already do automatically",': 'domain: "an unfamiliar direction, role, or habit that requires them to develop something they cannot already do automatically",',
            '"The day gives {{Name}} more room to use %EFFECT% well, especially if they attach the good feeling or useful timing to a specific next step.",': '"The day makes %EFFECT% easier for {{Name}} to use well, especially if they attach the good feeling or useful timing to a specific next step.",'
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing expected generator text: {old}')
            s = s.replace(old, new)

          old = '''  const mechanism = sentence(pick(mechanismPool, seed, 3), { EFFECT: effect });
          const action = pick(targetData.actions, seed, 4);
          const bridge = sentence(pick(bridgeOpeners, seed, 5), {
            PLANET: pLabel,
            TARGET: label[canonicalTarget],
            ACTION: action
          });

          return `${opener} ${scene} ${mechanism}\\n\\n${bridge}`;'''
          new = '''  const mechanism = sentence(pick(mechanismPool, seed, 3), { EFFECT: effect });
          const action = pick(targetData.actions, seed, 4);
          const variantCode = parts[5] ?? null;
          const variantTemplates = {
            "variant-A": [
              "Around their %TARGET%, the first response matters less than what they notice once the immediate reaction settles.",
              "Their %TARGET% becomes easier to read after the first reaction drops enough for the practical issue to separate from it."
            ],
            "variant-B": [
              "With their %TARGET%, the useful distinction is between what changed and the meaning the first reaction attached to it.",
              "Their %TARGET% gives them a clearer clue once they compare the immediate reaction with what is still true an hour later."
            ],
            "variant-C": [
              "For their %TARGET%, they do not need to settle the whole issue before the next concrete step becomes clear.",
              "Their %TARGET% benefits from a second look because the first emotional meaning is not the only one available."
            ],
            "variant-D": [
              "Around their %TARGET%, the better test is what still matters after the immediate charge has dropped.",
              "Their %TARGET% becomes more useful as information once the first burst of urgency is no longer choosing the scale of the problem."
            ],
            "variant-E": [
              "With their %TARGET%, the opening is worth using if it still improves the day after the first burst of enthusiasm passes.",
              "Their %TARGET% gets the most from the option that still looks useful after the initial lift or relief settles."
            ]
          };
          const variantPool = variantCode ? variantTemplates[variantCode] : null;
          const variantNote = variantPool
            ? sentence(pick(variantPool, seed, 6), { TARGET: label[canonicalTarget] })
            : "";
          const bridge = sentence(pick(bridgeOpeners, seed, 5), {
            PLANET: pLabel,
            TARGET: label[canonicalTarget],
            ACTION: action
          });

          return `${opener} ${scene} ${mechanism}${variantNote ? ` ${variantNote}` : ""}\\n\\n${bridge}`;'''
          if old not in s:
            raise SystemExit('missing buildBody block for variant authoring patch')
          s = s.replace(old, new)
          p.write_text(s)
      - name: Build 351-row Friends packet
        run: node scripts/build-friends-transit-completion-v1.mjs
      - name: Validate 378-row Friends corpus
        run: node scripts/test-friends-transit-completion-v1.mjs
      - name: Print representative family samples
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packet = JSON.parse(fs.readFileSync('packages/astro-knowledge/review/transit-aspect-friends-completion-v1.json', 'utf8'));
          const seen = new Set();
          for (const row of packet.records) {
            const family = row.contentKey.split('/')[2];
            if (seen.has(family)) continue;
            seen.add(family);
            console.log(`\n### ${family}: ${row.contentKey}\n${row.body_they}\n`);
          }
          NODE
      - name: Verify diff
        run: git diff --check
      - name: Commit validated corpus and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/build-friends-transit-completion-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content(friends): stage complete independent transit corpus"
          git push origin HEAD:chatgpt/friends-transits-complete-v1

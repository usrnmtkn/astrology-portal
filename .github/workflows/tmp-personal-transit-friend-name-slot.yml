name: Temporary Personal Transit friend-name slot patch

on:
  push:
    branches:
      - fix/personal-transit-friend-name-slot

permissions:
  contents: write

jobs:
  patch-build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Personal Transit friend-name slot patch
        run: python .tmp/apply_personal_transit_name_slot.py
      - name: Rebuild shipped fallback browser artifact
        run: npx esbuild apps/web/src/content/fallbackArchitectureV3/resolver/index.browser.ts --bundle --format=esm --outfile=apps/web/src/content/fallbackArchitectureV3/dist/tldr-content.js
      - name: Refresh fallback package manifests
        run: npm run build:fallback-manifest
      - name: Run targeted contracts
        run: |
          node scripts/test-content-approval-governance.mjs
          node scripts/test-content-studio-transit-friend-editor.mjs
          node scripts/test-transit-fallback-friend-name-slot.mjs
          node scripts/test-fallback-package-cache-contract.mjs
          node scripts/test-sky-personalized-transit-composition.mjs
          node scripts/test-sky-placement-regressions.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build admin
        run: npm run build:admin
      - name: Build web
        run: npm run build:web
      - name: Commit source and generated changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-personal-transit-friend-name-slot.yml .tmp/apply_personal_transit_name_slot.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: allow friend names in personal transit fallback hooks"
          git push origin HEAD:${GITHUB_REF_NAME}

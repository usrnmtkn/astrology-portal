name: Apply verified monthly implementation
on:
  push:
    branches: [chatgpt/monthly-template-ai-writer-v1]
    paths: [.github/workflows/monthly-authoring-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/monthly-template-ai-writer-v1
          fetch-depth: 0
      - name: Verify exact transfer and unchanged application base
        run: |
          test "$GITHUB_REF" = refs/heads/chatgpt/monthly-template-ai-writer-v1
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, lzma
          baseline = '1c204aeb74c9894c7b4616cf0e1149fe68304ea5'
          hashes = ['14cf0f927aae8b4f58c8100bd7f0a8c1fb945e055e9a0083dac47605a5edaa64', '6248033a2575a222848737183f55ec8eb33bee1088665f7564ad96b102b3d6d3', '5d14ac353863771e316526ebd3d3967ca556efc868ec6098dbc91ad23dc52750', 'cb0918869f3ca596209bc32a6cab083fc35d858a55589342ae688f37c26d2573', '49d0ef913866a3ac6d0342c985fc4f65a18625ea476a61ff563ceff089d3492d']
          paths = [f'.github/monthly-authoring-transfer/part{i}.b64' for i in range(1, 6)]
          allowed = set(paths + ['.github/workflows/monthly-authoring-apply.yml'])
          changed = subprocess.check_output(['git', 'diff', '--name-only', baseline, 'HEAD'], text=True).splitlines()
          if set(changed) != allowed:
              raise SystemExit('Application base changed; refusing to apply over concurrent work: ' + repr(changed))
          parts = []
          for path, expected in zip(paths, hashes):
              raw = pathlib.Path(path).read_bytes()
              actual = hashlib.sha256(raw).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Transfer hash mismatch: {path}: {actual}')
              parts.append(raw)
          compressed = base64.b64decode(b''.join(parts), validate=True)
          if hashlib.sha256(compressed).hexdigest() != '9ea18bcbf85ff23ab31cb5f299bd5c021d7338374cc843728a24dbef8ab30df7':
              raise SystemExit('Compressed patch integrity failure')
          pathlib.Path('/tmp/monthly.patch').write_bytes(lzma.decompress(compressed))
          print('Five transfer parts and application base verified.')
          PY
          git apply --check /tmp/monthly.patch
          git apply /tmp/monthly.patch
      - name: Commit implementation and remove temporary transfer files
        run: |
          rm -r .github/monthly-authoring-transfer
          rm .github/workflows/monthly-authoring-apply.yml
          git add -- .github/monthly-authoring-transfer .github/workflows/monthly-authoring-apply.yml .github/workflows/monthly-template-dev-snapshot.yml .github/workflows/monthly-writing.yml api/_lib/content-generation.ts api/_lib/monthly-authoring-storage.ts api/_lib/monthly-template-facts.ts api/_lib/monthly-writing-memory.ts api/admin/generated-content.ts api/admin/monthly-writing.ts apps/admin/src/GeneratedContentAdminDashboard.tsx apps/admin/src/MonthlyTemplateStudio.tsx apps/admin/src/SkyForecastTemplateStudio.tsx apps/web/src/content/contentStudioSourceRole.ts apps/web/src/content/generatedContentEligibility.ts docs/qa/monthly-template-authoring.md package.json playwright.monthly-writing.config.ts scripts/test-monthly-template.mts scripts/test-monthly-writing-api.mts scripts/test-monthly-writing-facts.mts scripts/test-monthly-writing-generator.mts src/monthly-writing/model.ts src/monthly-writing/starter.ts src/monthly-writing/template.ts tests/helpers/monthly-writing-api.mts tests/monthly-writing/fixtures.ts tests/visual/monthly-template-writing.spec.ts vercel.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add memory-supported monthly sentence-template authoring'
          git push origin HEAD:refs/heads/chatgpt/monthly-template-ai-writer-v1
          git show --stat --oneline HEAD

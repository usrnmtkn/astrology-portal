name: ChatGPT Friends Paid Reading UX

on:
  push:
    branches:
      - chatgpt/friends-paid-reading-ux-20260906

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/friends-paid-reading-ux-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply paid-reading UX and error sanitization
        run: |
          python - <<'PY'
          from pathlib import Path

          # Client orchestration: never retain raw provider errors in reader state.
          path = Path('apps/web/src/features/friends/ManualChartsPanel.tsx')
          source = path.read_text()
          source = source.replace(
              '  const [friendTransitReadingStatus, setFriendTransitReadingStatus] = useState<"idle" | "loading" | "ready" | "error">("idle");\n  const [friendTransitReadingError, setFriendTransitReadingError] = useState<string | null>(null);\n',
              '  const [friendTransitReadingStatus, setFriendTransitReadingStatus] = useState<"idle" | "loading" | "ready" | "locked">("idle");\n',
              1
          )
          source = source.replace('    setFriendTransitReadingError(null);\n', '', 2)
          old_catch = '''    } catch (error) {\n      if (friendTransitReadingSelectionKeyRef.current !== requestSelectionKey) return;\n      setFriendTransitReading(null);\n      setFriendTransitReadingStatus("error");\n      setFriendTransitReadingError(error instanceof Error ? error.message : "The short reading could not be generated.");\n    }\n'''
          new_catch = '''    } catch {\n      if (friendTransitReadingSelectionKeyRef.current !== requestSelectionKey) return;\n      setFriendTransitReading(null);\n      setFriendTransitReadingStatus("locked");\n    }\n'''
          if old_catch not in source:
              raise SystemExit('ManualChartsPanel friend reading catch block not found')
          source = source.replace(old_catch, new_catch, 1)
          source = source.replace('              readingError={friendTransitReadingError}\n', '', 1)
          if 'friendTransitReadingError' in source:
              raise SystemExit('Raw friend reading error state still exists')
          path.write_text(source)

          # Reader card: paid-product framing, polished CTA, no failure/provider language.
          path = Path('apps/web/src/features/friends/FriendTransitsTab.tsx')
          source = path.read_text()
          source = source.replace('  readingError,\n', '', 1)
          source = source.replace('  readingError?: string | null;\n', '', 1)
          source = source.replace('  readingStatus?: "idle" | "loading" | "ready" | "error";\n', '  readingStatus?: "idle" | "loading" | "ready" | "locked";\n', 1)
          old_card = '''          <article className="friends-logic-card friend-transit-reading" aria-label={`What's going on with ${friendName} right now?`}>\n            <span>Right now</span>\n            <h3>{`What's going on with ${friendName} right now?`}</h3>\n            {readingStatus === "ready" && reading ? (\n              <>\n                {reading.summary ? <p>{reading.summary}</p> : null}\n                {reading.body.split(/\\n{2,}/u).filter(Boolean).map((paragraph) => <p key={paragraph}>{paragraph}</p>)}\n              </>\n            ) : readingStatus === "loading" ? (\n              <p role="status">Putting {friendName}&apos;s current transits together…</p>\n            ) : readingStatus === "error" ? (\n              <>\n                <p>{readingError || "The short reading could not be generated. The transit details below are still available."}</p>\n                <button className="button secondary" onClick={onGenerateReading} type="button">Try again</button>\n              </>\n            ) : (\n              <>\n                <p>Pull the current transit picture into one short reading without changing the astrology underneath it.</p>\n                <button className="button secondary" onClick={onGenerateReading} type="button">Give me the short version</button>\n              </>\n            )}\n          </article>\n'''
          new_card = '''          <article className="friends-logic-card friend-transit-reading" aria-label={`What's going on with ${friendName} right now?`}>\n            <div className="friend-transit-reading__topline">\n              <span>Right now</span>\n              <span className="friend-transit-reading__premium">Paid reading</span>\n            </div>\n            <h3>{`What's going on with ${friendName} right now?`}</h3>\n            {readingStatus === "ready" && reading ? (\n              <>\n                {reading.summary ? <p>{reading.summary}</p> : null}\n                {reading.body.split(/\\n{2,}/u).filter(Boolean).map((paragraph) => <p key={paragraph}>{paragraph}</p>)}\n              </>\n            ) : readingStatus === "loading" ? (\n              <p role="status">Preparing {friendName}&apos;s reading…</p>\n            ) : readingStatus === "locked" ? (\n              <>\n                <p>This is a paid reading. Purchase access to unlock a personalized summary of {friendName}&apos;s current transits.</p>\n                <button className="friend-transit-reading__cta" onClick={onGenerateReading} type="button">Unlock this reading</button>\n              </>\n            ) : (\n              <>\n                <p>A concise, personalized synthesis of the strongest themes active for {friendName} right now.</p>\n                <button className="friend-transit-reading__cta" onClick={onGenerateReading} type="button">Unlock this reading</button>\n              </>\n            )}\n          </article>\n'''
          if old_card not in source:
              raise SystemExit('FriendTransitsTab reading card block not found')
          source = source.replace(old_card, new_card, 1)
          path.write_text(source)

          # Server: keep provider detail in logs, never send it to Friends readers.
          path = Path('api/generate-user-content.ts')
          source = path.read_text()
          source = source.replace(
              'export default async function handler(req: IncomingMessage, res: ServerResponse) {\n',
              'export default async function handler(req: IncomingMessage, res: ServerResponse) {\n  let requestSubjectType: UserContentSubjectType | null = null;\n',
              1
          )
          source = source.replace(
              '    const input = await readJsonBody(req);\n',
              '    const input = await readJsonBody(req);\n    requestSubjectType = input.subjectType;\n',
              1
          )
          old_generic = '''    console.error("generate-user-content failed", error);\n    sendJson(res, 500, {\n      ok: false,\n      error: error instanceof Error ? error.message : "Unknown personalized generation error."\n    });\n'''
          new_generic = '''    console.error("generate-user-content failed", error);\n    sendJson(res, 500, {\n      ok: false,\n      errorType: requestSubjectType === "friend_transit_reading" ? "paid_reading_unavailable" : "generation_error",\n      error: requestSubjectType === "friend_transit_reading"\n        ? "This paid reading is currently unavailable."\n        : error instanceof Error ? error.message : "Unknown personalized generation error."\n    });\n'''
          if old_generic not in source:
              raise SystemExit('Generic generation error response not found')
          source = source.replace(old_generic, new_generic, 1)
          path.write_text(source)

          # Visual polish without moving the card yet.
          path = Path('apps/web/src/styles/friends.css')
          source = path.read_text()
          anchor = '''.friend-transits-stage .friends-logic-card {\n  padding: var(--surface-card-padding);\n}\n'''
          addition = '''.friend-transits-stage .friends-logic-card {\n  padding: var(--surface-card-padding);\n}\n\n.friend-transit-reading {\n  gap: var(--space-4);\n}\n\n.friend-transit-reading__topline {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: var(--space-3);\n}\n\n.friend-transit-reading__premium {\n  display: inline-flex;\n  align-items: center;\n  min-height: 28px;\n  border: var(--border-width-thin) solid var(--card-border);\n  border-radius: var(--radius-pill);\n  padding: 0 var(--space-3);\n  color: var(--card-meta-color);\n  font-family: var(--font-ui);\n  font-size: var(--text-section-label-size);\n  font-weight: var(--weight-semibold);\n  letter-spacing: var(--tracking-label);\n  text-transform: uppercase;\n}\n\n.friend-transit-reading__cta {\n  justify-self: start;\n  min-height: 44px;\n  border: 0;\n  border-radius: var(--radius-pill);\n  padding: 0 var(--space-6);\n  background: var(--ink);\n  color: var(--surface);\n  font-family: var(--font-ui);\n  font-size: var(--text-button-size);\n  font-weight: var(--weight-medium);\n  line-height: var(--leading-label);\n  cursor: pointer;\n}\n\n.friend-transit-reading__cta:hover {\n  opacity: 0.86;\n}\n\n.friend-transit-reading__cta:focus-visible {\n  outline: 2px solid var(--ink);\n  outline-offset: 2px;\n}\n'''
          if anchor not in source:
              raise SystemExit('Friends transit card CSS anchor not found')
          source = source.replace(anchor, addition, 1)
          path.write_text(source)

          # Regression: paid framing + no raw failure/provider text.
          path = Path('scripts/test-friend-transit-reading-request-render.mjs')
          source = path.read_text()
          source = source.replace(
              'assert.match(apiSource, /input\\.allowQualityFallback = false/u);\n',
              'assert.match(apiSource, /input\\.allowQualityFallback = false/u);\nassert.match(apiSource, /requestSubjectType === "friend_transit_reading"[\\s\\S]{0,220}This paid reading is currently unavailable/u);\n',
              1
          )
          source = source.replace('  assert.match(idle, /Give me the short version/u);\n', '  assert.match(idle, /Paid reading/u);\n  assert.match(idle, /Unlock this reading/u);\n', 1)
          source = source.replace('  assert.match(loading, /Putting Alex&#x27;s current transits together/u);\n', '  assert.match(loading, /Preparing Alex&#x27;s reading/u);\n', 1)
          old_error = '''  const error = renderToStaticMarkup(React.createElement(FriendTransitsTab, {\n    ...baseProps,\n    readingStatus: "error",\n    readingError: "Generation failed safely."\n  }));\n  assert.match(error, /Generation failed safely/u);\n  assert.match(error, /Try again/u);\n'''
          new_error = '''  const locked = renderToStaticMarkup(React.createElement(FriendTransitsTab, {\n    ...baseProps,\n    readingStatus: "locked"\n  }));\n  assert.match(locked, /This is a paid reading/u);\n  assert.match(locked, /Unlock this reading/u);\n  assert.doesNotMatch(locked, /Anthropic|Claude|API|credit balance|Generation failed|Try again/iu);\n'''
          if old_error not in source:
              raise SystemExit('Friend reading error regression block not found')
          source = source.replace(old_error, new_error, 1)
          source = source.replace('  assert.doesNotMatch(unavailable, /Give me the short version/u);\n', '  assert.doesNotMatch(unavailable, /Unlock this reading/u);\n', 1)
          path.write_text(source)
          PY
      - name: Verify scope and provider leak removal
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          allowed='^(api/generate-user-content\.ts|apps/web/src/features/friends/FriendTransitsTab\.tsx|apps/web/src/features/friends/ManualChartsPanel\.tsx|apps/web/src/styles/friends\.css|scripts/test-friend-transit-reading-request-render\.mjs)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected changed files:" >&2
            echo "$bad" >&2
            exit 1
          fi
          ! grep -q 'readingError' apps/web/src/features/friends/FriendTransitsTab.tsx
          ! grep -q 'friendTransitReadingError' apps/web/src/features/friends/ManualChartsPanel.tsx
      - run: npm ci
      - run: node scripts/test-friend-transit-reading-request-render.mjs
      - run: node --experimental-strip-types scripts/test-friend-transit-reading-contract.mts
      - run: node --import tsx scripts/test-friend-natal-chart-completeness.mjs
      - run: npm run typecheck
      - run: npm run build:knowledge
      - run: npm run build:web
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/generate-user-content.ts apps/web/src/features/friends/FriendTransitsTab.tsx apps/web/src/features/friends/ManualChartsPanel.tsx apps/web/src/styles/friends.css scripts/test-friend-transit-reading-request-render.mjs
          git commit -m "Polish Friends paid reading UX"
          git push origin HEAD:chatgpt/friends-paid-reading-ux-20260906

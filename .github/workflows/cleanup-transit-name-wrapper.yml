name: Cleanup transit name wrapper

on:
  push:
    branches:
      - fix/personal-transit-source-label

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/personal-transit-source-label
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove redundant app-level name wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/web/src/content/fallbackArchitectureV3Runtime.ts")
          text = p.read_text()
          old = '''function fillTransitFriendName(value: unknown, voice: string) {
            return typeof value === "string"
              ? value.replace(/\\{\\{Name\\}\\}|\\{Name\\}/gu, () => voice)
              : value;
          }

          function createAppTransitRenderer(readerBundle: FallbackArchitectureV3Bundle) {
            const renderer = createTransitSynastryRenderer(
              readerBundle.transitLib,
              readerBundle.templatesFile,
              readerBundle.rowsFile
            );
            const renderTransitAspect = renderer.renderTransitAspect.bind(renderer);
            renderer.renderTransitAspect = (input: Record<string, unknown>) => {
              const rendered = renderTransitAspect(input);
              const voice = typeof input?.voice === "string" ? input.voice.trim() : "";
              if (!voice || voice === "you" || !rendered || typeof rendered !== "object") return rendered;
              return {
                ...rendered,
                headline: fillTransitFriendName(rendered.headline, voice),
                body: fillTransitFriendName(rendered.body, voice),
                parts: Array.isArray(rendered.parts)
                  ? rendered.parts.map((part: unknown) => fillTransitFriendName(part, voice))
                  : rendered.parts
              };
            };
            return renderer;
          }'''.replace("          ", "")
          new = '''function createAppTransitRenderer(readerBundle: FallbackArchitectureV3Bundle) {
            return createTransitSynastryRenderer(
              readerBundle.transitLib,
              readerBundle.templatesFile,
              readerBundle.rowsFile
            );
          }'''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit(f"Expected one transit-name wrapper block, found {text.count(old)}")
          p.write_text(text.replace(old, new))
          PY
      - name: Verify direct resolver contract
        run: |
          grep -F 'Name: v === "they" ? voice : ""' apps/web/src/content/fallbackArchitectureV3/resolver/renderTransitSynastry.mjs
          grep -F 'Name: v === "they" ? voice : ""' apps/web/src/content/fallbackArchitectureV3/resolver/renderTransitSynastry.browser.ts
          grep -F 'Name: v === "they" ? voice : ""' apps/web/src/content/fallbackArchitectureV3/dist/tldr-content.js
          node scripts/test-content-approval-governance.mjs
          npm run typecheck --if-present
      - name: Commit cleanup and remove one-off workflow
        run: |
          rm .github/workflows/cleanup-transit-name-wrapper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/content/fallbackArchitectureV3Runtime.ts .github/workflows/cleanup-transit-name-wrapper.yml
          git commit -m "Keep transit friend-name wiring package-owned"
          git push origin HEAD:fix/personal-transit-source-label
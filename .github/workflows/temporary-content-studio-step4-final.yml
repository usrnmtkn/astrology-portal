name: Temporary Content Studio Step 4 final

on:
  push:
    branches:
      - chatgpt/content-studio-step4-final

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build test dependencies
        run: npm run build -w @tldr/astro-knowledge
      - name: Apply Step 4 reader rehydrate repair
        run: python scripts/tmp_step4_reader_rehydrate_patch.py
      - name: Step 4 hydration QA
        run: |
          node scripts/test-content-studio-reader-cache-rehydrate.mjs
          node scripts/test-content-studio-runtime-cache-hydration.mjs
          node scripts/test-content-studio-cms-performance.mjs
          node scripts/test-content-studio-special-mutation-concurrency.mjs
          node scripts/test-content-studio-crud-hydration-guards.mjs
          node scripts/test-content-studio-hydration-reliability.mjs
          node scripts/test-admin-natal-placement-preview-api.mjs
          node scripts/test-admin-natal-placement-preview-dependencies.mjs
      - name: Typecheck and production builds
        run: |
          npm run typecheck
          npm run build:web
          npm run build:admin
      - name: Commit clean Step 4 repair
        run: |
          rm scripts/tmp_step4_reader_rehydrate_patch.py
          rm .github/workflows/temporary-content-studio-step4-final.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(content): rehydrate reader caches after Studio updates"
          git push

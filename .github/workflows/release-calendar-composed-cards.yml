name: Release composed Calendar aspect cards

on:
  push:
    branches:
      - "owner/release-calendar-composed-cards-20260901"
    paths:
      - "scripts/release-calendar-composed-cards-owner-approved.mjs"
      - "scripts/test-calendar-composed-cards-owner-approved-release.mjs"
      - "packages/astro-knowledge/review/sky-calendar-composed-first-glance-2026-08-31/composed-cards-serving-release-2026-09-01.json"
      - ".github/workflows/release-calendar-composed-cards.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact owner-approved composed-card wording
        run: node scripts/release-calendar-composed-cards-owner-approved.mjs
      - name: Verify controlled composed-card release
        run: |
          node scripts/test-calendar-composed-cards-owner-approved-release.mjs
          npm run validate -w @tldr/astro-knowledge
          npm run prepare:app-test-dependencies
          npm run test:sky-calendar-composed-routing
          git diff --check
      - name: Commit controlled serving release
        shell: bash
        run: |
          if git diff --quiet -- packages/astro-knowledge/data/sky-calendar/composed-cards-v1.json; then
            echo "No release changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/astro-knowledge/data/sky-calendar/composed-cards-v1.json
          git commit -m "release(calendar): serve approved composed aspect cards"
          git push origin HEAD

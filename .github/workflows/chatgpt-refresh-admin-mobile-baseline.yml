name: Refresh Content Studio mobile visual baseline

on:
  push:
    branches:
      - chatgpt/refresh-sky-client-flow-assertions
    paths:
      - .github/workflows/chatgpt-refresh-admin-mobile-baseline.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: https://visual-smoke.supabase.test
      VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/refresh-sky-client-flow-assertions
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build astrology knowledge package
        run: npm run build -w @tldr/astro-knowledge
      - name: Refresh admin dashboard baseline
        run: npx playwright test -c playwright.config.ts tests/visual/visual-regression-baseline.spec.ts --grep "admin dashboard surfaces match baseline" --update-snapshots
      - name: Verify only visual snapshot files changed
        run: |
          changed="$(git status --short | awk '{print $2}')"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v '^tests/visual/visual-regression-baseline.spec.ts-snapshots/' | grep -v '^\.github/workflows/chatgpt-refresh-admin-mobile-baseline.yml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit refreshed baseline and remove temporary workflow
        run: |
          rm .github/workflows/chatgpt-refresh-admin-mobile-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/visual-regression-baseline.spec.ts-snapshots .github/workflows/chatgpt-refresh-admin-mobile-baseline.yml
          git commit -m "Refresh Content Studio mobile visual baseline"
          git push origin HEAD:chatgpt/refresh-sky-client-flow-assertions

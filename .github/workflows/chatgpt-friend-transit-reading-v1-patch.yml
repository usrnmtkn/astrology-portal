name: ChatGPT Friend Transit Reading V1 Patch

on:
  push:
    branches:
      - chatgpt/friend-transit-reading-v1-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/friend-transit-reading-v1-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Integrate governed Friends transit reading
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              source = path.read_text()
              if new in source:
                  return
              if old not in source:
                  raise SystemExit(f"{label} did not match")
              path.write_text(source.replace(old, new, 1))

          # Keep ranking metadata out of the writer-visible fact packet.
          path = Path("api/_lib/friend-transit-reading.ts")
          source = path.read_text()
          old = '''function technicalEvidence(brief: FriendTransitReadingBrief) {\n  return {\n    primaryThemes: brief.primaryThemes.map((item) => ({ id: item.id, evidence: item.evidence })),\n    longerCycles: brief.longerCycles.map((item) => ({ id: item.id, evidence: item.evidence })),\n    houseContext: brief.houseContext.map((item) => ({ id: item.id, transitPlanet: item.transitPlanet, house: item.house })),\n    dailyMoonContext: brief.daily?.forecast?.moonContext ?? null,\n    relationshipTransitPlanets: brief.relationshipActivations.map((item) => item.transitPlanet).filter(Boolean)\n  };\n}'''
          new = '''function compactTechnicalTransit(item: FriendTransitReadingPersonalTransit) {\n  return {\n    id: item.id,\n    transitPlanet: item.evidence.transitPlanet,\n    transitSign: item.evidence.transitSign ?? null,\n    aspect: item.evidence.aspect,\n    natalPoint: item.evidence.natalPoint,\n    natalSign: item.evidence.natalSign,\n    natalHouse: item.evidence.natalHouse ?? null,\n    direction: item.evidence.direction ?? null\n  };\n}\n\nfunction technicalEvidence(brief: FriendTransitReadingBrief) {\n  return {\n    primaryThemes: brief.primaryThemes.map(compactTechnicalTransit),\n    longerCycles: brief.longerCycles.map(compactTechnicalTransit),\n    houseContext: brief.houseContext.map((item) => ({ id: item.id, transitPlanet: item.transitPlanet, house: item.house })),\n    dailyMoonContext: brief.daily?.forecast?.moonContext ?? null,\n    relationshipTransitPlanets: brief.relationshipActivations.map((item) => item.transitPlanet).filter(Boolean)\n  };\n}'''
          if old in source:
              source = source.replace(old, new, 1)
          source = source.replace(
              'const BODY_PATTERN = [...BODY_ALIASES.keys()].sort((a, b) => b.length - a.length).map(escapeRegex).join("|");',
              'const BODY_PATTERN = [...BODY_ALIASES.keys()].filter((value) => value !== "rising").sort((a, b) => b.length - a.length).map(escapeRegex).join("|");'
          )
          source = source.replace(
              'function sourceText(brief: FriendTransitReadingBrief) {\n  return JSON.stringify(brief).toLowerCase();\n}',
              'function sourceText(brief: FriendTransitReadingBrief) {\n  return JSON.stringify({ approvedReaderText: approvedReaderText(brief), technicalEvidence: technicalEvidence(brief) }).toLowerCase();\n}'
          )
          path.write_text(source)

          # Generic generation pipeline: special prompt, deterministic plan, special fact lock.
          path = Path("api/_lib/content-generation.ts")
          source = path.read_text()
          import_anchor = 'import { validateSkyArticleTemplateSlotValues } from "./sky-article-template-slots.js";\n'
          friend_import = '''import {\n  friendTransitReadingBriefFromFacts,\n  friendTransitReadingMeaningPlan,\n  friendTransitReadingPrompt,\n  isFriendTransitReadingInput,\n  validateFriendTransitReadingDraft\n} from "./friend-transit-reading.js";\n'''
          if friend_import not in source:
              if import_anchor not in source: raise SystemExit("content-generation import anchor missing")
              source = source.replace(import_anchor, import_anchor + friend_import, 1)
          source = source.replace(
              'type Surface = "sky" | "you" | "natal" | "synastry" | "composite" | "relationship" | "year_ahead";',
              'type Surface = "sky" | "you" | "natal" | "synastry" | "composite" | "relationship" | "friends" | "year_ahead";'
          )
          build_anchor = 'function buildPrompt(input: GenerateContentInput, approvedExamples: ApprovedExample[] = [], qualityFeedback = "") {\n  if (input.reportPayload) {'
          build_replacement = '''function buildPrompt(input: GenerateContentInput, approvedExamples: ApprovedExample[] = [], qualityFeedback = "") {\n  if (isFriendTransitReadingInput(input)) {\n    const brief = friendTransitReadingBriefFromFacts(input.facts);\n    const headline = stringValue(input.headline) || `What's going on with ${brief.friendName} right now?`;\n    return [\n      friendTransitReadingPrompt({ brief, headline }),\n      qualityFeedback ? `QUALITY_FEEDBACK_FROM_PRIOR_DRAFT\\n${qualityFeedback}` : ""\n    ].filter(Boolean).join("\\n\\n");\n  }\n\n  if (input.reportPayload) {'''
          if build_replacement not in source:
              if build_anchor not in source: raise SystemExit("buildPrompt anchor missing")
              source = source.replace(build_anchor, build_replacement, 1)
          validate_anchor = '''function validateGeneratedContentForInput(content: GeneratedContent, input: GenerateContentInput) {\n  validateGeneratedContentQuality(content, input);\n  validateAstrologyDrilldownQuality(content);\n\n  if (isNatalAspectGenerationContext(input)) {'''
          validate_replacement = '''function validateGeneratedContentForInput(content: GeneratedContent, input: GenerateContentInput) {\n  validateGeneratedContentQuality(content, input);\n  validateAstrologyDrilldownQuality(content);\n\n  if (isFriendTransitReadingInput(input)) {\n    const brief = friendTransitReadingBriefFromFacts(input.facts);\n    const expectedHeadline = stringValue(input.headline) || `What's going on with ${brief.friendName} right now?`;\n    const result = validateFriendTransitReadingDraft({ draft: content, brief, expectedHeadline });\n    if (!result.passed) {\n      hardEditorialViolation(\n        result.issues.map((issue) => issue.code),\n        `Generated Friends transit reading failed fact lock: ${result.issues.map((issue) => issue.message).join(" ")}`\n      );\n    }\n    return;\n  }\n\n  if (isNatalAspectGenerationContext(input)) {'''
          if validate_replacement not in source:
              if validate_anchor not in source: raise SystemExit("validateGeneratedContentForInput anchor missing")
              source = source.replace(validate_anchor, validate_replacement, 1)
          old_openai = '  const approvedExamples = await loadApprovedExamples(input);\n  const meaningPlan = await planGeneratedContentWithOpenAI({ apiKey, input, productionGate });'
          new_openai = '''  const approvedExamples = isFriendTransitReadingInput(input) ? [] : await loadApprovedExamples(input);\n  const meaningPlan = isFriendTransitReadingInput(input)\n    ? friendTransitReadingMeaningPlan(friendTransitReadingBriefFromFacts(input.facts))\n    : await planGeneratedContentWithOpenAI({ apiKey, input, productionGate });'''
          if new_openai not in source:
              if old_openai not in source: raise SystemExit("OpenAI example/plan anchor missing")
              source = source.replace(old_openai, new_openai, 1)
          # Claude has a separate approved examples load.
          old_claude = '  const approvedExamples = await loadApprovedExamples(input);\n  let qualityFeedback = "";'
          new_claude = '  const approvedExamples = isFriendTransitReadingInput(input) ? [] : await loadApprovedExamples(input);\n  let qualityFeedback = "";'
          if new_claude not in source:
              if old_claude not in source: raise SystemExit("Claude examples anchor missing")
              source = source.replace(old_claude, new_claude, 1)
          path.write_text(source)

          # Server request authority: sanitize the client brief into a fixed generation request.
          path = Path("api/generate-user-content.ts")
          source = path.read_text()
          report_import = 'import type { ReportDomain, ReportHorizon } from "./_lib/report-types.js";\n'
          friend_import = '''import {\n  FRIEND_TRANSIT_READING_CONTENT_TYPE,\n  FRIEND_TRANSIT_READING_EVENT_TYPE,\n  FRIEND_TRANSIT_READING_PROMPT_VERSION,\n  assertFriendTransitReadingBrief,\n  friendTransitReadingCanGenerate,\n  friendTransitReadingKnowledgeIds\n} from "./_lib/friend-transit-reading.js";\n'''
          if friend_import not in source:
              if report_import not in source: raise SystemExit("generate-user-content import anchor missing")
              source = source.replace(report_import, report_import + friend_import, 1)
          source = source.replace('  | "you_transit"\n', '  | "you_transit"\n  | "friend_transit_reading"\n', 1)
          prompt_old = '''      prompt_version: input.subjectType === "report_unit"\n        ? "report-generation-owner-2026-08-09"\n        : "tldr-astro-v4",'''
          prompt_new = '''      prompt_version: input.subjectType === "report_unit"\n        ? "report-generation-owner-2026-08-09"\n        : input.subjectType === "friend_transit_reading"\n          ? FRIEND_TRANSIT_READING_PROMPT_VERSION\n          : "tldr-astro-v4",'''
          if prompt_new not in source:
              if prompt_old not in source: raise SystemExit("prompt version anchor missing")
              source = source.replace(prompt_old, prompt_new, 1)
          handler_anchor = '''    const input = await readJsonBody(req);\n    const reportPayload = input.subjectType === "report_unit"'''
          handler_new = '''    const input = await readJsonBody(req);\n    if (input.subjectType === "friend_transit_reading") {\n      const brief = assertFriendTransitReadingBrief(input.facts?.friendTransitsBrief);\n      if (!friendTransitReadingCanGenerate(brief)) {\n        throw new Error("FRIEND_TRANSIT_READING_NO_PERSONAL_TRANSIT_EVIDENCE");\n      }\n      const targetDate = typeof input.targetDate === "string" && /^\\d{4}-\\d{2}-\\d{2}$/u.test(input.targetDate)\n        ? input.targetDate\n        : "";\n      if (!targetDate) throw new Error("FRIEND_TRANSIT_READING_TARGET_DATE_REQUIRED");\n      input.contentKey = `friend-transit-reading/${input.subjectId}/${targetDate}`;\n      input.surface = "friends";\n      input.mode = "in_depth";\n      input.eventType = FRIEND_TRANSIT_READING_EVENT_TYPE;\n      input.headline = `What's going on with ${brief.friendName} right now?`;\n      input.knowledgeIds = friendTransitReadingKnowledgeIds(brief);\n      input.facts = {\n        contentType: FRIEND_TRANSIT_READING_CONTENT_TYPE,\n        blockType: FRIEND_TRANSIT_READING_CONTENT_TYPE,\n        friendTransitsBrief: brief\n      };\n      input.sourceSnapshot = {\n        schema: "friend-transit-reading-source.v1",\n        briefSchema: brief.schema,\n        friendName: brief.friendName,\n        dateLabel: brief.dateLabel,\n        counts: brief.counts,\n        targetDate\n      };\n      input.voiceNotes = undefined;\n      input.allowQualityFallback = false;\n      input.status = "DRAFT";\n    }\n    const reportPayload = input.subjectType === "report_unit"'''
          if handler_new not in source:
              if handler_anchor not in source: raise SystemExit("handler sanitize anchor missing")
              source = source.replace(handler_anchor, handler_new, 1)
          path.write_text(source)

          # Provider routing follows transit-to-natal configuration.
          path = Path("api/_lib/provider-config.ts")
          source = path.read_text()
          if 'friend_transit_reading:' not in source:
              source = source.replace(
                  '  transit_natal: "CONTENT_GENERATION_PROVIDER_TRANSIT_TO_NATAL",\n',
                  '  transit_natal: "CONTENT_GENERATION_PROVIDER_TRANSIT_TO_NATAL",\n  friend_transit_reading: "CONTENT_GENERATION_PROVIDER_TRANSIT_TO_NATAL",\n',
                  1
              )
          path.write_text(source)

          # Production writing gate: third-person Friends transit validation.
          path = Path("src/astro-writing/productionPreCallGate.cjs")
          source = path.read_text()
          gate_anchor = '''  if (input?.surface === "you" && event.includes("transit")) {\n    return { strategyId: "friends-transit", validationProfile: "friends-transit", register: "second_person" };\n  }'''
          gate_new = '''  if (input?.surface === "friends" && event.includes("transit")) {\n    return { strategyId: "friends-transit", validationProfile: "friends-transit", register: "third_person" };\n  }\n  if (input?.surface === "you" && event.includes("transit")) {\n    return { strategyId: "friends-transit", validationProfile: "friends-transit", register: "second_person" };\n  }'''
          if gate_new not in source:
              if gate_anchor not in source: raise SystemExit("production gate transit anchor missing")
              source = source.replace(gate_anchor, gate_new, 1)
          path.write_text(source)

          # Reuse the governed transit catalog; do not create a new astrology namespace.
          path = Path("src/astro-writing/productionEvidenceAdapter.cjs")
          source = path.read_text()
          evidence_anchor = '''  if (input?.surface === "sky") return "sky";\n  if (input?.surface === "you" && event.includes("transit")) return "you-transit";'''
          evidence_new = '''  if (input?.surface === "sky") return "sky";\n  if (input?.surface === "friends" && event.includes("transit")) return "you-transit";\n  if (input?.surface === "you" && event.includes("transit")) return "you-transit";'''
          if evidence_new not in source:
              if evidence_anchor not in source: raise SystemExit("evidence surface anchor missing")
              source = source.replace(evidence_anchor, evidence_new, 1)
          source = source.replace(
              'return new Set(["sky", "you", "natal", "synastry", "composite", "relationship", "year_ahead"]);',
              'return new Set(["sky", "you", "natal", "synastry", "composite", "relationship", "friends", "year_ahead"]);'
          )
          path.write_text(source)

          # Third-person validation is explicit, not prompt-only.
          path = Path("src/astro-writing/validateCopy.mjs")
          source = path.read_text()
          register_anchor = '''  if (register === "second_person" && family === "house-horoscope-core" && !/\\b(?:you|your|yours|yourself)\\b/iu.test(text)) {\n    violations.push({ category: "register_consistency", detail: "House-core copy requires second person." });\n  }'''
          register_new = '''  if (register === "third_person" && /\\b(?:you|your|yours|yourself|yourselves)\\b/iu.test(text)) {\n    violations.push({ category: "register_consistency", detail: "Third-person copy contains second person." });\n  }\n  if (register === "second_person" && family === "house-horoscope-core" && !/\\b(?:you|your|yours|yourself)\\b/iu.test(text)) {\n    violations.push({ category: "register_consistency", detail: "House-core copy requires second person." });\n  }'''
          if register_new not in source:
              if register_anchor not in source: raise SystemExit("third-person validation anchor missing")
              source = source.replace(register_anchor, register_new, 1)
          path.write_text(source)

          # Client service: new private DRAFT type, return its saved draft to the requesting user.
          path = Path("apps/web/src/services/userGeneratedContent.ts")
          source = path.read_text()
          source = source.replace('  | "you_transit"\n', '  | "you_transit"\n  | "friend_transit_reading"\n', 1)
          source = source.replace(
              'surface: "sky" | "you" | "natal" | "synastry" | "composite" | "relationship" | "year_ahead";',
              'surface: "sky" | "you" | "natal" | "synastry" | "composite" | "relationship" | "friends" | "year_ahead";'
          )
          old_saved = '''  if (saved) {\n    return saved.status === "LIVE" ? fromRow(saved) : null;\n  }'''
          new_saved = '''  if (saved) {\n    if (request.subjectType === "friend_transit_reading" && saved.status === "DRAFT") {\n      return fromRow(saved);\n    }\n    return saved.status === "LIVE" ? fromRow(saved) : null;\n  }'''
          if new_saved not in source:
              if old_saved not in source: raise SystemExit("client DRAFT return anchor missing")
              source = source.replace(old_saved, new_saved, 1)
          path.write_text(source)

          # Friends UI: optional synthesis card above the unchanged deterministic sections.
          path = Path("apps/web/src/features/friends/FriendTransitsTab.tsx")
          source = path.read_text()
          prop_anchor = '''export function FriendTransitsTab({\n  brief,\n  isLoading = false,\n  onOpenBondTransit,\n  onOpenHouseTransit,\n  onOpenPersonalTransit,\n  patternTimingOverrides\n}: {\n  brief: FriendTransitsBrief;\n  isLoading?: boolean;\n  onOpenBondTransit: (id: string) => void;\n  onOpenHouseTransit: (id: string) => void;\n  onOpenPersonalTransit: (id: string) => void;\n  patternTimingOverrides: Record<string, NatalAspectPatternActivationTimingWindow>;\n}) {'''
          prop_new = '''export type FriendTransitReadingView = {\n  headline: string | null;\n  summary: string | null;\n  body: string;\n};\n\nexport function FriendTransitsTab({\n  brief,\n  isLoading = false,\n  onGenerateReading,\n  onOpenBondTransit,\n  onOpenHouseTransit,\n  onOpenPersonalTransit,\n  reading,\n  readingError,\n  readingStatus = "idle",\n  readingAvailable = false,\n  patternTimingOverrides\n}: {\n  brief: FriendTransitsBrief;\n  isLoading?: boolean;\n  onGenerateReading?: () => void;\n  onOpenBondTransit: (id: string) => void;\n  onOpenHouseTransit: (id: string) => void;\n  onOpenPersonalTransit: (id: string) => void;\n  reading?: FriendTransitReadingView | null;\n  readingError?: string | null;\n  readingStatus?: "idle" | "loading" | "ready" | "error";\n  readingAvailable?: boolean;\n  patternTimingOverrides: Record<string, NatalAspectPatternActivationTimingWindow>;\n}) {'''
          if prop_new not in source:
              if prop_anchor not in source: raise SystemExit("FriendTransitsTab props anchor missing")
              source = source.replace(prop_anchor, prop_new, 1)
          content_anchor = '''        {isLoading ? (\n          <div className="feature-loading-fallback" role="status">\n            Calculating transits for the selected date…\n          </div>\n        ) : null}\n        {daily?.forecast ? ('''
          content_new = '''        {isLoading ? (\n          <div className="feature-loading-fallback" role="status">\n            Calculating transits for the selected date…\n          </div>\n        ) : null}\n        {!isLoading && readingAvailable ? (\n          <article className="friends-logic-card friend-transit-reading" aria-label={`What's going on with ${friendName} right now?`}>\n            <span>Right now</span>\n            <h3>{`What's going on with ${friendName} right now?`}</h3>\n            {readingStatus === "ready" && reading ? (\n              <>\n                {reading.summary ? <p>{reading.summary}</p> : null}\n                {reading.body.split(/\\n{2,}/u).filter(Boolean).map((paragraph) => <p key={paragraph}>{paragraph}</p>)}\n              </>\n            ) : readingStatus === "loading" ? (\n              <p role="status">Putting {friendName}&apos;s current transits together…</p>\n            ) : readingStatus === "error" ? (\n              <>\n                <p>{readingError || "The short reading could not be generated. The transit details below are still available."}</p>\n                <button className="button secondary" onClick={onGenerateReading} type="button">Try again</button>\n              </>\n            ) : (\n              <>\n                <p>Pull the current transit picture into one short reading without changing the astrology underneath it.</p>\n                <button className="button secondary" onClick={onGenerateReading} type="button">Give me the short version</button>\n              </>\n            )}\n          </article>\n        ) : null}\n        {daily?.forecast ? ('''
          if content_new not in source:
              if content_anchor not in source: raise SystemExit("FriendTransitsTab content anchor missing")
              source = source.replace(content_anchor, content_new, 1)
          path.write_text(source)

          # ManualChartsPanel owns request lifecycle; deterministic sections stay untouched.
          path = Path("apps/web/src/features/friends/ManualChartsPanel.tsx")
          source = path.read_text()
          service_anchor = 'import { scheduleFriendChartRepair } from "./friendChartLoading";\n'
          service_import = 'import { generateUserContent } from "../../services/userGeneratedContent";\n'
          if service_import not in source:
              if service_anchor not in source: raise SystemExit("ManualChartsPanel service import anchor missing")
              source = source.replace(service_anchor, service_anchor + service_import, 1)
          source = source.replace(
              '  type FriendPersonalTransitGroup\n} from "./friendTransitsBrief";',
              '  type FriendPersonalTransitGroup\n} from "./friendTransitsBrief";'
          )
          state_anchor = '  const [friendChartModalOpen, setFriendChartModalOpen] = useState(false);\n'
          state_new = '''  const [friendChartModalOpen, setFriendChartModalOpen] = useState(false);\n  const [friendTransitReading, setFriendTransitReading] = useState<import("../../services/generatedContent").LiveGeneratedContent | null>(null);\n  const [friendTransitReadingStatus, setFriendTransitReadingStatus] = useState<"idle" | "loading" | "ready" | "error">("idle");\n  const [friendTransitReadingError, setFriendTransitReadingError] = useState<string | null>(null);\n'''
          if state_new not in source:
              if state_anchor not in source: raise SystemExit("ManualChartsPanel state anchor missing")
              source = source.replace(state_anchor, state_new, 1)
          brief_anchor = '''  const selectedFriendNatalAspectPatternStatus = friendProfileWork.natal && showFriendNatalAspectPatterns && selectedFriendReadyNatalChart'''
          callback_block = '''  const selectedFriendTransitReadingDate = currentSky?.generatedAt.slice(0, 10) ?? "";\n  const selectedFriendTransitReadingAvailable = Boolean(\n    selectedFriendTransitReadingDate\n    && selectedChart\n    && [...selectedFriendTransitsBrief.primaryThemes, ...selectedFriendTransitsBrief.longerCycles].length > 0\n  );\n\n  useEffect(() => {\n    setFriendTransitReading(null);\n    setFriendTransitReadingStatus("idle");\n    setFriendTransitReadingError(null);\n  }, [selectedChart?.id, selectedFriendTransitReadingDate]);\n\n  async function generateSelectedFriendTransitReading() {\n    if (!selectedChart || !selectedFriendTransitReadingDate || !selectedFriendTransitReadingAvailable) return;\n    setFriendTransitReadingStatus("loading");\n    setFriendTransitReadingError(null);\n    try {\n      const generated = await generateUserContent({\n        subjectType: "friend_transit_reading",\n        subjectId: selectedChart.id,\n        contentKey: `friend-transit-reading/${selectedChart.id}/${selectedFriendTransitReadingDate}`,\n        surface: "friends",\n        mode: "in_depth",\n        eventType: "friend-transit-reading",\n        targetDate: selectedFriendTransitReadingDate,\n        facts: {\n          contentType: "friend_transit_reading",\n          friendTransitsBrief: selectedFriendTransitsBrief\n        }\n      });\n      if (!generated) throw new Error("The short reading was not returned.");\n      setFriendTransitReading(generated);\n      setFriendTransitReadingStatus("ready");\n    } catch (error) {\n      setFriendTransitReading(null);\n      setFriendTransitReadingStatus("error");\n      setFriendTransitReadingError(error instanceof Error ? error.message : "The short reading could not be generated.");\n    }\n  }\n\n'''
          if callback_block not in source:
              if brief_anchor not in source: raise SystemExit("ManualChartsPanel reading callback anchor missing")
              source = source.replace(brief_anchor, callback_block + brief_anchor, 1)
          tab_old = '''            <FriendTransitsTab\n              brief={selectedFriendTransitsBrief}\n              isLoading={currentSkyLoading}\n              onOpenBondTransit={openBondTransitById}\n              onOpenHouseTransit={openFriendHouseTransitById}\n              onOpenPersonalTransit={openFriendTransitById}\n              patternTimingOverrides={currentSkyLoading ? {} : selectedFriendNatalAspectPatternTimingOverrides}\n            />'''
          tab_new = '''            <FriendTransitsTab\n              brief={selectedFriendTransitsBrief}\n              isLoading={currentSkyLoading}\n              onGenerateReading={generateSelectedFriendTransitReading}\n              onOpenBondTransit={openBondTransitById}\n              onOpenHouseTransit={openFriendHouseTransitById}\n              onOpenPersonalTransit={openFriendTransitById}\n              patternTimingOverrides={currentSkyLoading ? {} : selectedFriendNatalAspectPatternTimingOverrides}\n              reading={friendTransitReading}\n              readingAvailable={selectedFriendTransitReadingAvailable}\n              readingError={friendTransitReadingError}\n              readingStatus={friendTransitReadingStatus}\n            />'''
          if tab_new not in source:
              if tab_old not in source: raise SystemExit("ManualChartsPanel FriendTransitsTab anchor missing")
              source = source.replace(tab_old, tab_new, 1)
          path.write_text(source)
          PY
      - name: Verify no unsafe #568 restoration
        run: |
          git diff --name-only "$GITHUB_SHA" | tee /tmp/changed.txt
          if grep -qx 'apps/web/src/App.tsx' /tmp/changed.txt; then
            echo 'App.tsx must remain untouched; unsafe angle targeting stays reverted.' >&2
            exit 1
          fi
          if grep -qx 'apps/web/src/features/friends/friendHouseTransitPriority.ts' /tmp/changed.txt; then
            echo 'House-priority helper must remain reverted.' >&2
            exit 1
          fi
      - run: npm ci
      - name: Run Friends reading contract
        run: node --experimental-strip-types scripts/test-friend-transit-reading-contract.mts
      - name: Typecheck
        run: npm run typecheck
      - name: Build knowledge
        run: npm run build:knowledge
      - name: Build web
        run: npm run build:web
      - name: Commit integration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api/_lib/friend-transit-reading.ts \
            api/_lib/content-generation.ts \
            api/generate-user-content.ts \
            api/_lib/provider-config.ts \
            src/astro-writing/productionPreCallGate.cjs \
            src/astro-writing/productionEvidenceAdapter.cjs \
            src/astro-writing/validateCopy.mjs \
            apps/web/src/services/userGeneratedContent.ts \
            apps/web/src/features/friends/FriendTransitsTab.tsx \
            apps/web/src/features/friends/ManualChartsPanel.tsx
          git commit -m "Integrate governed Friends transit reading"
          git push origin HEAD:chatgpt/friend-transit-reading-v1-20260906

name: Review Between You Two V2 authoring

on:
  push:
    branches:
      - "owner/between-you-two-v2-20260905"
    paths:
      - "packages/astro-knowledge/review/between-you-two-v2-2026-09-05/**"
      - "scripts/test-between-you-two-v2-pilot.mjs"
      - "scripts/test-between-you-two-v2-full-review.mjs"
      - ".github/workflows/review-between-you-two-v2-pilot.yml"

permissions:
  contents: read

jobs:
  review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify approved pilot boundary and exact-body provenance
        run: node scripts/test-between-you-two-v2-pilot.mjs
      - name: Verify full authoring review coverage
        run: node scripts/test-between-you-two-v2-full-review.mjs

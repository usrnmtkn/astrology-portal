name: Refresh Sun Friends writing indexes

on:
  push:
    branches:
      - chatgpt/release-sun-friends-transits-v1

permissions:
  contents: write

jobs:
  refresh-indexes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/release-sun-friends-transits-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild knowledge index
        run: node scripts/build-knowledge-index.mjs --write
      - name: Rebuild phrase index
        run: node scripts/build-phrase-index.mjs --write
      - name: Verify indexes
        run: |
          node scripts/build-knowledge-index.mjs --check
          node scripts/build-phrase-index.mjs --check
      - name: Verify grammar
        run: node scripts/lint-corpus-grammar.mjs
      - name: Verify Sun Friends serving parity
        run: node scripts/test-sun-friends-serving-v1.mjs
      - name: Verify diff
        run: git diff --check
      - name: Commit indexes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/refresh-sun-friends-writing-indexes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(content): refresh writing indexes for Sun Friends release"
          git push origin HEAD:chatgpt/release-sun-friends-transits-v1

name: Analyze editorial backlog

on:
  push:
    branches:
      - chatgpt/editorial-backlog-resolution

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build actionable queue in temp path
        run: node scripts/build-content-unresolved-queue.mjs --out=/tmp/unresolved.json
      - name: Classify actionable decisions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('/tmp/unresolved.json','utf8'));
          const family=(k)=>{
            k=String(k);
            if(k.startsWith('daily-glance-variant/')) return 'daily-glance-variants';
            if(k.startsWith('authored/book-ritual-and-the-moon/lunation-horoscope/eclipse-')) return 'eclipse-house-horoscopes';
            if(k.startsWith('authored/sky-lunation-macro/')) return 'sky-lunation-macro';
            if(k.startsWith('fallback-hook/empty-house-ruler-v3/')) return 'legacy-empty-house-ruler-v3';
            if(k.startsWith('fallback-hook/lunation-opening-situation/')) return 'lunation-opening-situations';
            if(k.startsWith('fallback-hook/lunation-ruler-house/')) return 'lunation-ruler-house';
            if(k.startsWith('fallback-template/natal.planet-in-sign/')) return 'natal-planet-in-sign-template';
            if(k.startsWith('fallback-vocab/sign-')) return 'placement-sign-vocabulary';
            if(k.startsWith('fallback-hook/sky-sign-copy/')) return 'sky-sign-copy';
            if(k.startsWith('fallback-hook/sky-placement/')) return 'sky-placement-hook';
            return k.split('/').slice(0,3).join('/');
          };
          const grouped={};
          for(const item of report.items){const f=family(item.contentKey);(grouped[f]??=[]).push(item);}
          const summary=Object.entries(grouped).map(([f,items])=>({family:f,records:items.length,uniqueKeys:new Set(items.map(x=>x.contentKey)).size,sources:[...new Set(items.map(x=>x.sourcePath))],keys:[...new Set(items.map(x=>x.contentKey))].sort()})).sort((a,b)=>b.records-a.records);
          console.log(JSON.stringify({actionableRecords:report.count,shadowedRecords:report.shadowedCount,actionableUniqueContentKeys:new Set(report.items.map(x=>x.contentKey)).size,groups:summary},null,2));
          NODE

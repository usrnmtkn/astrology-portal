name: Analyze editorial backlog

on:
  push:
    branches:
      - chatgpt/editorial-backlog-resolution

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Summarize unresolved queue and shadowed rows
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { isGovernedReaderEligible } from './apps/web/src/content/fallbackArchitectureV3/resolver/readerEligibility.mjs';
          const root='apps/web/src/content/fallbackArchitectureV3/source-rows';
          const queue=JSON.parse(fs.readFileSync('packages/astro-knowledge/generated/content-unresolved-queue-v1.json','utf8'));
          const byKey=new Map();
          const visit=(v,file,p='')=>{ if(Array.isArray(v)){v.forEach((x,i)=>visit(x,file,`${p}/${i}`));return;} if(!v||typeof v!=='object')return; if(typeof v.contentKey==='string'){const a=byKey.get(v.contentKey)||[];a.push({file,path:p,row:v,eligible:isGovernedReaderEligible(v)});byKey.set(v.contentKey,a);} for(const [k,x] of Object.entries(v)) visit(x,file,`${p}/${k}`); };
          for(const name of fs.readdirSync(root).filter(x=>x.endsWith('.json'))){const file=path.join(root,name);visit(JSON.parse(fs.readFileSync(file,'utf8')),file);}
          const analyzed=queue.items.map(item=>{const peers=(byKey.get(item.contentKey)||[]);const eligiblePeers=peers.filter(p=>p.eligible);return {...item,peerCount:peers.length,eligiblePeerCount:eligiblePeers.length,eligiblePeerSources:eligiblePeers.map(p=>p.file)};});
          const countBy=(arr,fn)=>Object.entries(arr.reduce((a,x)=>{const k=fn(x);a[k]=(a[k]||0)+1;return a;},{})).sort((a,b)=>b[1]-a[1]);
          const shadowed=analyzed.filter(x=>x.eligiblePeerCount>0);
          const uniquePending=analyzed.filter(x=>x.eligiblePeerCount===0);
          console.log(JSON.stringify({total:analyzed.length,shadowedByEligiblePeer:shadowed.length,uniquePending:uniquePending.length,shadowedBySource:countBy(shadowed,x=>x.sourcePath),uniquePendingBySource:countBy(uniquePending,x=>x.sourcePath),shadowedSamples:shadowed.slice(0,30),uniquePendingSamples:uniquePending.slice(0,80)},null,2));
          NODE

name: Sky Calendar final exact 83

on:
  pull_request:
    paths:
      - "packages/astro-knowledge/data/transits/**"
      - "packages/astro-knowledge/review/sky-calendar-exact-approved-2026-09-06-final-83/**"
      - "scripts/release-calendar-exact-approved-20260906-final-83.mjs"
      - "scripts/test-calendar-exact-approved-20260906-final-83.mjs"
      - "scripts/test-calendar-major-exact-routing-complete.mjs"
      - ".github/workflows/sky-calendar-final-exact-83.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build astro-knowledge workspace from released source
        run: npm run build -w @tldr/astro-knowledge
      - name: Regenerate governed bundles and writing evidence
        run: |
          node scripts/generate-fallback-package-manifest.mjs
          node scripts/build-knowledge-index.mjs --write
          node scripts/build-phrase-index.mjs --write
          node scripts/build-production-sky-kernel-comparison.mjs --write
      - name: Verify bounded owner authorization
        run: node scripts/test-bounded-owner-batch-approval-governance.mjs
      - name: Verify final 83 exact-owner-approved release
        run: node scripts/test-calendar-exact-approved-20260906-final-83.mjs
      - name: Verify complete 379-row major exact Sky aspect routing
        env:
          SKY_CALENDAR_OWNER_PAYLOADS_PATH: packages/astro-knowledge/review/calendar-collective-pressure-pass-2026-09-07/current-owner-payloads.json
        run: node scripts/test-calendar-major-exact-routing-complete.mjs
      - name: Verify generated fallback manifest
        run: node scripts/generate-fallback-package-manifest.mjs --check
      - name: Verify generated knowledge index
        run: node scripts/build-knowledge-index.mjs --check
      - name: Verify generated phrase index
        run: node scripts/build-phrase-index.mjs --check
      - name: Verify production Sky kernel comparison
        run: node scripts/build-production-sky-kernel-comparison.mjs
      - name: Verify whitespace integrity
        run: git diff --check

name: Refresh stale Sky client-flow assertions

on:
  push:
    branches:
      - chatgpt/refresh-sky-client-flow-assertions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/refresh-sky-client-flow-assertions
          fetch-depth: 0

      - name: Update stale Sky assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/visual/client-facing-user-flows.spec.ts')
          text = path.read_text()

          old = '''        await expect(page.getByRole("heading", { level: 3, name: "Gifts" })).toBeVisible();
                  await expect(page.getByRole("heading", { level: 3, name: "Lessons" })).toBeVisible();

                  const labels = await page.locator(".article-related-aspects__label, #sky-detail-related-aspects-title").evaluateAll((elements) => (
                    elements.map((element) => {
                      const box = element.getBoundingClientRect();
                      const style = window.getComputedStyle(element);
                      return {
                        text: element.textContent?.replace(/\\s+/gu, " ").trim() ?? "",
                        visible: box.width > 1 && box.height > 1,
                        fontFamily: style.fontFamily,
                        fontSize: style.fontSize,
                        fontWeight: style.fontWeight,
                        lineHeight: style.lineHeight,
                        letterSpacing: style.letterSpacing,
                        textTransform: style.textTransform
                      };
                    })
                  ));
                  const visibleLabels = labels.filter((label) => label.visible);

                  expect(
                    visibleLabels.map((label) => label.text),
                    `${viewport.name} ${theme}: the generic semantic parent stays hidden while each aspect card keeps its approved eyebrow`
                  ).toEqual(["Gifts", "Lessons"]);'''

          new = '''        const labels = await page.locator(".article-related-aspects__label, #sky-detail-related-aspects-title").evaluateAll((elements) => (
                    elements.map((element) => {
                      const box = element.getBoundingClientRect();
                      const style = window.getComputedStyle(element);
                      return {
                        text: element.textContent?.replace(/\\s+/gu, " ").trim() ?? "",
                        visible: box.width > 1 && box.height > 1,
                        fontFamily: style.fontFamily,
                        fontSize: style.fontSize,
                        fontWeight: style.fontWeight,
                        lineHeight: style.lineHeight,
                        letterSpacing: style.letterSpacing,
                        textTransform: style.textTransform
                      };
                    })
                  ));
                  const visibleLabels = labels.filter((label) => label.visible);

                  expect(
                    visibleLabels.length,
                    `${viewport.name} ${theme}: at least one approved aspect hierarchy label remains visible`
                  ).toBeGreaterThan(0);
                  expect(
                    visibleLabels.every((label) => ["Gifts", "Lessons"].includes(label.text)),
                    `${viewport.name} ${theme}: visible aspect hierarchy labels remain in the approved Gifts/Lessons vocabulary`
                  ).toBe(true);
                  expect(
                    new Set(visibleLabels.map((label) => label.text)).size,
                    `${viewport.name} ${theme}: each rendered hierarchy group has one visible label`
                  ).toBe(visibleLabels.length);'''

          if old not in text:
              raise SystemExit('Aspect hierarchy assertion block not found; refusing broad replacement.')
          text = text.replace(old, new, 1)

          old_virgo = '''    await expect(article).toContainText("Welcome to Virgo season’s reality check.");
              await expect(article).toContainText("The best repair may be the one that removes work instead of teaching you to tolerate more of it.");'''
          new_virgo = '''    await expect(article).toContainText("Virgo season makes the invisible work of keeping things running harder to overlook.");
              await expect(article).toContainText("The system that works is the one that makes your life easier to live.");'''
          if old_virgo not in text:
              raise SystemExit('Sun in Virgo stale assertion block not found; refusing broad replacement.')
          text = text.replace(old_virgo, new_virgo, 1)
          path.write_text(text)
          PY

      - name: Remove temporary workflow and commit test-only change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-refresh-sky-client-flow-assertions.yml
          git add tests/visual/client-facing-user-flows.spec.ts
          git diff --cached --check
          git commit -m "Refresh Sky client-flow assertions for current content authority"
          git push origin HEAD:chatgpt/refresh-sky-client-flow-assertions

name: Hotfix Sky V4 related aspect hydration

on:
  push:
    branches:
      - "hotfix/sky-v4-related-aspect-hydration"
    paths:
      - "scripts/hotfix-sky-v4-related-aspect-hydration.mjs"
      - "scripts/test-sky-v4-related-aspect-hydration.mjs"
      - ".github/workflows/hotfix-sky-v4-related-aspect-hydration.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inspect Sun aspect ordering
        run: |
          npx tsx -e 'import { getAstrodienstSky } from "./apps/web/src/services/ephemeris.ts"; (async()=>{ const location={label:"Portsmouth, NH",latitude:43.0718,longitude:-70.7626,timeZone:"America/New_York"}; const sky=await getAstrodienstSky(location,new Date("2026-08-27T16:00:00.000Z")); console.log(JSON.stringify(sky.aspects.filter((aspect)=>aspect.from==="Sun"||aspect.to==="Sun").sort((a,b)=>a.orb-b.orb),null,2)); })().catch((error)=>{ console.error(error); process.exit(1); });'
      - name: Apply focused hydration fix
        run: node scripts/hotfix-sky-v4-related-aspect-hydration.mjs
      - name: Verify hydration boundary
        run: node scripts/test-sky-v4-related-aspect-hydration.mjs
      - name: Verify existing Sky article contracts
        run: |
          node scripts/test-sky-article-v1.mjs
          node scripts/test-reviewed-sky-aspect-phrasebook.mjs
      - name: Build app
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Reproduce and verify Sun in Virgo article
        run: npx playwright test -c playwright.config.ts tests/visual/client-facing-user-flows.spec.ts --grep "Sun in Virgo detail serves the exact canonical V4 owner-approved article"
      - name: Verify whitespace integrity
        run: git diff --check
      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hotfix changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx scripts/test-reviewed-sky-aspect-phrasebook.mjs
          git commit -m "fix(sky): refresh open detail when exact registry loads"
          git push origin HEAD

name: Hotfix Sky V4 related aspect hydration

on:
  push:
    branches:
      - "hotfix/sky-v4-related-aspect-hydration"
    paths:
      - "scripts/hotfix-sky-v4-related-aspect-hydration.mjs"
      - "scripts/test-sky-v4-related-aspect-hydration.mjs"
      - ".github/workflows/hotfix-sky-v4-related-aspect-hydration.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply focused Sky aspect fix
        run: node scripts/hotfix-sky-v4-related-aspect-hydration.mjs
      - name: Verify focused source contract
        run: node scripts/test-sky-v4-related-aspect-hydration.mjs
      - name: Build astro knowledge
        run: npm run build -w @tldr/astro-knowledge
      - name: Verify all 248 exact routes
        run: node scripts/test-calendar-exact-sky-aspect-routing.mjs
      - name: Verify existing Sky article contracts
        run: |
          node scripts/test-sky-article-v1.mjs
          node scripts/test-reviewed-sky-aspect-phrasebook.mjs
      - name: Build web app
        run: npm run build -w @tldr/web
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Reproduce and verify Sun in Virgo article
        run: npx playwright test -c playwright.config.ts tests/visual/client-facing-user-flows.spec.ts --grep "Sun in Virgo detail serves the exact canonical V4 owner-approved article"
      - name: Verify whitespace integrity
        run: git diff --check
      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hotfix changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/App.tsx \
            apps/web/src/services/skyAspectRouting.ts \
            scripts/test-calendar-exact-sky-aspect-routing.mjs \
            scripts/test-reviewed-sky-aspect-phrasebook.mjs
          git commit -m "fix(sky): preserve exact aspects in placement details"
          git push origin HEAD

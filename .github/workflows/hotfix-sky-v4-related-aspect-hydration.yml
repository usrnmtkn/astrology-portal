name: Hotfix Sky V4 related aspect hydration

on:
  push:
    branches:
      - "hotfix/sky-v4-related-aspect-hydration"
    paths:
      - "scripts/hotfix-sky-v4-related-aspect-hydration.mjs"
      - "scripts/test-sky-v4-related-aspect-hydration.mjs"
      - ".github/workflows/hotfix-sky-v4-related-aspect-hydration.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inspect Sun aspect ordering
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import path from "node:path";
          import { createLogger, createServer } from "vite";
          const root = process.cwd();
          const logger = createLogger("error");
          const vite = await createServer({
            root: path.join(root, "apps/web"),
            customLogger: logger,
            server: { middlewareMode: true, hmr: false },
            optimizeDeps: { entries: [], noDiscovery: true },
            appType: "custom",
            logLevel: "error"
          });
          try {
            const ephemeris = await vite.ssrLoadModule("/src/services/ephemeris.ts");
            const location = {
              label: "Portsmouth, NH",
              latitude: 43.0718,
              longitude: -70.7626,
              timeZone: "America/New_York"
            };
            const sky = await ephemeris.getAstrodienstSky(location, new Date("2026-08-27T16:00:00.000Z"), { includeTransitWindows: false });
            console.log("SUN_ASPECTS=" + JSON.stringify(
              sky.aspects
                .filter((aspect) => aspect.from === "Sun" || aspect.to === "Sun")
                .sort((a, b) => a.orb - b.orb)
                .map(({ from, type, to, orb, applying }) => ({ from, type, to, orb, applying }))
            ));
          } finally {
            await vite.close();
          }
          NODE
      - name: Apply focused hydration fix
        run: node scripts/hotfix-sky-v4-related-aspect-hydration.mjs
      - name: Verify hydration boundary
        run: node scripts/test-sky-v4-related-aspect-hydration.mjs
      - name: Verify existing Sky article contracts
        run: |
          node scripts/test-sky-article-v1.mjs
          node scripts/test-reviewed-sky-aspect-phrasebook.mjs
      - name: Build app
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Reproduce and verify Sun in Virgo article
        run: npx playwright test -c playwright.config.ts tests/visual/client-facing-user-flows.spec.ts --grep "Sun in Virgo detail serves the exact canonical V4 owner-approved article"
      - name: Verify whitespace integrity
        run: git diff --check
      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hotfix changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx scripts/test-reviewed-sky-aspect-phrasebook.mjs
          git commit -m "fix(sky): preserve gift and lesson aspect sections"
          git push origin HEAD

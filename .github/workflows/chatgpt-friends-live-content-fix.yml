name: Repair Friends live Content Studio hydration

on:
  push:
    branches:
      - chatgpt/content-studio-publish-button-emphasis

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://visual-smoke.supabase.test
      VITE_SUPABASE_ANON_KEY: visual-smoke-placeholder
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/content-studio-publish-button-emphasis
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply reader hydration and publish-button fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/src/features/friends/friendsContentLoading.ts')
          text = path.read_text()
          old = '''export function shouldHydrateFallbackDashboardContent(mode: FriendsContentLoadingMode) {
            // The checked-in, review-gated package is the canonical Friends source. Avoid
            // downloading the complete dashboard mirror while the user is opening charts.
            return mode !== "friends";
          }'''.replace('          ', '')
          new = '''export function shouldHydrateFallbackDashboardContent({
            mode,
            friendNatalContentRequested,
            friendRelationshipContentRequests
          }: Pick<FriendsContentLoadingState, "mode" | "friendNatalContentRequested" | "friendRelationshipContentRequests">) {
            if (mode !== "friends") return true;

            // Keep the bare Friends list fast, but once a reader opens any Friend detail
            // surface, hydrate the approved Content Studio mirror so owner-published edits
            // override the checked-in fallback package immediately.
            return friendNatalContentRequested || friendRelationshipContentRequests.size > 0;
          }'''.replace('          ', '')
          if old not in text:
              raise SystemExit('Expected Friends dashboard hydration policy was not found.')
          path.write_text(text.replace(old, new))

          path = Path('apps/web/src/App.tsx')
          text = path.read_text()
          old_call = '!shouldHydrateFallbackDashboardContent(mode)'
          new_call = '''!shouldHydrateFallbackDashboardContent({
            mode,
            friendNatalContentRequested,
            friendRelationshipContentRequests
          })'''
          if old_call not in text:
              raise SystemExit('Expected App Friends hydration call was not found.')
          text = text.replace(old_call, new_call, 1)
          anchor = 'Fallback architecture V3 dashboard bundle failed to install; local JSON snapshot remains active.'
          start = text.index(anchor)
          old_deps = '  }, [contentRefreshVersion, mode]);'
          dep_pos = text.find(old_deps, start)
          if dep_pos < 0:
              raise SystemExit('Expected fallback hydration effect dependencies were not found.')
          new_deps = '  }, [contentRefreshVersion, friendNatalContentRequested, friendRelationshipContentRequests, mode]);'
          text = text[:dep_pos] + new_deps + text[dep_pos + len(old_deps):]
          path.write_text(text)

          path = Path('scripts/test-friends-content-loading-policy.mjs')
          text = path.read_text()
          old_assert = '''assert.equal(
            shouldHydrateFallbackDashboardContent("friends"),
            false,
            "Friends must use the checked-in approved package without downloading the complete dashboard mirror."
          );
          for (const mode of ["guest", "member", "profile", "calendar", "account", "settings"]) {
            assert.equal(
              shouldHydrateFallbackDashboardContent(mode),
              true,
              `${mode} must retain dashboard hydration.`
            );
          }'''.replace('          ', '')
          new_assert = '''assert.equal(
            shouldHydrateFallbackDashboardContent(loadingState()),
            false,
            "A bare Friends list must not download the complete dashboard mirror."
          );
          assert.equal(
            shouldHydrateFallbackDashboardContent(loadingState([], { friendNatalContentRequested: true })),
            true,
            "Friends Natal must hydrate approved Content Studio overrides once the detail view is requested."
          );
          for (const tab of ["compatibility", "transits", "synastry", "composite"]) {
            assert.equal(
              shouldHydrateFallbackDashboardContent(loadingState([tab])),
              true,
              `Friends ${tab} must hydrate approved Content Studio overrides after the detail view opens.`
            );
          }
          for (const mode of ["guest", "member", "profile", "calendar", "account", "settings"]) {
            assert.equal(
              shouldHydrateFallbackDashboardContent(loadingState([], { mode })),
              true,
              `${mode} must retain dashboard hydration.`
            );
          }'''.replace('          ', '')
          if old_assert not in text:
              raise SystemExit('Expected Friends hydration assertions were not found.')
          path.write_text(text.replace(old_assert, new_assert))

          path = Path('apps/admin/src/admin.css')
          text = path.read_text()
          pattern = re.compile(
              r'\.admin-dashboard \.admin-editor-savebar \.admin-publish-button \{.*?\n\}\n\n'
              r'\.admin-dashboard \.admin-editor-savebar \.admin-publish-button:hover:not\(:disabled\) \{.*?\n\}',
              re.S
          )
          replacement = '''.admin-dashboard .admin-editor-savebar .admin-publish-button {
            background: var(--admin-ui-primary);
            border-color: var(--admin-ui-primary);
            color: var(--admin-success-canvas);
            font-weight: 700;
            opacity: 1;
          }

          .admin-dashboard .admin-editor-savebar .admin-publish-button:hover:not(:disabled) {
            background: var(--admin-ui-primary-hover);
            border-color: var(--admin-ui-primary-hover);
            color: var(--admin-success-canvas);
            opacity: 1;
          }'''.replace('          ', '')
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one publish-button rule pair, replaced {count}.')
          path.write_text(text)
          PY

          cat > scripts/test-friends-transit-dashboard-override.mjs <<'EOF'
          import assert from "node:assert/strict";
          import os from "node:os";
          import path from "node:path";
          import { pathToFileURL } from "node:url";
          import { build } from "esbuild";

          const repoRoot = path.resolve(import.meta.dirname, "..");
          const outFile = path.join(os.tmpdir(), `tldr-friends-transit-dashboard-override-${Date.now()}.mjs`);

          await build({
            absWorkingDir: repoRoot,
            bundle: true,
            format: "esm",
            platform: "node",
            outfile: outFile,
            write: true,
            logLevel: "silent",
            stdin: {
              resolveDir: repoRoot,
              loader: "tsx",
              contents: `
                export {
                  installFallbackArchitectureV3Bundle,
                  loadDeferredFallbackArchitectureV3Bundle,
                  transitSynastryFallbackRendererV3
                } from "./apps/web/src/content/fallbackArchitectureV3Runtime.ts";
              `
            }
          });

          const runtime = await import(pathToFileURL(outFile));
          await runtime.loadDeferredFallbackArchitectureV3Bundle();

          const renderVenusMoon = () => runtime.transitSynastryFallbackRendererV3.renderTransitAspect({
            transiting: "venus",
            aspect: "square",
            natal: "moon",
            voice: "Alisa P",
            window: "Until September 6"
          });

          const before = renderVenusMoon();
          assert.equal(before.contentKey, "authored/transit-aspect/venus/moon/hard");
          assert.doesNotMatch(before.parts.join("\n"), /CONTENT STUDIO VENUS MOON OVERRIDE MARKER/u);

          runtime.installFallbackArchitectureV3Bundle({
            transitLib: {
              authoredCards: [{
                contentKey: "authored/transit-aspect/venus/moon/hard",
                content_role: "full_copy",
                review_status: "approved",
                body: "CONTENT STUDIO VENUS MOON OVERRIDE MARKER."
              }]
            },
            templatesFile: { templates: [] },
            rowsFile: { hookRows: [], vocabularyRows: [] }
          });

          const after = renderVenusMoon();
          assert.equal(after.contentKey, "authored/transit-aspect/venus/moon/hard");
          assert.match(
            after.parts.join("\n"),
            /CONTENT STUDIO VENUS MOON OVERRIDE MARKER/u,
            "An approved Content Studio transit revision must override the bundled Friends Transit card."
          );
          assert.notEqual(after.parts.join("\n"), before.parts.join("\n"));

          console.log("Friends Transit dashboard override contract passed.");
          EOF
      - name: Install dependencies
        run: npm ci
      - name: Build astro knowledge prerequisite
        run: npm run build -w @tldr/astro-knowledge
      - name: Test Friends content-loading policy
        run: node --import tsx scripts/test-friends-content-loading-policy.mjs
      - name: Test Friends Transit dashboard override
        run: node scripts/test-friends-transit-dashboard-override.mjs
      - name: Build Content Studio admin
        run: npm run build:admin
      - name: Build reader app
        run: npm run build -w @tldr/web
      - name: Commit verified repair
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git rm .github/workflows/chatgpt-friends-live-content-fix.yml
          git add apps/web/src/features/friends/friendsContentLoading.ts apps/web/src/App.tsx scripts/test-friends-content-loading-policy.mjs scripts/test-friends-transit-dashboard-override.mjs apps/admin/src/admin.css
          git commit -m "fix: hydrate live Content Studio copy in Friends"
          git push origin HEAD:chatgpt/content-studio-publish-button-emphasis

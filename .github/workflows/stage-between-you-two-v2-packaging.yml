name: Stage Between You Two V2 packaging

on:
  push:
    branches:
      - "owner/between-you-two-v2-20260905"
    paths:
      - "scripts/patch-between-you-two-v2-packaging.mjs"
      - "apps/web/src/content/fallbackArchitectureV3/source-rows/pair-daily-v2-rows.json"
      - ".github/workflows/stage-between-you-two-v2-packaging.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch package and Content Studio discovery
        run: node scripts/patch-between-you-two-v2-packaging.mjs
      - name: Rebuild governed fallback package
        run: npm run build:fallback-manifest
      - name: Rebuild Content Studio hook catalog
        run: node scripts/build-admin-hook-catalog.mjs
      - name: Verify approved-only relationship bundle and held admin rows
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const relationship = JSON.parse(fs.readFileSync('apps/web/src/content/fallbackArchitectureV3/bundled-relationship-hook-rows-v3.json', 'utf8'));
          const source = JSON.parse(fs.readFileSync('apps/web/src/content/fallbackArchitectureV3/source-rows/pair-daily-v2-rows.json', 'utf8'));
          const servingV2 = relationship.hookRows.filter(row => row.contentKey.includes('/pair-daily/v2/'));
          const held = source.rows.filter(row => row.review_status === 'needs_review');
          if (servingV2.length !== 24) throw new Error(`expected 24 reader-eligible V2 rows, got ${servingV2.length}`);
          if (held.length !== 96) throw new Error(`expected 96 held V2 authoring rows, got ${held.length}`);
          if (servingV2.some(row => row.v2_direction === 'they')) throw new Error('reverse-direction row leaked into serving bundle');
          const admin = JSON.parse(fs.readFileSync('apps/admin/public/generated/admin-hook-catalog-index-v1.json', 'utf8'));
          const adminV2 = admin.rows.filter(row => row.key.includes('/pair-daily/v2/'));
          if (adminV2.length !== 120) throw new Error(`expected all 120 V2 rows in Content Studio catalog, got ${adminV2.length}`);
          console.log('V2 packaging boundary verified: 24 reader-eligible, 96 held, 120 Content Studio-visible.');
          NODE
      - name: Commit staged package projection
        run: |
          if git diff --quiet; then
            echo "No packaging changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-fallback-package-manifest.mjs scripts/build-admin-hook-catalog.mjs apps/web/src/content/fallbackArchitectureV3/bundled-*.json apps/web/src/content/fallbackArchitectureV3/approved-serving-*.json apps/admin/public/generated apps/web/public/generated
          git commit -m "build(friends): stage Between You Two V2 package projection"
          git push origin HEAD:owner/between-you-two-v2-20260905

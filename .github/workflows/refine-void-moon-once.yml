name: Verify void Moon patch formatting

on:
  push:
    branches: [codex/refine-same-day-void-moon]
    paths: [.github/workflows/refine-void-moon-once.yml]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'usrnmtkn/astrology-portal' && github.ref == 'refs/heads/codex/refine-same-day-void-moon'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/refine-same-day-void-moon
          fetch-depth: 1
      - name: Normalize only the new block's indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/content/skyDailySummary.ts')
          original = path.read_text()
          start = original.index('  const remaining = facts.voidRemainingLabel?.trim()')
          end = original.index('  // Resolve transitions in the order chosen', start)
          lines = original[start:end].splitlines()
          assert lines[1].startswith('  .replace(')
          block = lines[0] + '\n' + '\n'.join('  ' + line if line else '' for line in lines[1:]) + '\n'
          revised = original[:start] + block + original[end:]
          assert ''.join(original.split()) == ''.join(revised.split())
          path.write_text(revised)
          tests = Path('scripts/test-sky-daily-summary.mts')
          tests.write_text(tests.read_text().rstrip() + '\n')
          PY
          git diff --check
          git diff -w --ignore-blank-lines --exit-code -- apps/web/src/content/skyDailySummary.ts scripts/test-sky-daily-summary.mts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Recheck focused rendering tests
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/test-sky-daily-summary.mts
          node --import tsx scripts/test-sky-summary-assembly.mts
          node --import tsx scripts/test-sky-summary-event-grammar.mts
          node --import tsx scripts/test-sky-summary-composition.mts
          node --import tsx scripts/test-sky-moon-v6.mts
          node scripts/test-calendar-timing-event-copy.mjs
      - name: Commit whitespace cleanup and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'codex/refine-same-day-void-moon'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refine-void-moon-once.yml
          git add apps/web/src/content/skyDailySummary.ts scripts/test-sky-daily-summary.mts
          git diff --cached --check
          git commit -m 'Normalize void Moon refinement formatting'
          git push origin HEAD:refs/heads/codex/refine-same-day-void-moon

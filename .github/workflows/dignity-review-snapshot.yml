name: Dignity review source snapshot

on:
  push:
    branches: ['codex/planet-sign-dignity-20260916']
    paths: ['.github/workflows/dignity-review-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked source for isolated local verification
        run: |
          git archive --format=tar.gz --output=source.tar.gz HEAD
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@v6
        with:
          name: dignity-review-source
          path: |
            source.tar.gz
            source-commit.txt
          retention-days: 1

name: Placement article inline variable work
on:
  push:
    branches: [codex/placement-article-inline-vars]
    paths:
      - .github/workflows/placement-article-inline-work.yml
      - scripts/apply-placement-article-inline-vars.py
permissions:
  contents: write
concurrency:
  group: placement-article-inline-work
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed source changes in isolated checkout
        run: |
          test "$(git branch --show-current)" = "codex/placement-article-inline-vars"
          python3 scripts/apply-placement-article-inline-vars.py
          git diff --check
          node scripts/test-sky-placement-article-variable-unit.mjs
      - run: npm ci
      - name: Build knowledge and regenerate shipped resolver
        run: |
          npm run build:knowledge
          ./node_modules/.bin/esbuild apps/web/src/content/fallbackArchitectureV3/resolver/index.browser.ts --bundle --format=esm --outfile=apps/web/src/content/fallbackArchitectureV3/dist/tldr-content.js
          npm run build:fallback-manifest
          (cd apps/web/src/content/fallbackArchitectureV3 && node admin/build-content-book.mjs)
      - name: Record implementation on its feature branch
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add apps/web/src/content/fallbackArchitectureV3/resolver/skyWritingLibraryRegistry.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Enable editable phrase variables in Placement articles end to end"
            git push origin HEAD:codex/placement-article-inline-vars
          fi
      - name: Node browser and shipped placement parity plus API round-trips
        id: placement
        continue-on-error: true
        run: npm run test:sky-evergreen-sections
      - name: Content Studio publication and storage regressions
        id: api
        continue-on-error: true
        run: npm run test:content-studio-api
      - name: Reader copy boundary
        id: boundary
        continue-on-error: true
        run: npm run test:reader-copy-boundary
      - name: CSS and Studio component architecture
        id: css
        continue-on-error: true
        run: npm run qa:css-audit
      - name: Build Content Studio
        id: admin
        continue-on-error: true
        run: npm run build:admin
      - name: Build production web entry
        id: web
        continue-on-error: true
        run: npm run build:web
      - name: Install browser
        if: steps.admin.outcome == 'success'
        run: npx playwright install --with-deps chromium
      - name: Test article authoring in light dark desktop and mobile
        id: browser
        if: steps.admin.outcome == 'success'
        continue-on-error: true
        run: npx playwright test --config=playwright.sky-article.config.ts
      - name: Collect review evidence
        if: always()
        run: |
          mkdir -p /tmp/article-evidence
          git diff --stat > /tmp/article-evidence/post-build-diff.txt
          git log -2 --oneline > /tmp/article-evidence/commits.txt
          python3 - <<'PY'
          import pathlib, zipfile, subprocess
          paths = subprocess.check_output(['git','diff','--name-only','HEAD~1..HEAD'],text=True).splitlines()
          paths += ['apps/admin/src/SkyPlacementArticleVariables.tsx','apps/web/src/content/fallbackArchitectureV3/resolver/skyPlacementArticleVariables.mjs','scripts/test-sky-placement-article-variables.mts','tests/visual/sky-placement-article-phrases.spec.ts']
          with zipfile.ZipFile('/tmp/article-evidence/changed-sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(set(paths)):
                  if pathlib.Path(p).is_file(): z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: placement-article-verification
          path: |
            /tmp/article-evidence/
            test-results/
          retention-days: 2
      - name: Require every verification gate
        if: always()
        env:
          PLACEMENT: ${{ steps.placement.outcome }}
          API: ${{ steps.api.outcome }}
          BOUNDARY: ${{ steps.boundary.outcome }}
          CSS: ${{ steps.css.outcome }}
          ADMIN: ${{ steps.admin.outcome }}
          WEB: ${{ steps.web.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          for name in PLACEMENT API BOUNDARY CSS ADMIN WEB BROWSER; do
            echo "$name=${!name}"
            test "${!name}" = success || exit 1
          done

name: Placement article inline variable work
on:
  push:
    branches: [codex/placement-article-inline-vars]
    paths: [.github/workflows/placement-article-inline-work.yml]
permissions:
  contents: write
concurrency:
  group: placement-article-inline-work
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v6
        with: {node-version: 22, cache: npm}
      - name: Keep local phrase edits in the current article draft
        run: |
          python3 scripts/refine-inline-phrase-editing.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/SkyPlacementArticleVariables.tsx tests/visual/sky-placement-article-phrases.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "Edit phrase values inline without reopening or discarding the article draft"
            git push origin HEAD:codex/placement-article-inline-vars
          fi
      - run: npm ci
      - run: npm run build:knowledge
      - name: Placement save publish and reader regressions
        id: placement
        continue-on-error: true
        shell: bash {0}
        run: |
          mkdir -p verification-logs
          export NODE_OPTIONS="--import $GITHUB_WORKSPACE/scripts/register-test-css.mjs"
          npm run test:sky-evergreen-sections > verification-logs/placement.txt 2>&1; code=$?; tail -80 verification-logs/placement.txt; exit $code
      - name: Build standalone Content Studio
        id: admin
        continue-on-error: true
        shell: bash {0}
        run: |
          export NODE_OPTIONS="--import $GITHUB_WORKSPACE/scripts/register-test-css.mjs"
          npm run build:admin > verification-logs/admin.txt 2>&1; code=$?; tail -80 verification-logs/admin.txt; exit $code
      - name: Collect executable browser review build and fixture
        if: steps.admin.outcome == 'success'
        run: |
          node --import tsx --input-type=module -e "import fs from 'node:fs'; import {skyPlacementSourceRecords} from './api/_lib/sky-placement-sources.ts'; fs.writeFileSync('verification-logs/sky-fixture.json', JSON.stringify(Object.fromEntries(skyPlacementSourceRecords)));"
          (cd apps/admin && zip -qr ../../verification-logs/admin-preview.zip dist)
      - uses: actions/upload-artifact@v4
        if: steps.admin.outcome == 'success'
        with:
          name: article-browser-preview
          path: |
            verification-logs/admin-preview.zip
            verification-logs/sky-fixture.json
          retention-days: 1
      - name: Install browser
        if: steps.admin.outcome == 'success'
        run: npx playwright install --with-deps chromium > verification-logs/browser-install.txt 2>&1
      - name: Browser article authoring
        id: browser
        if: steps.admin.outcome == 'success'
        continue-on-error: true
        run: npx playwright test --config=playwright.sky-article.config.ts --max-failures=1 2>&1 | tee verification-logs/browser.txt
      - name: Record final outcomes
        if: always()
        env:
          PLACEMENT: ${{ steps.placement.outcome }}
          ADMIN: ${{ steps.admin.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          mkdir -p verification-logs
          for name in PLACEMENT ADMIN BROWSER; do echo "$name=${!name}"; done | tee verification-logs/outcomes.txt
          git status --short > verification-logs/git-status.txt
          git log -1 --oneline > verification-logs/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: placement-article-verification
          path: |
            verification-logs/*.txt
            test-results/
          retention-days: 2
      - name: Require verification gates
        if: always()
        run: '! grep -E "=(failure|skipped)$" verification-logs/outcomes.txt'

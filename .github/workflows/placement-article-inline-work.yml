name: Placement article inline variable work
on:
  push:
    branches: [codex/placement-article-inline-vars]
    paths: [.github/workflows/placement-article-inline-work.yml]
permissions:
  contents: write
concurrency:
  group: placement-article-inline-work
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v6
        with: {node-version: 22, cache: npm}
      - name: Apply isolated fixture correction
        run: |
          python3 scripts/finalize-placement-article-tests.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-sky-placement-studio-api.mts
          if ! git diff --cached --quiet; then
            git commit -m "Separate missing-library publication fixture from custom motion source requirements"
            git push origin HEAD:codex/placement-article-inline-vars
          fi
      - run: npm ci
      - run: npm run build:knowledge
      - name: Article publication roundtrips
        id: roundtrip
        continue-on-error: true
        run: |
          mkdir -p verification-logs
          export NODE_OPTIONS="--import $GITHUB_WORKSPACE/scripts/register-test-css.mjs"
          node --import tsx scripts/test-sky-placement-studio-api.mts > verification-logs/roundtrip.txt 2>&1; code=$?; tail -80 verification-logs/roundtrip.txt; exit $code
        shell: bash {0}
      - name: Placement resolver regressions
        id: placement
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--import $GITHUB_WORKSPACE/scripts/register-test-css.mjs"
          npm run test:sky-evergreen-sections > verification-logs/placement.txt 2>&1; code=$?; tail -80 verification-logs/placement.txt; exit $code
        shell: bash {0}
      - name: Content Studio API regressions
        id: api
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--import $GITHUB_WORKSPACE/scripts/register-test-css.mjs"
          npm run test:content-studio-api > verification-logs/api.txt 2>&1; code=$?; tail -80 verification-logs/api.txt; exit $code
        shell: bash {0}
      - name: Build standalone Content Studio
        id: admin
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--import $GITHUB_WORKSPACE/scripts/register-test-css.mjs"
          npm run build:admin > verification-logs/admin.txt 2>&1; code=$?; tail -80 verification-logs/admin.txt; exit $code
        shell: bash {0}
      - name: Install browser
        if: steps.admin.outcome == 'success'
        run: npx playwright install --with-deps chromium > verification-logs/browser-install.txt 2>&1
      - name: Browser article authoring
        id: browser
        if: steps.admin.outcome == 'success'
        continue-on-error: true
        run: npx playwright test --config=playwright.sky-article.config.ts 2>&1 | tee verification-logs/browser.txt
      - name: Record final outcomes
        if: always()
        env:
          ROUNDTRIP: ${{ steps.roundtrip.outcome }}
          PLACEMENT: ${{ steps.placement.outcome }}
          API: ${{ steps.api.outcome }}
          ADMIN: ${{ steps.admin.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          mkdir -p verification-logs
          for name in ROUNDTRIP PLACEMENT API ADMIN BROWSER; do echo "$name=${!name}"; done | tee verification-logs/outcomes.txt
          git status --short > verification-logs/git-status.txt
          git log -1 --oneline > verification-logs/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: placement-article-verification
          path: |
            verification-logs/
            test-results/
          retention-days: 2
      - name: Require verification gates
        if: always()
        run: '! grep -E "=(failure|skipped)$" verification-logs/outcomes.txt'

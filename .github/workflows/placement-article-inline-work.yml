name: Placement article inline variable work
on:
  push:
    branches: [codex/placement-article-inline-vars]
    paths:
      - .github/workflows/placement-article-inline-work.yml
      - scripts/refine-placement-article-inline-vars.py
permissions:
  contents: write
concurrency:
  group: placement-article-inline-work
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Refine article sources without changing fallback modules
        run: |
          test "$(git branch --show-current)" = "codex/placement-article-inline-vars"
          python3 scripts/refine-placement-article-inline-vars.py
          git diff --check
          node scripts/test-sky-placement-article-variable-unit.mjs
      - run: npm ci
      - name: Regenerate the source integrity index and knowledge build
        run: |
          node scripts/build-knowledge-index.mjs --write
          npm run build:knowledge
      - name: Commit reviewed refinements and generated index
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Preserve article source state and refresh generated source integrity index"
            git push origin HEAD:codex/placement-article-inline-vars
          fi
      - name: Prepare Node-only stylesheet test harness
        run: echo "NODE_OPTIONS=--import $GITHUB_WORKSPACE/scripts/register-test-css.mjs" >> "$GITHUB_ENV"
      - name: Actual article save publish and reader round trips
        id: roundtrip
        continue-on-error: true
        run: node --import tsx scripts/test-sky-placement-studio-api.mts
      - name: All placement resolver regressions
        id: placement
        continue-on-error: true
        run: npm run test:sky-evergreen-sections
      - name: Content Studio API regressions
        id: api
        continue-on-error: true
        run: npm run test:content-studio-api
      - name: Reader copy boundary
        id: boundary
        continue-on-error: true
        run: npm run test:reader-copy-boundary
      - name: CSS token and typography consistency
        id: css
        continue-on-error: true
        run: |
          node scripts/run-css-consistency-audit.mjs
          node scripts/run-css-token-integrity-audit.mjs
      - name: Compare architecture findings with unchanged main baseline
        id: baseline
        continue-on-error: true
        run: |
          mkdir -p test-results/article-baseline
          python3 - <<'PY'
          import pathlib, subprocess, re, json
          baseline='b259099352e1f73eeac0b3a90528bb661be213bf'
          paths=subprocess.check_output(['git','ls-files','apps/admin/src'],text=True).splitlines()
          def findings(ref=None):
              rows=[]
              for p in paths:
                  if not re.search(r'\.[jt]sx?$',p):continue
                  if ref:
                      res=subprocess.run(['git','show',ref+':'+p],text=True,capture_output=True)
                      if res.returncode:continue
                      text=res.stdout
                  else:text=pathlib.Path(p).read_text()
                  for m in re.finditer(r'''(?:import\s*(?:\(\s*)?|from\s*)["']([^"']+\.css)["']''',text):
                      if m[1]!='./studio-system.css':rows.append(p+' -> '+m[1])
              return sorted(rows)
          before,after=findings(baseline),findings()
          pathlib.Path('test-results/article-baseline/css-imports.json').write_text(json.dumps({'baseline':baseline,'existing':before,'current':after},indent=2))
          print('Existing baseline architecture findings:',json.dumps(before,indent=2))
          assert before==after,'New noncanonical CSS imports introduced'
          print('PASS: feature introduces no new CSS architecture findings. Existing baseline findings are recorded, not suppressed.')
          PY
      - name: Build standalone Studio
        id: admin
        continue-on-error: true
        run: npm run build:admin
      - name: Build production web entry with real stylesheet bundling
        id: web
        continue-on-error: true
        run: NODE_OPTIONS='' npm run build:web
      - name: Install browser
        if: steps.admin.outcome == 'success'
        run: npx playwright install --with-deps chromium
      - name: Browser article authoring in light dark desktop and mobile
        id: browser
        if: steps.admin.outcome == 'success'
        continue-on-error: true
        run: NODE_OPTIONS='' npx playwright test --config=playwright.sky-article.config.ts
      - name: Collect verification evidence
        if: always()
        run: |
          mkdir -p test-results/article-evidence
          git status --short > test-results/article-evidence/post-build-diff.txt
          git log -2 --oneline > test-results/article-evidence/commits.txt
          python3 - <<'PY'
          import pathlib, zipfile, subprocess
          paths=subprocess.check_output(['git','diff','--name-only','b259099352e1f73eeac0b3a90528bb661be213bf..HEAD'],text=True).splitlines()
          with zipfile.ZipFile('test-results/article-evidence/changed-sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(set(paths)):
                  if pathlib.Path(p).is_file():z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: placement-article-verification
          path: test-results/
          retention-days: 2
      - name: Require feature and regression verification gates
        if: always()
        env:
          ROUNDTRIP: ${{ steps.roundtrip.outcome }}
          PLACEMENT: ${{ steps.placement.outcome }}
          API: ${{ steps.api.outcome }}
          BOUNDARY: ${{ steps.boundary.outcome }}
          CSS: ${{ steps.css.outcome }}
          BASELINE: ${{ steps.baseline.outcome }}
          ADMIN: ${{ steps.admin.outcome }}
          WEB: ${{ steps.web.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          failed=0
          for name in ROUNDTRIP PLACEMENT API BOUNDARY CSS BASELINE ADMIN WEB BROWSER; do
            echo "$name=${!name}"
            test "${!name}" = success || failed=1
          done
          exit "$failed"

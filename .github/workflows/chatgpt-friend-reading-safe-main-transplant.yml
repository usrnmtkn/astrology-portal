name: ChatGPT Friends Reading Safe Main Transplant

on:
  push:
    branches:
      - chatgpt/friend-transit-reading-v1-safe-main-20260906

permissions:
  contents: write

jobs:
  transplant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/friend-transit-reading-v1-safe-main-20260906
          fetch-depth: 0
      - name: Apply validated Friends reading delta
        run: |
          git fetch origin chatgpt/friend-transit-reading-v1-20260906
          git diff fb9a9897f2d83d581a26bfd5e488c22b196bde1e..origin/chatgpt/friend-transit-reading-v1-20260906 -- \
            api/_lib/content-generation.ts \
            api/_lib/friend-transit-reading.ts \
            api/_lib/provider-config.ts \
            api/generate-user-content.ts \
            apps/web/src/features/friends/FriendTransitsTab.tsx \
            apps/web/src/features/friends/ManualChartsPanel.tsx \
            apps/web/src/services/userGeneratedContent.ts \
            scripts/test-friend-transit-reading-contract.mts \
            scripts/test-friend-transit-reading-request-render.mjs \
            src/astro-writing/productionEvidenceAdapter.cjs \
            src/astro-writing/productionPreCallGate.cjs \
            src/astro-writing/validateCopy.mjs \
            > /tmp/friend-reading.patch
          git apply --3way /tmp/friend-reading.patch
      - name: Verify no calculation or birth-time drift
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          allowed='^(api/_lib/content-generation\.ts|api/_lib/friend-transit-reading\.ts|api/_lib/provider-config\.ts|api/generate-user-content\.ts|apps/web/src/features/friends/FriendTransitsTab\.tsx|apps/web/src/features/friends/ManualChartsPanel\.tsx|apps/web/src/services/userGeneratedContent\.ts|scripts/test-friend-transit-reading-contract\.mts|scripts/test-friend-transit-reading-request-render\.mjs|src/astro-writing/productionEvidenceAdapter\.cjs|src/astro-writing/productionPreCallGate\.cjs|src/astro-writing/validateCopy\.mjs)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "$bad" >&2
            exit 1
          fi
          for protected in \
            apps/web/src/App.tsx \
            apps/web/src/services/chartMath.ts \
            apps/web/src/services/natalAngleReliability.ts \
            apps/web/src/features/friends/useManualChartsController.ts; do
            if printf '%s\n' "$changed" | grep -qx "$protected"; then
              echo "Protected calculation/birth-time file changed: $protected" >&2
              exit 1
            fi
          done
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/test-friend-transit-reading-contract.mts
      - run: node scripts/test-friend-transit-reading-request-render.mjs
      - run: node --import tsx scripts/test-friend-natal-chart-completeness.mjs
      - run: npm run typecheck
      - run: npm run build:knowledge
      - run: npm run build:web
      - name: Commit safe-main integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api/_lib/content-generation.ts \
            api/_lib/friend-transit-reading.ts \
            api/_lib/provider-config.ts \
            api/generate-user-content.ts \
            apps/web/src/features/friends/FriendTransitsTab.tsx \
            apps/web/src/features/friends/ManualChartsPanel.tsx \
            apps/web/src/services/userGeneratedContent.ts \
            scripts/test-friend-transit-reading-contract.mts \
            scripts/test-friend-transit-reading-request-render.mjs \
            src/astro-writing/productionEvidenceAdapter.cjs \
            src/astro-writing/productionPreCallGate.cjs \
            src/astro-writing/validateCopy.mjs
          git commit -m "Add governed Friends transit reading V1"
          git push origin HEAD:chatgpt/friend-transit-reading-v1-safe-main-20260906

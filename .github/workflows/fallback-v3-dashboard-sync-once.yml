name: One-time fallback V3 dashboard export

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fallback-v3-dashboard-sync-once.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Materialize canonical Content Studio mirror
        run: node scripts/materialize-fallback-architecture-v3-dashboard-rows.mjs --out=/tmp/fallback-v3-dashboard-rows.json
      - name: Upload canonical mirror
        uses: actions/upload-artifact@v4
        with:
          name: fallback-v3-dashboard-rows
          path: /tmp/fallback-v3-dashboard-rows.json
          if-no-files-found: error

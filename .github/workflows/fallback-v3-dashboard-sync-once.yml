name: One-time fallback V3 dashboard migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fallback-v3-dashboard-sync-once.yml

permissions:
  contents: write

jobs:
  stage-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Materialize canonical Content Studio mirror
        run: node scripts/materialize-fallback-architecture-v3-dashboard-rows.mjs --out=/tmp/fallback-v3-dashboard-rows.json
      - name: Create migration with Supabase CLI
        run: |
          supabase --help >/dev/null
          supabase migration new --help >/dev/null
          (
            cd apps/web
            supabase migration new content_studio_transit_friends_mirror
          )
          MIGRATION_PATH="$(find apps/web/supabase/migrations -maxdepth 1 -type f -name '*_content_studio_transit_friends_mirror.sql' | sort | tail -1)"
          test -n "$MIGRATION_PATH"
          echo "MIGRATION_PATH=$MIGRATION_PATH" >> "$GITHUB_ENV"
      - name: Write guarded canonical transit mirror migration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';

          const generated = JSON.parse(fs.readFileSync('/tmp/fallback-v3-dashboard-rows.json', 'utf8'));
          const rows = generated.rows.filter((row) => row.content_key.startsWith('authored/transit-aspect/'));
          const protectedKey = 'authored/transit-aspect/venus/moon/hard';
          const protectedYouSha = '254f56e3bb9ed7b1d29215b2aa3e92d22877c24925932e703a097ceb2416334a';
          const isExplicitFriend = (row) => typeof row.sections?.body_they === 'string' && row.sections.body_they.trim();
          const sunRows = rows.filter((row) => row.content_key.startsWith('authored/transit-aspect/sun/'));
          const nonSunRows = rows.filter((row) => !row.content_key.startsWith('authored/transit-aspect/sun/'));
          const protectedRow = rows.find((row) => row.content_key === protectedKey);

          if (rows.length !== 378) throw new Error(`Expected 378 transit rows, found ${rows.length}.`);
          if (sunRows.length !== 27) throw new Error(`Expected 27 Sun rows, found ${sunRows.length}.`);
          if (rows.filter(isExplicitFriend).length !== 377) throw new Error('Expected 377 explicit Friends bodies.');
          if (nonSunRows.filter(isExplicitFriend).length !== 350) throw new Error('Expected 350 explicit non-Sun Friends bodies.');
          if (!protectedRow || protectedRow.sections?.body_they !== null) throw new Error('Protected Venus square Moon Friends body must be null in the canonical materialization.');
          if (createHash('sha256').update(protectedRow.sections?.body_you ?? '').digest('hex') !== protectedYouSha) {
            throw new Error('Protected Venus square Moon You SHA drifted before migration generation.');
          }
          if (rows.filter(isExplicitFriend).some((row) => !row.sections?.packageRecord?.body_they_sha256)) {
            throw new Error('Every explicit Friends body must carry a package-record SHA-256.');
          }

          const fields = [
            'content_key', 'surface', 'mode', 'status', 'event_type', 'target_date',
            'headline', 'summary', 'body', 'sections', 'block_type', 'lane',
            'review_state', 'evergreen', 'evergreen_at', 'evergreen_by', 'facts',
            'knowledge_ids', 'source_snapshot', 'reviewer_notes', 'prompt_version',
            'provider', 'model', 'updated_at'
          ];
          const payloadRows = rows.map((row) => Object.fromEntries(fields.map((field) => [field, row[field] ?? null])));
          const payload = JSON.stringify(payloadRows);
          const tag = '$tldr_transit_v3$';
          if (payload.includes(tag)) throw new Error('Unexpected SQL dollar-quote tag collision.');

          const sql = `-- Bounded canonical Content Studio mirror for the Friends transit release.\n-- Generated from fallback V3 package ${generated.packageManifest.packageVersion}.\n-- Guards fail closed if any current You copy or preserved Sun Friends copy has drifted.\n\ncreate temp table expected_transit_dashboard_rows on commit drop as\nselect *\nfrom jsonb_to_recordset(${tag}${payload}${tag}::jsonb) as x(\n  content_key text,\n  surface text,\n  mode text,\n  status text,\n  event_type text,\n  target_date date,\n  headline text,\n  summary text,\n  body text,\n  sections jsonb,\n  block_type text,\n  lane text,\n  review_state text,\n  evergreen boolean,\n  evergreen_at timestamptz,\n  evergreen_by text,\n  facts jsonb,\n  knowledge_ids text[],\n  source_snapshot jsonb,\n  reviewer_notes text,\n  prompt_version text,\n  provider text,\n  model text,\n  updated_at timestamptz\n);\n\ndo $guard$\ndeclare\n  live_count integer;\n  live_distinct_count integer;\n  expected_count integer;\n  you_drift_count integer;\n  sun_friend_drift_count integer;\n  existing_friend_count integer;\n  existing_nonsun_friend_count integer;\nbegin\n  select count(*), count(distinct content_key) into live_count, live_distinct_count\n  from public.generated_interpretations\n  where provider = 'tldrastro-fallback-architecture-v3'\n    and content_key like 'authored/transit-aspect/%';\n\n  select count(*) into expected_count from expected_transit_dashboard_rows;\n\n  if live_count <> 378 or live_distinct_count <> 378 or expected_count <> 378 then\n    raise exception 'Transit mirror precondition failed: live %, distinct %, expected %', live_count, live_distinct_count, expected_count;\n  end if;\n\n  select count(*) into you_drift_count\n  from expected_transit_dashboard_rows e\n  join public.generated_interpretations g\n    on g.content_key = e.content_key\n   and g.provider = 'tldrastro-fallback-architecture-v3'\n  where encode(digest(coalesce(g.sections->>'body_you', ''), 'sha256'), 'hex')\n        is distinct from\n        encode(digest(coalesce(e.sections->>'body_you', ''), 'sha256'), 'hex');\n\n  if you_drift_count <> 0 then\n    raise exception 'Refusing transit mirror sync: % live You rows drift from the canonical package', you_drift_count;\n  end if;\n\n  select count(*) into existing_friend_count\n  from public.generated_interpretations\n  where provider = 'tldrastro-fallback-architecture-v3'\n    and content_key like 'authored/transit-aspect/%'\n    and coalesce(nullif(trim(sections->>'body_they'), ''), '') <> '';\n\n  select count(*) into existing_nonsun_friend_count\n  from public.generated_interpretations\n  where provider = 'tldrastro-fallback-architecture-v3'\n    and content_key like 'authored/transit-aspect/%'\n    and content_key not like 'authored/transit-aspect/sun/%'\n    and coalesce(nullif(trim(sections->>'body_they'), ''), '') <> '';\n\n  if existing_friend_count <> 27 or existing_nonsun_friend_count <> 0 then\n    raise exception 'Unexpected pre-release Friends baseline: explicit %, non-Sun %', existing_friend_count, existing_nonsun_friend_count;\n  end if;\n\n  select count(*) into sun_friend_drift_count\n  from expected_transit_dashboard_rows e\n  join public.generated_interpretations g\n    on g.content_key = e.content_key\n   and g.provider = 'tldrastro-fallback-architecture-v3'\n  where e.content_key like 'authored/transit-aspect/sun/%'\n    and encode(digest(coalesce(g.sections->>'body_they', ''), 'sha256'), 'hex')\n        is distinct from\n        encode(digest(coalesce(e.sections->>'body_they', ''), 'sha256'), 'hex');\n\n  if sun_friend_drift_count <> 0 then\n    raise exception 'Refusing transit mirror sync: % preserved Sun Friends rows drift from canonical package', sun_friend_drift_count;\n  end if;\n\n  if exists (\n    select 1\n    from public.generated_interpretations\n    where provider = 'tldrastro-fallback-architecture-v3'\n      and content_key = '${protectedKey}'\n      and (\n        sections->>'body_they' is not null\n        or encode(digest(coalesce(sections->>'body_you', ''), 'sha256'), 'hex') <> '${protectedYouSha}'\n      )\n  ) then\n    raise exception 'Protected Venus square Moon live row drifted before sync';\n  end if;\nend\n$guard$;\n\nupdate public.generated_interpretations g\nset\n  surface = e.surface,\n  mode = e.mode,\n  status = e.status,\n  event_type = e.event_type,\n  target_date = e.target_date,\n  headline = e.headline,\n  summary = e.summary,\n  body = e.body,\n  sections = e.sections,\n  block_type = e.block_type,\n  lane = e.lane,\n  review_state = e.review_state,\n  evergreen = e.evergreen,\n  evergreen_at = e.evergreen_at,\n  evergreen_by = e.evergreen_by,\n  facts = e.facts,\n  knowledge_ids = coalesce(e.knowledge_ids, '{}'::text[]),\n  source_snapshot = e.source_snapshot,\n  reviewer_notes = e.reviewer_notes,\n  prompt_version = e.prompt_version,\n  provider = e.provider,\n  model = e.model,\n  updated_at = e.updated_at\nfrom expected_transit_dashboard_rows e\nwhere g.content_key = e.content_key\n  and g.provider = 'tldrastro-fallback-architecture-v3';\n\ndo $verify$\ndeclare\n  mismatch_count integer;\n  explicit_friend_count integer;\n  explicit_sun_friend_count integer;\n  explicit_nonsun_friend_count integer;\n  friend_hash_drift_count integer;\nbegin\n  select count(*) into mismatch_count\n  from expected_transit_dashboard_rows e\n  join public.generated_interpretations g\n    on g.content_key = e.content_key\n   and g.provider = 'tldrastro-fallback-architecture-v3'\n  where g.surface is distinct from e.surface\n     or g.mode is distinct from e.mode\n     or g.status is distinct from e.status\n     or g.event_type is distinct from e.event_type\n     or g.target_date is distinct from e.target_date\n     or g.headline is distinct from e.headline\n     or g.summary is distinct from e.summary\n     or g.body is distinct from e.body\n     or g.sections is distinct from e.sections\n     or g.block_type is distinct from e.block_type\n     or g.lane is distinct from e.lane\n     or g.review_state is distinct from e.review_state\n     or g.facts is distinct from e.facts\n     or g.source_snapshot is distinct from e.source_snapshot\n     or g.prompt_version is distinct from e.prompt_version\n     or g.provider is distinct from e.provider\n     or g.model is distinct from e.model;\n\n  if mismatch_count <> 0 then\n    raise exception 'Canonical transit mirror verification failed for % rows', mismatch_count;\n  end if;\n\n  select\n    count(*) filter (where coalesce(nullif(trim(sections->>'body_they'), ''), '') <> ''),\n    count(*) filter (where content_key like 'authored/transit-aspect/sun/%' and coalesce(nullif(trim(sections->>'body_they'), ''), '') <> ''),\n    count(*) filter (where content_key not like 'authored/transit-aspect/sun/%' and coalesce(nullif(trim(sections->>'body_they'), ''), '') <> '')\n  into explicit_friend_count, explicit_sun_friend_count, explicit_nonsun_friend_count\n  from public.generated_interpretations\n  where provider = 'tldrastro-fallback-architecture-v3'\n    and content_key like 'authored/transit-aspect/%';\n\n  if explicit_friend_count <> 377 or explicit_sun_friend_count <> 27 or explicit_nonsun_friend_count <> 350 then\n    raise exception 'Friends count verification failed: total %, Sun %, non-Sun %', explicit_friend_count, explicit_sun_friend_count, explicit_nonsun_friend_count;\n  end if;\n\n  select count(*) into friend_hash_drift_count\n  from public.generated_interpretations\n  where provider = 'tldrastro-fallback-architecture-v3'\n    and content_key like 'authored/transit-aspect/%'\n    and coalesce(nullif(trim(sections->>'body_they'), ''), '') <> ''\n    and (\n      sections->'packageRecord'->>'body_they_sha256' is null\n      or sections->'packageRecord'->>'body_they_sha256' <> encode(digest(sections->>'body_they', 'sha256'), 'hex')\n    );\n\n  if friend_hash_drift_count <> 0 then\n    raise exception 'Friends SHA verification failed for % rows', friend_hash_drift_count;\n  end if;\n\n  if exists (\n    select 1\n    from public.generated_interpretations\n    where provider = 'tldrastro-fallback-architecture-v3'\n      and content_key = '${protectedKey}'\n      and (\n        sections->>'body_they' is not null\n        or encode(digest(coalesce(sections->>'body_you', ''), 'sha256'), 'hex') <> '${protectedYouSha}'\n      )\n  ) then\n    raise exception 'Protected Venus square Moon verification failed after sync';\n  end if;\nend\n$verify$;\n`;

          fs.writeFileSync(process.env.MIGRATION_PATH, sql);
          console.log(`wrote guarded transit mirror migration: ${process.env.MIGRATION_PATH}`);
          NODE
      - name: Commit bounded migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MIGRATION_PATH"
          git diff --cached --check
          git commit -m "data(content-studio): sync approved Friends transit mirror"
          git push origin HEAD:main

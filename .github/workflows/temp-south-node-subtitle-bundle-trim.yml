name: Temporary South Node subtitle bundle trim

on:
  push:
    branches:
      - fix/south-node-paired-subtitle-20260907

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/south-node-paired-subtitle-20260907
      - name: Move paired-node parsing into shared aspect utility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          utility_path = Path('apps/web/src/utils/articleAspects.ts')
          utility = utility_path.read_text()
          helper = '''\nexport function pairedSouthNodeAspectParagraph(heading: string, paragraph: string) {\n  const match = heading.endsWith("North Node")\n    ? paragraph.match(/^South Node \\(([^)]+)\\):\\s*(.*)$/su)\n    : null;\n  const from = match ? articleAspectGlyphPartsFromHeading(heading)?.from : null;\n\n  return match && from\n    ? [`${from} ${match[1][0].toUpperCase()}${match[1].slice(1)} South Node`, match[2]] as const\n    : null;\n}\n'''
          if 'export function pairedSouthNodeAspectParagraph' not in utility:
              utility_path.write_text(utility.rstrip() + '\n' + helper)

          detail_path = Path('apps/web/src/features/sky/SkyDetailArticle.tsx')
          detail = detail_path.read_text()
          detail = detail.replace(
              '  articleAspectGlyphPartsFromHeading,\n  articleAspectTypeFromText,\n  normalizedArticleAspectToneBucket\n',
              '  articleAspectGlyphPartsFromHeading,\n  articleAspectTypeFromText,\n  normalizedArticleAspectToneBucket,\n  pairedSouthNodeAspectParagraph\n',
              1
          )
          old_prep = '''                      const southNodeMatch = sectionHeading.endsWith("North Node")\n                        ? bodyParagraphs.find((paragraph) => paragraph.startsWith("South Node ("))?.match(/^South Node \\(([^)]+)\\):\\s*(.*)$/su)\n                        : null;\n                      const southNodeHeading = southNodeMatch\n                        ? `${glyphParts?.from} ${southNodeMatch[1][0].toUpperCase()}${southNodeMatch[1].slice(1)} South Node`\n                        : "";\n'''
          if old_prep not in detail:
              raise SystemExit('paired-node preparation block not found')
          detail = detail.replace(old_prep, '', 1)
          old_render = '''                          {bodyParagraphs.length > 0\n                            ? bodyParagraphs.map((paragraph, paragraphIndex) => southNodeMatch?.[0] === paragraph ? (\n                              <Fragment key={`${section.key}-${paragraphIndex}`}>\n                                <div className="article-related-aspects__copy-heading"><h4>{southNodeHeading}</h4></div>\n                                <p>{southNodeMatch[2]}</p>\n                              </Fragment>\n                            ) : <p key={`${section.key}-${paragraphIndex}`}>{paragraph}</p>)\n                            : <p>{typeof section.body === "string" ? stripLegacySkyArticleScaffoldPrefix(section.body) : section.body}</p>}\n'''
          new_render = '''                          {bodyParagraphs.length > 0\n                            ? bodyParagraphs.map((paragraph, paragraphIndex) => {\n                              const southNode = pairedSouthNodeAspectParagraph(sectionHeading, paragraph);\n                              return southNode ? (\n                                <Fragment key={`${section.key}-${paragraphIndex}`}>\n                                  <div className="article-related-aspects__copy-heading"><h4>{southNode[0]}</h4></div>\n                                  <p>{southNode[1]}</p>\n                                </Fragment>\n                              ) : <p key={`${section.key}-${paragraphIndex}`}>{paragraph}</p>;\n                            })\n                            : <p>{typeof section.body === "string" ? stripLegacySkyArticleScaffoldPrefix(section.body) : section.body}</p>}\n'''
          if old_render not in detail:
              raise SystemExit('paired-node render block not found')
          detail_path.write_text(detail.replace(old_render, new_render, 1))

          test_path = Path('scripts/test-calendar-south-node-serving.mjs')
          test = test_path.read_text()
          old_assertion = r'''/southNodeMatch[\s\S]*?article-related-aspects__copy-heading[\s\S]*?<h4>\{southNodeHeading\}<\/h4>/u'''
          new_assertion = r'''/pairedSouthNodeAspectParagraph[\s\S]*?article-related-aspects__copy-heading[\s\S]*?<h4>\{southNode\[0\]\}<\/h4>/u'''
          if old_assertion not in test:
              raise SystemExit('South Node subtitle assertion target not found')
          test_path.write_text(test.replace(old_assertion, new_assertion, 1))
          PY

          git diff --check
          node scripts/test-calendar-south-node-serving.mjs
          npm ci
          npm run build
          npm run qa:bundle
      - name: Commit trim and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-south-node-subtitle-bundle-trim.yml
          git add apps/web/src/features/sky/SkyDetailArticle.tsx apps/web/src/utils/articleAspects.ts scripts/test-calendar-south-node-serving.mjs
          git commit -m "Keep South Node peer subtitle within Sky bundle budget"
          git push origin HEAD:fix/south-node-paired-subtitle-20260907

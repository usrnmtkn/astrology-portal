name: Temporary South Node subtitle bundle trim

on:
  push:
    branches:
      - fix/south-node-paired-subtitle-20260907

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/south-node-paired-subtitle-20260907
          fetch-depth: 0
      - name: Apply bundle trim
        run: python scripts/temp-trim-south-node-subtitle.py
      - name: Commit trim and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-south-node-subtitle-bundle-trim.yml scripts/temp-trim-south-node-subtitle.py
          git add apps/web/src/features/sky/SkyDetailArticle.tsx apps/web/src/utils/articleAspects.ts scripts/test-calendar-south-node-serving.mjs
          git commit -m "Trim South Node subtitle rendering"
          git push origin HEAD:fix/south-node-paired-subtitle-20260907

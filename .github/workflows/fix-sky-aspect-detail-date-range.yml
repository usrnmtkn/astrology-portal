name: Apply Sky aspect date-range repair

on:
  push:
    branches:
      - fix/sky-aspect-detail-date-range

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/sky-aspect-detail-date-range
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Repair Sky aspect date range
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("apps/web/src/App.tsx")
          source = app_path.read_text()
          start = source.index('function currentSkyAspectTransitWindow(')
          end = source.index('\nfunction fastestSkyAspectPlanet', start)
          replacement = "\n".join([
              'function currentSkyAspectTransitWindow(',
              '  aspect: SkySnapshot["aspects"][number],',
              '  generatedAt: string,',
              '  positions?: PlanetPosition[]',
              ') {',
              '  const reference = new Date(generatedAt);',
              '  const engagementStart = aspect.timing?.engagementStart',
              '    ? new Date(aspect.timing.engagementStart)',
              '    : null;',
              '  const engagementEnd = aspect.timing?.engagementEnd',
              '    ? new Date(aspect.timing.engagementEnd)',
              '    : null;',
              '  const timingContainsReference = Boolean(',
              '    engagementStart',
              '    && engagementEnd',
              '    && !Number.isNaN(reference.getTime())',
              '    && !Number.isNaN(engagementStart.getTime())',
              '    && !Number.isNaN(engagementEnd.getTime())',
              '    && engagementStart <= reference',
              '    && reference <= engagementEnd',
              '  );',
              '',
              '  if (timingContainsReference && engagementStart && engagementEnd) {',
              '    return { start: engagementStart, end: engagementEnd };',
              '  }',
              '',
              '  const firstPosition = skyAspectPosition(aspect.from, positions);',
              '  const secondPosition = skyAspectPosition(aspect.to, positions);',
              '  const firstSpeed = typeof firstPosition?.speed === "number"',
              '    ? firstPosition.speed',
              '    : averageDailyMotion[aspect.from] ?? 0;',
              '  const secondSpeed = typeof secondPosition?.speed === "number"',
              '    ? secondPosition.speed',
              '    : averageDailyMotion[aspect.to] ?? 0;',
              '  const relativeSpeed = Math.max(0.002, Math.abs(firstSpeed - secondSpeed));',
              '  const displayOrb = aspect.type === "quincunx" ? 3 : 5;',
              '  const currentOrb = Math.max(0, Math.min(displayOrb, aspect.orb));',
              '  const applying = aspect.applying !== false;',
              '  const distanceFromEntry = applying',
              '    ? displayOrb - currentOrb',
              '    : displayOrb + currentOrb;',
              '  const distanceToExit = applying',
              '    ? displayOrb + currentOrb',
              '    : displayOrb - currentOrb;',
              '',
              '  return {',
              '    start: dateFromOffsetDays(generatedAt, -(distanceFromEntry / relativeSpeed)),',
              '    end: dateFromOffsetDays(generatedAt, distanceToExit / relativeSpeed)',
              '  };',
              '}',
              '',
              'function currentSkyAspectTransitRange(',
              '  aspect: SkySnapshot["aspects"][number],',
              '  generatedAt: string,',
              '  positions?: PlanetPosition[]',
              ') {',
              '  const window = currentSkyAspectTransitWindow(aspect, generatedAt, positions);',
              '  return skyAspectDateRange(aspect, window.start, window.end);',
              '}',
              ''
          ])
          source = source[:start] + replacement + source[end:]
          source = source.replace(
              '  const timing = currentSkyAspectTransitRange(aspect, generatedAt);\n',
              '  const timing = currentSkyAspectTransitRange(aspect, generatedAt, positions);\n',
              1
          )
          source = source.replace(
              '      dateLine: currentSkyAspectTransitRange(aspect, generatedAt),\n',
              '      dateLine: currentSkyAspectTransitRange(aspect, generatedAt, positions),\n',
              1
          )
          app_path.write_text(source)

          test_lines = [
              'import assert from "node:assert/strict";',
              'import fs from "node:fs";',
              '',
              'const app = fs.readFileSync(new URL("../apps/web/src/App.tsx", import.meta.url), "utf8");',
              '',
              'assert.match(app, /function currentSkyAspectTransitWindow\\([\\s\\S]*?positions\\?: PlanetPosition\\[\\][\\s\\S]*?timingContainsReference[\\s\\S]*?engagementStart <= reference[\\s\\S]*?reference <= engagementEnd/u, "Sky aspect timing may only reuse an engagement window that actually contains the selected sky instant.");',
              'assert.match(app, /const displayOrb = aspect\\.type === "quincunx" \\? 3 : 5/u, "Fallback Sky aspect ranges must use the canonical visible aspect orb rather than the narrower narrative presentation orb.");',
              'assert.match(app, /const relativeSpeed = Math\\.max\\(0\\.002, Math\\.abs\\(firstSpeed - secondSpeed\\)\\)/u, "Fallback Sky aspect ranges must use relative planetary speed.");',
              'assert.match(app, /const distanceFromEntry = applying[\\s\\S]*?displayOrb - currentOrb[\\s\\S]*?displayOrb \\+ currentOrb/u, "Applying aspects must calculate the full entry-to-exit span asymmetrically around the current orb.");',
              'assert.match(app, /const distanceToExit = applying[\\s\\S]*?displayOrb \\+ currentOrb[\\s\\S]*?displayOrb - currentOrb/u, "Separating aspects must preserve the full entry-to-exit span.");',
              'assert.match(app, /const timing = currentSkyAspectTransitRange\\(aspect, generatedAt, positions\\)/u, "Sky aspect detail articles must pass live planetary speeds into range calculation.");',
              'assert.match(app, /dateLine: currentSkyAspectTransitRange\\(aspect, generatedAt, positions\\)/u, "Sky placement aspect beats must use the same corrected date range.");',
              'assert.doesNotMatch(app, /const remainingOrb = Math\\.max\\(0\\.2, aspectWindowOrb - aspect\\.orb\\)/u, "Out-of-presentation-orb aspects must not collapse to a fake same-day range.");',
              '',
              'console.log("Sky aspect detail date-range contract passed.");',
              ''
          ]
          Path("scripts/test-sky-aspect-detail-date-range.mjs").write_text("\n".join(test_lines))
          PY

      - name: Verify focused date-range contract
        run: node scripts/test-sky-aspect-detail-date-range.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build production app
        run: npm run build

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx scripts/test-sky-aspect-detail-date-range.mjs
          git diff --cached --check
          git commit -m "fix(sky): restore full aspect date ranges"
          git push origin HEAD:fix/sky-aspect-detail-date-range

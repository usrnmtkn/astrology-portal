name: Temporary Sky Placement residency aspect pilot validation

on:
  push:
    branches:
      - chatgpt/sky-placement-residency-aspects-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Residency aspect regression
        run: node --import tsx scripts/test-sky-placement-residency-aspects.mts
      - name: TypeScript
        run: npm run typecheck
      - name: Diff check
        run: git diff --check

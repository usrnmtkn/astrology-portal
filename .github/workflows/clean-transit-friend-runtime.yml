name: Clean transit friend runtime diff

on:
  push:
    branches:
      - fix/personal-transit-source-label

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/personal-transit-source-label
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore unrelated relationship loader line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/web/src/content/fallbackArchitectureV3Runtime.ts")
          text = p.read_text()
          old = "localRelationshipReaderBundle = readerEligibleBundle(fallbackArchitectureV3Bundle);"
          new = "localRelationshipReaderBundle = readerEligibleBundle(relationshipFallbackArchitectureV3Bundle);"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one unrelated relationship-loader change, found {text.count(old)}")
          p.write_text(text.replace(old, new))
          PY
      - name: Validate
        run: |
          node scripts/test-content-approval-governance.mjs
          npm run typecheck --if-present
      - name: Commit scoped cleanup and remove one-off workflow
        run: |
          rm .github/workflows/clean-transit-friend-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/content/fallbackArchitectureV3Runtime.ts .github/workflows/clean-transit-friend-runtime.yml
          git commit -m "Keep Personal Transit friend-name runtime change scoped"
          git push origin HEAD:fix/personal-transit-source-label

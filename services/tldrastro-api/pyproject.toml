[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tldrastro-api"
version = "0.1.0"
description = "FastAPI calculation service for TLDR Astro."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.110,<1.0",
  "pydantic>=2.6,<3.0",
  "pyswisseph==2.10.3.2",
  "timezonefinder>=6.5,<7.0",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.27,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.26,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.4,<1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
